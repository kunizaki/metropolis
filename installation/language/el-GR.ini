OFFSITEDIRS_HEADER_MASTER="Επαναφορά του <code>%s</code>"
OFFSITEDIRS_LBL_EXPLANATION="<p>Κατά τη δημιουργία αντιγράφου ασφαλείας του ιστότοπού σας, υπήρχαν ορισμένα αρχεία εκτός του βασικού καταλόγου του ιστότοπου (ο κύριος φάκελος που συμπεριλήφθηκε στο αντίγραφο). Τα εν λόγω αρχεία βρίσκονταν στον φάκελο <code>%s</code>.</p><p>Αυτά τα αρχεία έχουν εξαχθεί προς το παρόν στο <code>%s</code> το οποίο <em>δεν</em> είναι εκεί που πρέπει να βρίσκονται για να λειτουργεί ο ιστότοπός σας. Αυτή είναι απλώς μια προσωρινή τοποθεσία που επιβάλλεται από το γεγονός ότι η εξαγωγή ενός αρχείου δεν μπορεί να δημιουργήσει αρχεία <em>πάνω από</em> τον φάκελο εξαγωγής. Επομένως πρέπει να μετακινήσετε αυτά τα αρχεία για να λειτουργεί ο ιστότοπός σας.</p><p>Μπορείτε να δώσετε την απόλυτη διαδρομή στο σύστημα αρχείων όπου πρέπει να αντιγραφούν παρακάτω. Για πληροφορία σας, ο ιστότοπός σας έχει εξαχθεί προς το παρόν στην απόλυτη διαδρομή συστήματος αρχείων <code>%s</code>.</p>"
