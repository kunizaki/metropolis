FINALISE_LBL_DONTFORGETCONFIG="Πρέπει να δημιουργήσετε το αρχείο <code>%s</code> χρησιμοποιώντας τις πληροφορίες που βρίσκονται παρακάτω για να λειτουργήσει σωστά ο επαναφερόμενος ιστότοπός σας."
FINALISE_HEADER_CONFIGURATION="Δημιουργία του configuration.php"
FINALISE_LBL_ACTION_REQUIRED="Απαιτείται ενέργεια"
FINALISE_LBL_CONFIGINTRO="Το σενάριο επαναφοράς δεν μπόρεσε να γράψει αυτόματα το αρχείο <code>%1$s</code> του ιστότοπού σας. Θα πρέπει να το κάνετε εσείς. Ανοίξτε μια εφαρμογή επεξεργαστή <em>απλού κειμένου</em> όπως το Notepad++ (Windows), το gEdit (Linux) ή το Textastic (macOS). Δημιουργήστε ένα νέο αρχείο με το όνομα <code>%1$s</code> με το ακόλουθο περιεχόμενο:"
FINALISE_LBL_CONFIGOUTRO="Θυμηθείτε να αποστείλετε αυτό το αρχείο ως <code>%s</code> στον βασικό κατάλογο του ιστότοπού σας. Ο βασικός κατάλογος του ιστότοπού σας συνήθως ονομάζεται public_html, www, httpdocs, htdocs ή κάτι παρόμοιο. Εάν δεν είστε σίγουροι ποιος είναι ο βασικός κατάλογος του ιστότοπού σας, ρωτήστε τον πάροχο φιλοξενίας σας."
FINALISE_LBL_COPYCONFIG="Αντιγραφή στο πρόχειρο"
FINALISE_BTN_REMOVEINSTALLATION="Αφαίρεση καταλόγου εγκατάστασης"

FINALISE_LBL_READY="Η επαναφορά ολοκληρώθηκε"
FINALISE_LBL_NEXT_STEPS="Επόμενα βήματα"
FINALISE_LBL_ALMOSTREADY="Η επαναφορά είναι <em>σχεδόν</em> ολοκληρωμένη"
FINALISE_LBL_MAKESURECONFIG="Βεβαιωθείτε ότι έχετε δημιουργήσει το αρχείο <code>%s</code> όπως υποδεικνύεται παραπάνω, και ελέγξτε διπλά το περιεχόμενό του σε σχέση με αυτό που εμφανίζεται σε αυτή τη σελίδα. Η παράλειψη αυτού <em>θα</em> οδηγήσει σε κατεστραμμένο ιστότοπο."
FINALISE_LBL_KICKSTART="Κλείστε αυτό το παράθυρο για να επιστρέψετε στο Kickstart. Κάντε κλικ στο κουμπί <strong>Εκκαθάριση</strong> για να αρχίσετε να χρησιμοποιείτε τον επαναφερόμενο ιστότοπό σας."
FINALISE_LBL_INTEGRATED="Κλείστε αυτό το παράθυρο για να επιστρέψετε στη σελίδα επαναφοράς. Κάντε κλικ στο κουμπί <strong>Εκκαθάριση</strong> για να αρχίσετε να χρησιμοποιείτε τον επαναφερόμενο ιστότοπό σας."
FINALISE_LBL_STANDALONE="Κάντε κλικ στο παρακάτω κουμπί για να αφαιρέσετε το σενάριο επαναφοράς και να αρχίσετε να χρησιμοποιείτε τον ιστότοπό σας."

FINALISE_HEADER_ERROR="Παρουσιάστηκε σφάλμα"
FINALISE_LBL_ERROR="Δεν μπορέσαμε να αφαιρέσουμε αυτόματα τον κατάλογο <code>installation</code>. Κλείστε αυτό το πλαίσιο μηνύματος κάνοντας κλικ στο κουμπί &times; στην επάνω δεξιά γωνία του. Στη συνέχεια, προχωρήστε στην αφαίρεση του καταλόγου <code>installation</code> χειροκίνητα, π.χ. χρησιμοποιώντας τον διαχειριστή αρχείων του πίνακα ελέγχου φιλοξενίας σας ή μέσω FTP/SFTP."

FINALISE_HEADER_SUCCESS="Έτοιμο να ξεκινήσετε να χρησιμοποιείτε τον ιστότοπό σας!"
