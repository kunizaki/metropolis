DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Αυτό το μήνυμα εμφανίζεται όταν η PHP αναφέρει ότι δεν είναι διαθέσιμη καμία από τις συναρτήσεις σύνδεσης βάσης δεδομένων για διακομιστές βάσεων δεδομένων συμβατούς με MySQL."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Σημειώστε ότι ο διακομιστής σας ενδέχεται να αναφέρει ότι οι επεκτάσεις είναι εγκατεστημένες για διαφορετική έκδοση PHP ή εγκατάσταση PHP, όπως η ξεχωριστή εγκατάσταση PHP που χρησιμοποιεί ο πίνακας ελέγχου φιλοξενίας. Αυτή δεν είναι η ίδια εγκατάσταση PHP και/ή έκδοση που χρησιμοποιείτε για την επαναφορά του ιστότοπού σας."
DATABASE_NOCONNECTORS_LBL_USEOTHER_HEAD="Μπορώ να χρησιμοποιήσω διαφορετική τεχνολογία βάσης δεδομένων, π.χ. PostgreSQL;"
DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="Όχι, δεν μπορείτε."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Οι διαφορετικές τεχνολογίες βάσης δεδομένων χρησιμοποιούν ασύμβατες δομές βάσης δεδομένων, μορφές δεδομένων, προγράμματα οδήγησης βάσης δεδομένων και απαιτούν διαφορετικά γραμμένο κώδικα SQL και PHP. Δεν μπορείτε να χρησιμοποιήσετε βάση δεδομένων που δεν είναι MySQL με δεδομένα που προέρχονται από και λογισμικό γραμμένο για βάση δεδομένων συμβατή με MySQL."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="Θα λειτουργήσει αν επανεγκαταστήσω τον ιστότοπό μου;"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="Όχι, δεν θα λειτουργήσει."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="Το CMS σας χρειάζεται επίσης να συνδεθεί στη βάση δεδομένων. Ο μόνος τρόπος να το κάνετε είναι χρησιμοποιώντας τις ίδιες επεκτάσεις PHP. Επομένως, θα καταλήξετε με το ίδιο πρόβλημα."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="<em>Μπορεί</em> να είναι δυνατό το CMS σας να σας επιτρέπει να χρησιμοποιήσετε διαφορετική τεχνολογία βάσης δεδομένων κατά την εγκατάσταση νέου ιστότοπου, π.χ. PostgreSQL. Ωστόσο, δεν θα μπορεί να λειτουργήσει με αυτήν όλο το λογισμικό που χρησιμοποιούσατε προηγουμένως στον ιστότοπό σας. Αυτό θα καταστήσει αδύνατη την επανεφαρμογή του ιστότοπού σας."

DATABASE_NODB_LBL_HEAD="Δεν υπάρχει βάση δεδομένων για επαναφορά"
DATABASE_NODB_LBL_BODY="Το αρχείο αντιγράφου ασφαλείας σας υποδεικνύει ότι δεν υπάρχει βάση δεδομένων για επαναφορά για το κλειδί <code>%s</code>. Κάντε κλικ στο Επόμενο για να προχωρήσετε στο επόμενο βήμα της επαναφοράς."
DATABASE_NODB_LBL_BODY_MAIN="Το αρχείο αντιγράφου ασφαλείας σας υποδεικνύει ότι δεν υπάρχει κύρια βάση δεδομένων ιστότοπου για επαναφορά. Κάντε κλικ στο Επόμενο για να προχωρήσετε στο επόμενο βήμα της επαναφοράς."

