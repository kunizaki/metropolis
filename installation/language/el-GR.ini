DATABASE_HEADER_CONNECTION="Πληροφορίες σύνδεσης"
DATABASE_LBL_TYPE="Τύπος βάσης δεδομένων"
DATABASE_LBL_TYPE_HELP="Αυτός είναι συνήθως MySQLi (<em>με</em> το τελικό "i")"
DATABASE_LBL_HOSTNAME="Όνομα κεντρικού υπολογιστή διακομιστή βάσης δεδομένων"
DATABASE_LBL_HOSTNAME_HELP="Το όνομα κεντρικού υπολογιστή ή η διεύθυνση IP του διακομιστή βάσης δεδομένων (συνήθως: localhost). <strong>ΣΗΜΑΝΤΙΚΟ!</strong> Το <code>localhost</code> και το <code>127.0.0.1</code> σημαίνουν δύο διαφορετικά πράγματα, δείτε παρακάτω. Παραδείγματα σύνδεσης:<ul><li><code>localhost</code></li> Σύνδεση στο localhost μέσω της προεπιλεγμένης UNIX socket (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Σύνδεση στο localhost μέσω TCP/IP χρησιμοποιώντας την προεπιλεγμένη θύρα (3306).<li><code>127.0.0.1:1234</code></li> Σύνδεση στο localhost μέσω TCP/IP χρησιμοποιώντας τη θύρα 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Σύνδεση σε κεντρικό υπολογιστή IPv6 με διεύθυνση 2607:f0d0:1002:51::4 μέσω TCP/IP χρησιμοποιώντας τη θύρα 1234. Σημείωση: όλες οι διευθύνσεις IPv6 ΠΡΕΠΕΙ να περικλείονται σε αγκύλες!</li><li><code>mysql.example.com:1234</code></li> Σύνδεση στο mysql.example.com μέσω TCP/IP χρησιμοποιώντας τη θύρα 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Σύνδεση χρησιμοποιώντας την UNIX socket στο /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Σύνδεση χρησιμοποιώντας τον Windows Named Pipe "MySQL" (προφανώς λειτουργεί μόνο σε διακομιστές Windows).</ul>"
DATABASE_LBL_USERNAME="Όνομα χρήστη"
DATABASE_LBL_USERNAME_HELP="Το όνομα χρήστη που χρησιμοποιείτε για να συνδεθείτε στη βάση δεδομένων σας. Οι περισσότεροι πάροχοι φιλοξενίας που χρησιμοποιούν cPanel, Plesk και άλλα μεγάλα πανέλα φιλοξενίας θα σας δώσουν ονόματα χρηστών όπως abcdef_username, όπου abcdef είναι το όνομα χρήστη του πίνακα ελέγχου φιλοξενίας σας. Αν δεν είστε σίγουροι, παρακαλούμε ρωτήστε τον πάροχο φιλοξενίας σας."
DATABASE_LBL_PASSWORD="Κωδικός πρόσβασης"
DATABASE_LBL_PASSWORD_HELP="Ο κωδικός πρόσβασης που χρησιμοποιείτε για να συνδεθείτε στη βάση δεδομένων σας."
DATABASE_LBL_DBNAME="Όνομα βάσης δεδομένων"
DATABASE_LBL_DBNAME_HELP="Το όνομα της βάσης δεδομένων σας. Οι περισσότεροι πάροχοι φιλοξενίας που χρησιμοποιούν cPanel, Plesk και άλλα μεγάλα πανέλα φιλοξενίας θα σας δώσουν ονόματα βάσεων δεδομένων όπως <code>abcdef_username</code>, όπου <code>abcdef</code> είναι το όνομα χρήστη του πίνακα ελέγχου φιλοξενίας σας. Αν δεν είστε σίγουροι, παρακαλούμε ρωτήστε τον πάροχο φιλοξενίας σας."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Ασυνήθεις επιλογές"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Οι παρακάτω επιλογές χρησιμοποιούνται σε λιγότερο συνηθισμένες και ιδιαίτερες διαμορφώσεις MySQL."
DATABASE_LBL_PORT="Θύρα βάσης δεδομένων"
DATABASE_LBL_PORT_HELP="<strong>Προαιρετικό</strong>. Η θύρα TCP/IP της βάσης δεδομένων, εάν διαφέρει από την προεπιλεγμένη (3306). Δεν ισχύει εάν χρησιμοποιείτε το όνομα κεντρικού υπολογιστή <code>localhost</code> ή socket. Εάν δεν γνωρίζετε τι σημαίνει αυτό, αφήστε το πεδίο κενό."
DATABASE_LBL_SOCKET="UNIX socket / Windows Named Pipe"
DATABASE_LBL_SOCKET_HELP="<strong>Προαιρετικό</strong>. Εάν συνδέεστε στον διακομιστή βάσης δεδομένων σας χρησιμοποιώντας UNIX socket (π.χ. <code>unix:/tmp/mysql.sock</code>) ή Windows Named Pipe (π.χ. <code>\\.\MySQL</code>), εισάγετέ το εδώ. Εάν δεν γνωρίζετε τι σημαίνει αυτό, αφήστε το κενό."
DATABASE_LBL_DBENCRYPTION="Χρήση SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Προαιρετικό.</strong> Θέλετε να συνδεθείτε στο MySQL χρησιμοποιώντας SSL/TLS; Αυτό μπορεί να χρησιμοποιηθεί για κρυπτογράφηση της σύνδεσης βάσης δεδομένων και προαιρετικά για σύνδεση χωρίς κωδικό πρόσβασης. Θα χρειαστεί να παράσχετε τη διαδρομή του κλειδιού και του πιστοποιητικού του MySQL client. Αυτή είναι μια πολύ ασυνήθιστη επιλογή. Εάν δεν γνωρίζετε τι είναι αυτό, παρακαλούμε αγνοήστε αυτήν και τις επόμενες επιλογές."
DATABASE_LBL_DBSSLCIPHER="Κρυπτογραφικοί αλγόριθμοι SSL"
DATABASE_LBL_DBSSLCIPHER_HELP="Χρησιμοποιείται μόνο όταν είναι ενεργοποιημένη η Χρήση SSL/TLS. Μια λίστα αλγορίθμων κρυπτογράφησης διαχωρισμένη με άνω και κάτω τελεία, για χρήση στη σύνδεση SSL/TLS, π.χ. <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. Εάν δεν είστε σίγουροι, αφήστε το κενό."
DATABASE_LBL_DBSSLCERT="Αρχείο πιστοποιητικού SSL"
DATABASE_LBL_DBSSLCERT_HELP="Χρησιμοποιείται μόνο όταν είναι ενεργοποιημένη η Χρήση SSL/TLS. Η απόλυτη διαδρομή στο σύστημα αρχείων προς το αρχείο πιστοποιητικού client σε μορφή PEM."
DATABASE_LBL_DBSSLKEY="Αρχείο κλειδιού SSL"
DATABASE_LBL_DBSSLKEY_HELP="Χρησιμοποιείται μόνο όταν είναι ενεργοποιημένη η Χρήση SSL/TLS. Η απόλυτη διαδρομή στο σύστημα αρχείων προς το αρχείο κλειδιού client σε μορφή PEM."
DATABASE_LBL_DBSSLCA="Αρχείο CA για SSL"
DATABASE_LBL_DBSSLCA_HELP="Χρησιμοποιείται μόνο όταν είναι ενεργοποιημένη η Χρήση SSL/TLS. Η απόλυτη διαδρομή στο σύστημα αρχείων προς το αρχείο Αρχής Πιστοποίησης (CA) για σύνδεση στον διακομιστή, σε μορφή PEM. Λαμβάνεται υπόψη μόνο όταν είναι ενεργοποιημένη η Επαλήθευση πιστοποιητικού διακομιστή."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Επαλήθευση πιστοποιητικού διακομιστή"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Χρησιμοποιείται μόνο όταν είναι ενεργοποιημένη η Χρήση SSL/TLS. Επαληθεύει την απόκριση του διακομιστή σε σχέση με το αρχείο Αρχής Πιστοποίησης (CA). Πρέπει να παράσχετε το αρχείο CA για να λειτουργεί σωστά αυτή η επιλογή. Εάν η επαναφορά της βάσης δεδομένων αποτυγχάνει σταθερά, δοκιμάστε να απενεργοποιήσετε αυτήν την επιλογή."

DATABASE_HEADER_ADVANCED="Προχωρημένες επιλογές"
DATABASE_LBL_EXISTING="Με υπάρχοντες πίνακες"
DATABASE_LBL_EXISTING_HELP="Επιλέξτε τι θα γίνει με τους υπάρχοντες πίνακες. Η επιλογή «Διαγραφή» θα διαγράψει τους υπάρχοντες πίνακες με τα ίδια ονόματα με τους πίνακες που επαναφέρονται. Η επιλογή «Δημιουργία αντιγράφου» θα μετονομάσει τους υπάρχοντες πίνακες με τα ίδια ονόματα, αλλάζοντας το πρόθεμά τους σε bak_. Η επιλογή «Διαγραφή ίδιου προθέματος» θα διαγράψει όλους τους πίνακες με το ίδιο πρόθεμα, ακόμα και αν δεν περιλαμβάνονται στο αντίγραφο ασφαλείας που επαναφέρεται. Η επιλογή «Διαγραφή όλων» θα διαγράψει όλους τους πίνακες, ακόμα και με διαφορετικό πρόθεμα. Οι δύο τελευταίες επιλογές είναι ΕΠΙΚΙΝΔΥΝΕΣ και πρέπει να χρησιμοποιούνται με ΑΚΡΑΙΑ ΠΡΟΣΟΧΗ."
DATABASE_LBL_EXISTING_DROP="Διαγραφή"
DATABASE_LBL_EXISTING_BACKUP="Δημιουργία αντιγράφου"
DATABASE_LBL_EXISTING_DROPPREFIX="Διαγραφή ίδιου προθέματος"
DATABASE_LBL_EXISTING_DROPALL="Διαγραφή όλων"
DATABASE_LBL_PREFIX="Πρόθεμα ονόματος πινάκων βάσης δεδομένων"
DATABASE_LBL_PREFIX_HELP="Το πρόθεμα όλων των επαναφερόμενων πινάκων της βάσης δεδομένων που είχαν πρόθεμα κατά τη δημιουργία αντιγράφου ασφαλείας. Το πρόθεμα που χρησιμοποιείται για την κύρια βάση δεδομένων του ιστότοπου θα εγγραφεί επίσης στο αρχείο configuration.php του Joomla!. Λάβετε υπόψη ότι ορισμένες επεκτάσεις ενδέχεται να δυσλειτουργήσουν ή ακόμα και να καταστρέψουν πλήρως τον ιστότοπό σας εάν αλλάξετε το πρόθεμα ονόματος πινάκων της βάσης δεδομένων κατά την επαναφορά / μεταφορά του ιστότοπού σας."
DATABASE_LBL_FOREIGNKEY="Απενεργοποίηση ελέγχων ξένου κλειδιού"
DATABASE_LBL_FOREIGNKEY_HELP="Απενεργοποιεί τον έλεγχο ξένων κλειδιών της MySQL κατά τη διάρκεια της επαναφοράς. Αυτό είναι απαραίτητο όταν επαναφέρετε μια βάση δεδομένων που χρησιμοποιεί σχέσεις σε επίπεδο πίνακα (ξένα κλειδιά). Εάν δεν είστε σίγουροι, αφήστε αυτή την επιλογή ενεργοποιημένη· δεν θα προκαλέσει κανένα πρόβλημα."
DATABASE_LBL_NOAUTOVALUE="Χωρίς αυτόματη τιμή στο μηδέν"
DATABASE_LBL_NOAUTOVALUE_HELP="Σας επιτρέπει να επαναφέρετε πίνακες με πεδία αυτόματης αύξησης των οποίων η τιμή είναι μηδέν. Το Magento και το Drupal το απαιτούν για σωστή επαναφορά. ΣΗΜΕΙΩΣΗ: Σύμφωνα με την τεκμηρίωση της MySQL: «Η αποθήκευση 0 δεν είναι συνιστώμενη πρακτική.»"
DATABASE_LBL_REPLACE="Χρήση REPLACE αντί INSERT"
DATABASE_LBL_REPLACE_HELP="Το σενάριο επαναφοράς χρησιμοποιεί κανονικά εντολές INSERT για την επαναφορά των δεδομένων της βάσης δεδομένων. Αυτό δεν λειτουργεί καλά με δεδομένα ορισμένων επεκτάσεων, προκαλώντας προβλήματα κατά την επαναφορά. Εάν εμφανίζονται σφάλματα κατά την επαναφορά της βάσης δεδομένων, επιλέξτε αυτό το πλαίσιο και κάντε κλικ ξανά στο κουμπί Επόμενο."
DATABASE_LBL_FORCEUTF8DB="Εξαναγκασμός UTF-8 αντιπαραβολής στη βάση δεδομένων"
DATABASE_LBL_FORCEUTF8DB_HELP="Όταν είναι επιλεγμένο, το σενάριο επαναφοράς θα προσπαθήσει να μετατρέψει την προεπιλεγμένη αντιπαραβολή του πίνακά σας σε Unicode (UTF-8), όπως προτείνει το Joomla!. Αυτό δεν λειτουργεί σε όλους τους διακομιστές. Επιλέξτε το εάν βλέπετε ερωτηματικά ή κατεστραμμένο κείμενο αντί διεθνών χαρακτήρων."
DATABASE_LBL_FORCEUTF8TABLES="Εξαναγκασμός UTF-8 αντιπαραβολής στους πίνακες"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Όταν είναι επιλεγμένο, το σενάριο επαναφοράς θα προσπαθήσει να μετατρέψει όλα τα πεδία κειμένου των επαναφερόμενων πινάκων σε Unicode (UTF-8). Αυτή είναι μια λύση αντιμετώπισης όταν δεν μπορείτε να χρησιμοποιήσετε την παραπάνω επιλογή. Λάβετε υπόψη ότι εάν η αντιπαραβολή της βάσης δεδομένων σας είναι οτιδήποτε άλλο εκτός από UTF-8, <em>θα</em> αντιμετωπίσετε προβλήματα στο μέλλον, αφότου μια αναβάθμιση επέκτασης προσθέσει ένα νέο πεδίο κειμένου."
DATABASE_LBL_UTF8MB4DETECT="Να επιτρέπεται η αυτόματη ανίχνευση UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Εάν είναι ενεργοποιημένο και ο διακομιστής βάσης δεδομένων σας υποστηρίζει UTF8MB4 (UTF-8 Multibyte), θα χρησιμοποιηθεί αντί για το απλό UTF-8. ΠΡΟΕΙΔΟΠΟΙΗΣΗ: Χρησιμοποιήστε μόνο εάν ο ιστότοπός σας χρησιμοποιούσε UTF8MB4 κατά τη δημιουργία του αντιγράφου ασφαλείας. Αποεπιλέξτε αυτήν την επιλογή εάν εμφανίζεται κατεστραμμένο κείμενο μετά την επαναφορά του ιστότοπού σας!"
DATABASE_LBL_CHARSET_CONVERSION="Ομαλοποίηση συνόλου χαρακτήρων"
DATABASE_LBL_CHARSET_CONVERSION_YES="Ενεργοποιημένο"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Αυτόματη ανίχνευση (συνιστάται)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Απενεργοποιημένο"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Ελέγχει την ομαλοποίηση αντιπαραβολής κατά την επαναφορά μεταξύ διαφορετικών πλατφορμών ή οικογενειών εκδόσεων βάσεων δεδομένων (π.χ. MariaDB σε MySQL). <strong>Αυτόματη ανίχνευση</strong>: η μετατροπή κωδικοσελίδας εφαρμόζεται αυτόματα όταν το σενάριο επαναφοράς διαπιστώσει ότι το αντίγραφο ασφαλείας δημιουργήθηκε σε διαφορετική πλατφόρμα ή οικογένεια εκδόσεων βάσης δεδομένων από τον διακομιστή προορισμού. <strong>Ενεργοποιημένο</strong>: πάντα ομαλοποίηση αντιπαραβολών ανεξαρτήτως πλατφόρμας. <strong>Απενεργοποιημένο</strong>: ποτέ μη ομαλοποίηση αντιπαραβολών· χρησιμοποιήστε αυτό μόνο όταν είστε βέβαιοι ότι επαναφέρετε στον ακριβώς ίδιο τύπο διακομιστή βάσης δεδομένων (MySQL έναντι MariaDB) και οικογένεια εκδόσεων."

DATABASE_HEADER_FINETUNING="Λεπτομερής ρύθμιση"
DATABASE_MSG_FINETUNING="Αλλάξτε αυτές τις ρυθμίσεις μόνο εάν σας ζητηθεί από την υποστήριξή μας, ή εάν η επαναφορά βάσης δεδομένων φαίνεται να κολλάει. Η εισαγωγή των τιμών 5 και 2000 στα παρακάτω πεδία θα έχει ως αποτέλεσμα πολύ πιο αργή επαναφορά, αλλά λιγότερες πιθανότητες αποτυχίας σε φτηνή, αναξιόπιστη φιλοξενία."
DATABASE_LBL_MAXEXECTIME="Μέγιστος χρόνος εκτέλεσης"
DATABASE_LBL_MAXEXECTIME_HELP="Το σενάριο επαναφοράς χωρίζει τη διαδικασία επαναφοράς βάσης δεδομένων σε μικρά τμήματα επεξεργασίας για να αποφύγει τις λήξεις χρονικού ορίου του διακομιστή. Αυτή η τιμή καθορίζει πόσο χρόνο θα διαρκέσει κάθε ένα από αυτά τα τμήματα. Ίσως χρειαστεί να τροποποιήσετε αυτήν την τιμή εάν η επαναφορά της βάσης δεδομένων δεν ολοκληρώνεται. Η προεπιλογή είναι 10 δευτερόλεπτα."
DATABASE_LBL_THROTTLEMSEC="Χρόνος επιβράδυνσης"
DATABASE_LBL_THROTTLEMSEC_HELP="Το σενάριο επαναφοράς μπορεί προαιρετικά να επιβραδύνει τον ρυθμό της διαδικασίας επαναφοράς βάσης δεδομένων για διακομιστές που παρουσιάζουν σοβαρά προβλήματα. Μπορείτε να εισάγετε τον χρόνο επιβράδυνσης μεταξύ τμημάτων επεξεργασίας σε χιλιοστά του δευτερολέπτου (1/1000 του δευτερολέπτου). Για παράδειγμα, για να προσθέσετε χρόνο επιβράδυνσης 5 δευτερολέπτων μεταξύ βημάτων, εισάγετε 5000 σε αυτό το πλαίσιο. Η προεπιλεγμένη τιμή 250 θα πρέπει να λειτουργεί στους περισσότερους διακομιστές."

DATABASE_LBL_ON_CREATE_ERROR="Διακοπή σε σφάλμα CREATE"
DATABASE_LBL_ON_CREATE_ERROR_HELP="Πρέπει η επαναφορά να διακόπτεται αμέσως εάν παρουσιαστεί σφάλμα κατά τη δημιουργία πίνακα, προβολής, συνάρτησης, εναύσματος ή αποθηκευμένης διαδικασίας; Εάν δεν είναι επιλεγμένο, τέτοια σφάλματα θα αγνοούνται και η επαναφορά θα συνεχίζεται με πιθανή καταστροφή δεδομένων ή/και προβλήματα στον επαναφερόμενο ιστότοπο."
DATABASE_LBL_ON_OTHER_ERROR="Διακοπή σε άλλο σφάλμα"
DATABASE_LBL_ON_OTHER_ERROR_HELP="Πρέπει η επαναφορά να διακόπτεται αμέσως εάν παρουσιαστεί σφάλμα κατά την εκτέλεση οποιασδήποτε άλλης εντολής βάσης δεδομένων, όπως επαναφορά ή διαγραφή δεδομένων; Εάν δεν είναι επιλεγμένο, τέτοια σφάλματα θα αγνοούνται και η επαναφορά θα συνεχίζεται με πιθανή καταστροφή δεδομένων ή/και προβλήματα στον επαναφερόμενο ιστότοπο."

DATABASE_HEADER_DBRESTORE="Επαναφορά βάσης δεδομένων"
DATABASE_LBL_RESTORATION_PROGRESS="Πρόοδος επαναφοράς"
DATABASE_LBL_RESTORED="Επαναφέρθηκε"
DATABASE_LBL_TOTAL="Συνολικό μέγεθος"
DATABASE_LBL_ETA="Εκτιμώμενος χρόνος"

DATABASE_HEADER_SUCCESS="Η επαναφορά της βάσης δεδομένων ήταν επιτυχής"
DATABASE_HEADER_WARNINGS="Η επαναφορά της βάσης δεδομένων ολοκληρώθηκε αλλά ορισμένα ερωτήματα απέτυχαν να εκτελεστούν"
DATABASE_MSG_WARNINGS="Ο επαναφερόμενος ιστότοπός σας ενδέχεται να μην λειτουργεί σωστά εάν δεν διορθώσετε χειροκίνητα αυτά τα ζητήματα. Παρακαλούμε ελέγξτε τα αποτυχημένα ερωτήματα και τον λόγο αποτυχίας τους στο αρχείο καταγραφής:"
DATABASE_MSG_SUCCESS="Κάντε κλικ στο παρακάτω κουμπί για να προχωρήσετε στο επόμενο βήμα"
DATABASE_BTN_SUCCESS="Επόμενο βήμα"

DATABASE_HEADER_INPROGRESS_WARNINGS="Ορισμένα ερωτήματα απέτυχαν"
DATABASE_MSG_INPROGRESS_WARNINGS="Ορισμένα ερωτήματα SQL απέτυχαν να εκτελεστούν, αλλά επιλέξατε να τα αγνοήσετε. Μπορείτε να τα ελέγξετε μαζί με τον λόγο αποτυχίας τους μετά το τέλος της επαναφοράς, στο παρακάτω αρχείο καταγραφής:"

DATABASE_HEADER_ERROR="Παρουσιάστηκε σφάλμα κατά την επαναφορά της βάσης δεδομένων. Το μήνυμα σφάλματος βρίσκεται παρακάτω. Κάντε κλικ στο κουμπί &times; στην επάνω δεξιά γωνία αυτού του παραθύρου διαλόγου για να το κλείσετε και να επιστρέψετε στη σελίδα επαναφοράς βάσης δεδομένων."
DATABASE_ERR_INVALIDKEY="Μη έγκυρο κλειδί βάσης δεδομένων"

DATABASE_ERR_COMPLEXPASSWORD="!!! ΠΡΟΕΙΔΟΠΟΙΗΣΗ !!!\n\nΟ κωδικός πρόσβασης της βάσης δεδομένων σας περιέχει ειδικούς χαρακτήρες. Πολλοί διακομιστές ιστού απορρίπτουν ή τροποποιούν αυτούς τους κωδικούς πρόσβασης, προκαλώντας αποτυχία της επαναφοράς βάσης δεδομένων με σφάλμα σύνδεσης βάσης δεδομένων.\n\nΣΑΣ ΣΥΝΙΣΤΟΥΜΕ ΕΝΤΟΝΑ να αλλάξετε τον κωδικό πρόσβασης της βάσης δεδομένων σας σε μια μακριά (32 χαρακτήρες ή περισσότερους) τυχαία συμβολοσειρά αποτελούμενη ΜΟΝΟ από κεφαλαία γράμματα A-Z, πεζά γράμματα a-z και αριθμούς 0-9.\n\nΘέλετε να αγνοήσετε την προειδοποίηση και να συνεχίσετε με την επαναφορά της βάσης δεδομένων με δική σας ευθύνη;"
DATABASE_ERR_UPPERCASEPREFIX="!!! ΠΡΟΕΙΔΟΠΟΙΗΣΗ !!!\n\nΤο πρόθεμα ονόματος πινάκων της βάσης δεδομένων σας περιέχει έναν ή περισσότερους κεφαλαίους χαρακτήρες. Αυτό μπορεί να προκαλέσει σοβαρά προβλήματα στον επαναφερόμενο ιστότοπο ή/και να καταστήσει αδύνατη την επαναφορά του ιστότοπού σας σε διαφορετικό διακομιστή. Αυτό συμβαίνει λόγω του τρόπου με τον οποίο η MySQL χειρίζεται τα κεφαλαία γράμματα και δεν μπορεί να αντιμετωπιστεί αποτελεσματικά, σύμφωνα με την τεκμηρίωση της MySQL.\n\nΣΑΣ ΣΥΝΙΣΤΟΥΜΕ ΕΝΤΟΝΑ να χρησιμοποιείτε πρόθεμα ονόματος πινάκων βάσης δεδομένων αποτελούμενο εξ ολοκλήρου από πεζά γράμματα.\n\nΘέλετε να αγνοήσετε την προειδοποίηση και να συνεχίσετε με την επαναφορά της βάσης δεδομένων με δική σας ευθύνη;"
DATABASE_ERR_EMPTY_INFO="!!! ΠΡΟΕΙΔΟΠΟΙΗΣΗ !!!\n\nΔεν έχετε συμπληρώσει όλα τα απαιτούμενα πεδία (όνομα κεντρικού υπολογιστή βάσης δεδομένων, όνομα βάσης δεδομένων, όνομα χρήστη βάσης δεδομένων, κωδικός πρόσβασης βάσης δεδομένων και πρόθεμα ονόματος πινάκων). Αυτό πιθανότατα θα προκαλέσει σφάλμα κατά τη σύνδεση στη βάση δεδομένων ή/και στον επαναφερόμενο ιστότοπο.\n\nΕίστε ΑΠΟΛΥΤΑ ΣΙΓΟΥΡΟΙ ότι αυτό είναι πραγματικά αυτό που θέλετε να κάνετε;"

DATABASE_HEADER_RESTORERETRY="Η επαναφορά τέθηκε σε παύση και θα συνεχιστεί αυτόματα"
DATABASE_LBL_RESTOREFAILEDRETRY="Η επαναφορά της βάσης δεδομένων τέθηκε σε παύση επειδή εντοπίστηκε σφάλμα. Ωστόσο, το σενάριο επαναφοράς θα επιχειρήσει να συνεχίσει τη διαδικασία. Εάν δεν θέλετε να συνεχίσετε την επαναφορά, κάντε κλικ στο κουμπί Ακύρωση παρακάτω."
DATABASE_LBL_WILLRETRY="Η επαναφορά θα συνεχιστεί σε"
DATABASE_LBL_WILLRETRYSECONDS="δευτερόλεπτα"
DATABASE_LBL_CANCEL="Ακύρωση"
DATABASE_LBL_BTNRESUME="Συνέχιση"
DATABASE_LBL_LASTERRORMESSAGEWAS="Για πληροφορία σας, το τελευταίο μήνυμα σφάλματος ήταν:"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="Το σφάλμα που ελήφθη ήταν:"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="Πώς να διορθώσετε αυτό το σφάλμα"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Πληροφορίες εντοπισμού σφαλμάτων"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Εμφάνιση / Απόκρυψη"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Παρακαλούμε συμπεριλάβετε αυτές τις πληροφορίες στο αίτημά σας υποστήριξης εάν χρειαστείτε περαιτέρω βοήθεια. Αναφέρετέ μας ποια βήματα αντιμετώπισης προβλημάτων έχετε ήδη δοκιμάσει."

DATABASE_RESTORE_DBNAME_HEAD="Λανθασμένο όνομα βάσης δεδομένων ή έλλειψη πρόσβασης στη βάση δεδομένων"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="Ο διακομιστής βάσης δεδομένων αναφέρει ότι το όνομα κεντρικού υπολογιστή, το όνομα χρήστη και ο κωδικός πρόσβασης του διακομιστή βάσης δεδομένων είναι σωστά, αλλά δεν μπορεί να συνδεθεί στη βάση δεδομένων που καθορίσατε στην επιλογή «Όνομα βάσης δεδομένων». Αυτό σημαίνει ότι είτε η βάση δεδομένων δεν υπάρχει <em>ή</em> δεν έχετε παραχωρήσει πρόσβαση στον χρήστη της βάσης δεδομένων σας σε αυτήν."
DATABASE_RESTORE_DBUSER_HEAD="Λανθασμένα στοιχεία σύνδεσης βάσης δεδομένων"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="Δεν ήταν δυνατή η σύνδεση στον διακομιστή βάσης δεδομένων σας χρησιμοποιώντας το όνομα κεντρικού υπολογιστή διακομιστή, το όνομα χρήστη και τον κωδικό πρόσβασης που παρείχατε."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Ελέγξτε το όνομα κεντρικού υπολογιστή του διακομιστή βάσης δεδομένων σας. Θυμηθείτε ότι το <code>localhost</code> και το <code>127.0.0.1</code> έχουν διαφορετικές σημασίες κατά τη σύνδεση σε βάση δεδομένων."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Ελέγξτε το όνομα της βάσης δεδομένων και το όνομα χρήστη της βάσης δεδομένων. Οι περισσότεροι πάροχοι φιλοξενίας προσθέτουν ως πρόθεμα στο όνομα της βάσης δεδομένων το όνομα χρήστη του λογαριασμού φιλοξενίας σας. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας σας."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Ελέγξτε τον κωδικό πρόσβασής σας. Η πεζότητα έχει σημασία: ABC, abc και Abc είναι τρεις <em>διαφορετικοί</em> κωδικοί πρόσβασης."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Εάν αντιγράφετε ή μεταφέρετε τον ιστότοπό σας, βεβαιωθείτε ότι εισάγετε τα στοιχεία σύνδεσης βάσης δεδομένων για τον νέο ιστότοπο."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Εάν δεν έχετε ακόμα βάση δεδομένων, θα χρειαστεί να δημιουργήσετε μία. Οι περισσότεροι πάροχοι φιλοξενίας δεν επιτρέπουν σε αυτό το σενάριο επαναφοράς να δημιουργεί νέα βάση δεδομένων για λόγους ασφαλείας."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Εάν δημιουργήσατε νέα βάση δεδομένων, βεβαιωθείτε ότι έχετε επίσης δημιουργήσει έναν χρήστη βάσης δεδομένων <strong>και</strong> έχετε αντιστοιχίσει τον χρήστη στη βάση δεδομένων, παραχωρώντας του όλα τα προνόμια."

