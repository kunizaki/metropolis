SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG_HELP="Αντικαθιστά το περιεχόμενο του αρχείου web.config στον βασικό κατάλογο του ιστότοπού σας με το περιεχόμενο του τυπικού web.config.txt που παρέχεται με το Joomla. Το παλιό αρχείο μετονομάζεται σε web.config.bak"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Διαγραφή των αρχείων .htaccess και .htpasswd στον κατάλογο administrator"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Διαγράφει τα αρχεία .htaccess και .htpasswd στον κατάλογο administrator. Ενεργοποιήστε αυτό εάν είχατε εφαρμόσει προστασία κωδικού πρόσβασης στον κατάλογο administrator -είτε μέσω του πίνακα ελέγχου του παρόχου φιλοξενίας σας είτε μέσω επέκτασης ασφαλείας τρίτου κατασκευαστή όπως το Admin Tools- και κάνετε επαναφορά σε νέο διακομιστή που δεν υποστηρίζει την ίδια μέθοδο κρυπτογράφησης κωδικού πρόσβασης με τον παλιό διακομιστή. <strong>ΣΗΜΑΝΤΙΚΟ</strong>: Θυμηθείτε να επανενεργοποιήσετε την προστασία κωδικού πρόσβασης για τον κατάλογο administrator μετά την ολοκλήρωση της επαναφοράς!"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="Τα αρχεία στα οποία αναφέρεται αυτή η επιλογή δεν υπάρχουν στον διακομιστή σας. Εξαιρετικό! Δεν χρειάζεται να ασχοληθείτε μαζί τους και δεν χρειάζεστε αυτή την επιλογή."

DATABASE_WARN_LARGE_COLUMNS="Η μεγαλύτερη γραμμή βάσης δεδομένων σας έχει μέγεθος %1$0.2f Mb. Ωστόσο, ο διακομιστής βάσης δεδομένων σας πιθανώς έχει ρυθμιστεί να αποδέχεται έως %3$0.2f Mb (δεν μπορούμε να το ελέγξουμε χωρίς σύνδεση με τον διακομιστή βάσης δεδομένων). Εάν προχωρήσετε με την επαναφορά βάσης δεδομένων, πιθανότατα θα λάβετε κωδικό σφάλματος βάσης δεδομένων 1153, ή μήνυμα σφάλματος 'ER_NET_PACKET_TOO_LARGE', ή μήνυμα σφάλματος 'Got a packet bigger than 'max_allowed_packet' bytes'. Εάν συμβεί αυτό, παρακαλώ ζητήστε από τον πάροχο φιλοξενίας σας να ορίσει την τιμή της μεταβλητής ρύθμισης <strong>max_allowed_packet</strong> του διακομιστή βάσης δεδομένων σας σε τουλάχιστον %2$d Mb."


DATABASE_LBL_SPECIFICTABLES_LBL="Επιλογή στοιχείων βάσης δεδομένων για επαναφορά"
DATABASE_LBL_SPECIFICTABLES_ADD_ALL="Προσθήκη όλων"
DATABASE_LBL_SPECIFICTABLES_CLEAR_ALL="Εκκαθάριση όλων"
DATABASE_LBL_SPECIFICTABLES_HELP="Από προεπιλογή, το σενάριο επαναφοράς θα επαναφέρει όλους τους πίνακες της βάσης δεδομένων. Εάν θέλετε να επαναφέρετε μόνο συγκεκριμένους πίνακες, επιλέξτε τους παρακάτω."
SETUP_LBL_SERVERCONFIG_DISABLEFORCESSL_WARN="Κάνετε επαναφορά σε μη κρυπτογραφημένο (HTTP) ιστότοπο, αλλά η Καθολική ρύθμιση παραμέτρων υποδεικνύει ότι ο ιστότοπος θα πρέπει να προσπελάζεται μέσω κρυπτογραφημένης (HTTPS) σύνδεσης. Εάν ο τρέχων ιστότοπός σας δεν υποστηρίζει HTTPS, ορίστε την παρακάτω επιλογή σε «Χωρίς»."

SETUP_LBL_HTACCESSCHANGE_LBL="Διαχείριση .htaccess"
SETUP_LBL_HTACCESSCHANGE_DESC="Επιλέξτε τι θα γίνει με το αρχείο <code>.htaccess</code> του ιστότοπού σας.<br/><strong>Χωρίς αλλαγή</strong>. Το αρχείο παραμένει ως έχει.<br/><strong>Χρήση προεπιλογής</strong>. Αντικαθιστά το περιεχόμενο του αρχείου .htaccess στον βασικό κατάλογο του ιστότοπού σας με το περιεχόμενο του τυπικού htaccess.txt που παρέχεται με το Joomla. Το παλιό αρχείο μετονομάζεται σε htaccess.bak<br/><strong>Αφαίρεση γραμμών PHP handler</strong> Αφαιρεί τυχόν γραμμές AddHandler/SetHandler από το αρχείο .htaccess σας. Αυτές είναι οδηγίες ειδικές για τον διακομιστή που συνήθως χρησιμοποιούνται για να εφαρμόσουν μια συγκεκριμένη έκδοση PHP στον ιστότοπό σας. Χρησιμοποιήστε κατά την επαναφορά σε διαφορετικό διακομιστή.<br/><strong>Αντικατάσταση γραμμών PHP handler</strong> Χρησιμοποιεί τις γραμμές AddHandler/SetHandler στο τρέχον αρχείο .htaccess σας. Χρησιμοποιήστε αυτό εάν έπρεπε να ορίσετε διαφορετική έκδοση PHP για τον ιστότοπό σας πριν εκτελέσετε το Kickstart ή τον Οδηγό Μεταφοράς Ιστότοπου.<br/>"
