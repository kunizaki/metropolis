SETUP_HEADER_SITEPARAMS="Παράμετροι ιστότοπου"
SETUP_HEADER_SITEPARAMS_HELP="Αυτές είναι οι βασικές παράμετροι του ιστότοπού σας. Μπορείτε πάντα να τις τροποποιήσετε μετά την ολοκλήρωση της επαναφοράς από το backend του ιστότοπού σας, στην Καθολική ρύθμιση παραμέτρων."
SETUP_LBL_SITENAME="Όνομα ιστότοπου"
SETUP_LBL_SITENAME_HELP="Το όνομα του ιστότοπού σας, για χρήση στις σελίδες HTML του ιστότοπου μεταξύ άλλων."
SETUP_LBL_SITEEMAIL="Διεύθυνση ηλεκτρονικού ταχυδρομείου ιστότοπου"
SETUP_LBL_SITEEMAIL_HELP="Η διεύθυνση ηλεκτρονικού ταχυδρομείου από την οποία θα εμφανίζονται να προέρχονται τα μηνύματα email του ιστότοπού σας."
SETUP_LBL_EMAILSENDER="Όνομα αποστολέα ηλεκτρονικού ταχυδρομείου ιστότοπου"
SETUP_LBL_EMAILSENDER_HELP="Το όνομα αποστολέα που χρησιμοποιείται για όλα τα μηνύματα email που αποστέλλει ο ιστότοπός σας."
SETUP_LBL_LIVESITE="URL ενεργού ιστότοπου"
SETUP_LBL_LIVESITE_HELP="Ορισμένοι διακομιστές δυσκολεύονται να προσδιορίσουν το URL του ιστότοπού σας, κάτι που μπορεί να οδηγήσει σε δυσλειτουργία των SEF URLs και των στοιχείων μενού. Σε αυτούς τους διακομιστές πρέπει να εισάγετε το URL του ιστότοπού σας χωρίς τη χαρακτήρα κάθετο στο τέλος, π.χ. <code>http://www.example.com</code>. Στις περισσότερες περιπτώσεις αυτό δεν είναι απαραίτητο και μπορείτε να αφήσετε αυτό το πεδίο κενό."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="ΠΡΟΕΙΔΟΠΟΙΗΣΗ! Ο διακομιστής ιστού σας εκτελείται σε Windows. Η συμπλήρωση του URL ενεργού ιστότοπου κατά την εκτέλεση ιστότοπου σε Windows θα καταστήσει αδύνατη τη σύνδεση στον χώρο διαχειριστή του ιστότοπού σας λόγω σφάλματος στο Joomla!. Παρακαλούμε αφήστε αυτό το πλαίσιο κενό."
SETUP_LBL_USESITEDIRS="Παράκαμψη διαδρομών tmp και log"
SETUP_LBL_USESITEDIRS_HELP="Το σενάριο επαναφοράς θα χρησιμοποιεί από προεπιλογή τις διαδρομές tmp και log που έχουν ήδη ρυθμιστεί στην Καθολική ρύθμιση παραμέτρων του αντίγραφου ασφαλείας. Εάν κάνετε επαναφορά σε διαφορετικό διακομιστή ή κλωνοποιείτε τον ιστότοπό σας, αυτό μπορεί να προκαλέσει προβλήματα. Σε αυτή την περίπτωση, ή εάν δεν είστε σίγουροι, κάντε κλικ στο κουμπί — το σενάριο επαναφοράς θα συμπληρώσει τις διαδρομές Προσωρινού καταλόγου και Καταλόγου αρχείων καταγραφής με κατάλληλες τιμές για τον ιστότοπο στον οποίο κάνετε επαναφορά. Μπορείτε να αλλάξετε αυτές τις διαδρομές στην παρακάτω ενότητα Λεπτομερής ρύθμιση καταλόγων."
SETUP_LBL_USESITEDIRS_51="Παράκαμψη διαδρομών tmp, log και cache"
SETUP_LBL_USESITEDIRS_HELP_51="Το σενάριο επαναφοράς θα χρησιμοποιεί από προεπιλογή τις διαδρομές tmp, log και cache που έχουν ήδη ρυθμιστεί στην Καθολική ρύθμιση παραμέτρων του αντίγραφου ασφαλείας. Εάν κάνετε επαναφορά σε διαφορετικό διακομιστή ή κλωνοποιείτε τον ιστότοπό σας, αυτό μπορεί να προκαλέσει προβλήματα. Σε αυτή την περίπτωση, ή εάν δεν είστε σίγουροι, κάντε κλικ στο κουμπί — το σενάριο επαναφοράς θα συμπληρώσει τις διαδρομές Προσωρινού καταλόγου και Καταλόγου αρχείων καταγραφής με κατάλληλες τιμές για τον ιστότοπο στον οποίο κάνετε επαναφορά, και θα επαναφέρει τον Κατάλογο προσωρινής μνήμης σε κενή συμβολοσειρά (που υποδεικνύει στο Joomla! να χρησιμοποιεί τον φάκελο <code>administrator/cache</code>). Μπορείτε να αλλάξετε αυτές τις διαδρομές στην παρακάτω ενότητα Λεπτομερής ρύθμιση καταλόγων."

SETUP_LBL_COOKIEDOMAIN="Τομέας cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="Ο Τομέας cookie είναι το όνομα τομέα του ιστότοπού σας, χωρίς το πρωτόκολλο και, συνήθως, χωρίς το τμήμα www. Για παράδειγμα, εάν κάνετε επαναφορά στο http://www.example.com, ο Τομέας cookie είναι example.com (Τονίζουμε και πάλι: ΔΕΝ υπάρχει http:// εκεί!!)."
SETUP_LBL_COOKIEPATH="Διαδρομή cookie"
SETUP_LBL_COOKIEPATH_HELP="Η Διαδρομή cookie είναι ο υποκατάλογος του ιστότοπού σας, σχετικά με τον βασικό κατάλογο του τομέα. Εάν κάνετε επαναφορά στον βασικό κατάλογο ενός τομέα, π.χ. http://www.example.com, τότε είναι / (μια μονή κάθετος). Εάν κάνετε επαναφορά σε υποκατάλογο, είναι μια κάθετος ακολουθούμενη από το όνομα του καταλόγου. Για παράδειγμα, εάν κάνετε επαναφορά στο http://www.example.com/joomla τότε η Διαδρομή cookie είναι /joomla (ΜΕ κάθετο στην αρχή, αλλά ΧΩΡΙΣ κάθετο στο τέλος)."

SETUP_HEADER_FTPPARAMS="Επιλογές επιπέδου FTP"
SETUP_HEADER_FTPPARAMS_HELP="Αυτές είναι προαιρετικές ρυθμίσεις που επιτρέπουν στο Joomla! να χρησιμοποιεί FTP για εγγραφή σε αρχεία και καταλόγους που διαφορετικά δεν θα ήταν εγγράψιμοι. Αυτό συνήθως απαιτείται μόνο σε κοινόχρηστους παρόχους φιλοξενίας. Δείτε το κείμενο βοήθειας των επιλογών για περισσότερες πληροφορίες."
SETUP_LABEL_FTPENABLE="Ενεργοποίηση επιπέδου FTP"
SETUP_LABEL_FTPENABLE_HELP="Ορισμένοι κοινόχρηστοι πάροχοι φιλοξενίας καθιστούν αδύνατο για την PHP να γράψει σε αρχεία και καταλόγους που έχουν αποσταλεί μέσω FTP. Εάν βρίσκεστε σε έναν τέτοιο πάροχο και έχετε χρησιμοποιήσει FTP ή την επιλογή εξαγωγής «Αποστολή μέσω FTP» του Kickstart, πρέπει να ρυθμίσετε και να ενεργοποιήσετε το επίπεδο FTP."
SETUP_LABEL_FTPHOST="Όνομα κεντρικού υπολογιστή"
SETUP_LABEL_FTPHOST_HELP="Το όνομα κεντρικού υπολογιστή ή η διεύθυνση IP του διακομιστή FTP σας <b>χωρίς</b> τον προσδιορισμό πρωτοκόλλου ftp://. Συνήθως είναι localhost ή 127.0.0.1. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας σας."
SETUP_LABEL_FTPPORT="Θύρα"
SETUP_LABEL_FTPPORT_HELP="Η θύρα TCP στην οποία ακούει ο διακομιστής FTP. Συνήθως είναι 21. Εάν δεν είστε σίγουροι, ορίστε τη σε 21 ή ρωτήστε τον πάροχο φιλοξενίας σας."
SETUP_LABEL_FTPUSER="Όνομα χρήστη"
SETUP_LABEL_FTPUSER_HELP="Το όνομα χρήστη που χρησιμοποιείτε για σύνδεση μέσω FTP. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας σας."
SETUP_LABEL_FTPPASS="Κωδικός πρόσβασης"
SETUP_LABEL_FTPPASS_HELP="Ο κωδικός πρόσβασης που χρησιμοποιείτε για σύνδεση μέσω FTP. Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας σας."
SETUP_LABEL_FTPDIR="Κατάλογος"
SETUP_LABEL_FTPDIR_HELP="Ο κατάλογος FTP όπου βρίσκονται τα αρχεία του ιστότοπού σας (π.χ. index.php). Εάν δεν είστε σίγουροι, ρωτήστε τον πάροχο φιλοξενίας σας."

SETUP_HEADER_SUPERUSERPARAMS="Ρυθμίσεις Υπερ-χρήστη"
SETUP_HEADER_SUPERUSERPARAMS_HELP="Το σενάριο επαναφοράς επαναφέρει τον ιστότοπό σας με τον Υπερ-χρήστη που είχε συμπεριληφθεί στο αντίγραφο ασφαλείας του αρχικού ιστότοπου. Μπορείτε προαιρετικά να επιλέξετε έναν (και μόνο έναν) Υπερ-χρήστη σε αυτή τη σελίδα και να αλλάξετε τη διεύθυνση ηλεκτρονικού ταχυδρομείου και τον κωδικό πρόσβασής του. Αυτό είναι εξαιρετικά χρήσιμο όταν κλωνοποιείτε έναν ιστότοπο."
SETUP_LABEL_SUPERUSER="Υπερ-χρήστης"
SETUP_LABEL_SUPERUSER_HELP="Μπορείτε προαιρετικά να επιλέξετε έναν λογαριασμό Υπερ-χρήστη του οποίου το ηλεκτρονικό ταχυδρομείο ή/και ο κωδικός πρόσβασης θα αλλάξουν στον επαναφερόμενο ιστότοπο. <b>Μόνο ο επιλεγμένος Υπερ-χρήστης θα τροποποιηθεί.</b> Εάν δεν επιθυμείτε να το κάνετε αυτό, αφήστε την προεπιλεγμένη επιλογή «—» η οποία δεν τροποποιεί κανέναν λογαριασμό χρήστη."
SETUP_LABEL_SUPERADMIN="Διαχειριστής"
SETUP_LABEL_SUPERUSEREMAIL="Ηλεκτρονικό ταχυδρομείο"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Εισαγάγετε τη διεύθυνση ηλεκτρονικού ταχυδρομείου του Υπερ-χρήστη. Βεβαιωθείτε ότι δεν χρησιμοποιείται από άλλον χρήστη στον ιστότοπο, διαφορετικά ο επαναφερόμενος ιστότοπός σας θα είναι κατεστραμμένος!"
SETUP_LABEL_SUPERUSERPASSWORD="Κωδικός πρόσβασης"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Εισαγάγετε τον νέο κωδικό πρόσβασης για τον Υπερ-χρήστη. Εάν δεν επιθυμείτε να αλλάξετε τον κωδικό πρόσβασης του Υπερ-χρήστη, αφήστε αυτό και τα επόμενα πεδία κενά."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Εισαγάγετε τον νέο κωδικό πρόσβασης για τον Υπερ-χρήστη."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Κωδικός πρόσβασης (επανάληψη)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Επαναλάβετε τον κωδικό πρόσβασης. Αυτό μας επιτρέπει να βεβαιωθούμε ότι δεν κάνατε τυπογραφικό λάθος παραπάνω."

SETUP_HEADER_FINETUNING="Λεπτομερής ρύθμιση καταλόγων"
SETUP_HEADER_FINETUNING_HELP="Το Joomla! χρειάζεται δύο εγγράψιμους καταλόγους για τα προσωρινά αρχεία και τα αρχεία καταγραφής του. Μπορείτε να τους ορίσετε εδώ. Συμβουλή: εάν δεν είναι εγγράψιμοι αλλά έχετε ήδη ενεργοποιήσει το επίπεδο FTP παραπάνω, το σενάριο επαναφοράς θα επιχειρήσει να τους καταστήσει εγγράψιμους και να τους ασφαλίσει αυτόματα."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Δημιουργία νέου μυστικού"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Ενεργοποιήστε αυτό όταν μετακινείτε τον ιστότοπό σας μεταξύ διακομιστών ή/και τομέων. Δημιουργεί νέα μυστικά στο αρχείο ρύθμισης παραμέτρων του ιστότοπού σας για να αποτρέψει την επαναχρησιμοποίηση συνεδρίας από τον παλιό ιστότοπο. Σημειώστε ότι λογισμικό τρίτων που χρησιμοποιεί τα μυστικά του ιστότοπου για κρυπτογράφηση πληροφοριών ενδέχεται να μην μπορεί να έχει πρόσβαση στα δεδομένα του εάν το κάνετε αυτό."
SETUP_LABEL_SITEROOT="Βασικός κατάλογος ιστότοπου"
SETUP_LABEL_SITEROOT_HELP="Αυτή είναι η διαδρομή προς τον βασικό κατάλογο του ιστότοπού σας. Εμφανίζεται για τη διευκόλυνσή σας. Κάντε τριπλό κλικ (ή παρατεταμένο άγγιγμα) για να τη επιλέξετε. Στη συνέχεια μπορείτε να την αντιγράψετε και να τη χρησιμοποιήσετε στα παρακάτω πεδία."
SETUP_LABEL_TMPPATH="Προσωρινός κατάλογος"
SETUP_LABEL_TMPPATH_HELP="Ο κατάλογος όπου το Joomla! θα αποθηκεύει προσωρινά δεδομένα. Συνιστάται να τον τοποθετήσετε εκτός του βασικού καταλόγου του ιστότοπού σας. Προεπιλογή: ο κατάλογος <code>tmp</code> κάτω από τον βασικό κατάλογο του ιστότοπού σας."
SETUP_LABEL_LOGSPATH="Κατάλογος αρχείων καταγραφής"
SETUP_LABEL_LOGSPATH_HELP="Ο κατάλογος όπου το Joomla! θα αποθηκεύει τα αρχεία καταγραφής του. Συνιστάται να τον τοποθετήσετε εκτός του βασικού καταλόγου του ιστότοπού σας. Προεπιλογή: ο κατάλογος <code>log</code> κάτω από τον βασικό κατάλογο του ιστότοπού σας."
SETUP_LBL_CACHE_PATH="Κατάλογος προσωρινής μνήμης"
SETUP_LBL_CACHE_PATH_HELP="Ο κατάλογος όπου το Joomla! θα αποθηκεύει τα προσωρινά αρχεία cache του. Συνιστάται να τον τοποθετήσετε εκτός του βασικού καταλόγου του ιστότοπού σας. Εάν τον αφήσετε κενό, θα χρησιμοποιηθεί ο κατάλογος <code>administrator/cache</code> κάτω από τον βασικό κατάλογο του ιστότοπού σας (προεπιλεγμένη και προτεινόμενη τιμή). ΣΗΜΕΙΩΣΗ: Το Joomla! θα χρησιμοποιεί πάντα τον <code>administrator/cache</code> για το αρχείο <code>autoload_psr4.php</code> εκτός εάν η σταθερά <code>JPATH_CACHE</code> έχει παρακαμφθεί."

SETUP_ERR_PASSWORDSDONTMATCH="Οι κωδικοί πρόσβασης του Υπερ-χρήστη δεν ταιριάζουν"
SETUP_ERR_EMAILEMPTY="Η διεύθυνση ηλεκτρονικού ταχυδρομείου του Υπερ-χρήστη είναι κενή"

