MAIN_HEADER_RECOMMENDED="Προτεινόμενες ρυθμίσεις"
MAIN_LBL_RECOMMENDED="Αυτές οι ρυθμίσεις συνιστώνται για την PHP προκειμένου να διασφαλιστεί πλήρης συμβατότητα με το λογισμικό του ιστότοπού σας. Ωστόσο, ο ιστότοπός σας θα πρέπει να λειτουργεί ακόμα και αν οι ρυθμίσεις σας δεν αντιστοιχούν ακριβώς στη συνιστώμενη ρύθμιση παραμέτρων."

