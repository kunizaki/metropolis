DATABASE_NOCONNECTORS_LBL_SUMMARY="Sie müssen Ihren Hoster oder den Support-Kanal Ihrer Serverumgebung um entsprechende Anweisungen bitten, um die PHP-Erweiterungen <code>mysqli</code> oder <code>pdo_mysql</code> für PHP %s zu aktivieren."
DATABASE_NOCONNECTORS_LBL_NOAI="Wir raten dringend <em>davon ab</em>, „KI"-Assistenten (z. B. ChatGPT, Copilot usw.) zur Lösung dieses Problems zu verwenden. Wahrscheinlich erhalten Sie veraltete, falsche oder gefährliche Anweisungen, die Ihr Problem weiter verkomplizieren könnten."
DATABASE_NOCONNECTORS_LBL_PHP_PER_VERSION_CONFIG="Bitte beachten Sie, dass <em>jede PHP-Version ihre eigene Konfiguration hat</em>; stellen Sie sicher, dass Sie die Erweiterungen für die richtige PHP-Version aktivieren."
