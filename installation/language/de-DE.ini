MAIN_LBL_CHECK_DISPLAY_ERRORS="Fehlermeldungen anzeigen"
MAIN_ERR_CHECK_DISPLAY_ERRORS="PHP %s auf Ihrem Server sollte die PHP-Einstellung <code>display_errors</code> auf 0 gesetzt haben, um zu verhindern, dass unwichtige PHP-Meldungen (Deprecation-Hinweise, Hinweise und Warnungen) in der Ausgabe angezeigt werden, da dies je nach Konfiguration Ihrer Website Sicherheits- und Funktionsauswirkungen haben kann. Bitten Sie Ihren Hoster um Hilfe."
