SETUP_LABEL_FTPDISABLE="FTP-Schicht deaktivieren"
SETUP_REPLACE_DATA_BATCHSIZE="Chargengröße"
SETUP_REPLACE_DATA_MAX_EXEC="Maximale Ausführungszeit"

SETUP_LABEL_FORCESSL="SSL erzwingen"
SETUP_LABEL_FORCESSL_TIP="Erzwingt, dass der Website-Zugriff immer über SSL (https) für ausgewählte Website-Bereiche erfolgt. Wenn Sie SSL auf Ihrer Website aktiviert haben, empfehlen wir aus Sicherheitsgründen immer die Option „Gesamte Website"."
SETUP_LABEL_FORCESSL_NONE="Keine"
SETUP_LABEL_FORCESSL_ADMINONLY="Nur Administrator"
SETUP_LABEL_FORCESSL_ENTIRESITE="Gesamte Website"
SETUP_HEADER_SERVERCONFIG="Serverspezifische Konfigurationsdateien"
SETUP_SERVERCONFIG_DESCR="Dateien, die die Art und Weise ändern, wie Ihr Server Ihre Website ausliefert, können beim Wiederherstellen auf einem neuen Hoster zu Problemen beim Laden der Website führen. Verwenden Sie die folgenden Optionen, um sie auf die Joomla!-Standardeinstellungen zurückzusetzen."
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI="Entfernt .user.ini- und / oder php.ini-Dateien aus den Haupt-Website-Verzeichnissen"
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI_HELP="Benennt die PHP-Konfigurationsdateien <strong>.user.ini</strong> und <strong>php.ini</strong> im Stammverzeichnis der Website und im Administrator-Verzeichnis um. Die umbenannten Dateien haben die Erweiterung .bak."
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG="Hauptdatei web.config durch Standardversion ersetzen"
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG_HELP="Ersetzt den Inhalt der Datei web.config im Stammverzeichnis Ihrer Website durch den Inhalt der Standard-Datei web.config.txt, die mit Joomla ausgeliefert wird. Die alte Datei wird in web.config.bak umbenannt."
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Die .htaccess- und .htpasswd-Dateien im Administrator-Verzeichnis löschen"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Löscht die .htaccess- und .htpasswd-Dateien im Administrator-Verzeichnis. Aktivieren Sie dies, wenn Sie dem Administrator-Verzeichnis einen Passwortschutz hinzugefügt hatten — entweder über das Kontrollpanel Ihres Hosters oder eine Drittanbieter-Sicherheitserweiterung wie Admin Tools — und Sie auf einem neuen Server wiederherstellen, der nicht dieselbe Passwortverschlüsselungsmethode wie Ihr alter Server unterstützt. <strong>WICHTIG</strong>: Denken Sie daran, den Passwortschutz für das Administrator-Verzeichnis nach Abschluss der Wiederherstellung erneut zu aktivieren!"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="Die von dieser Option referenzierten Dateien existieren nicht auf Ihrem Server. Das ist gut! Sie müssen sich nicht damit befassen und benötigen diese Option nicht."

DATABASE_WARN_LARGE_COLUMNS="Die größte Datenbankzeile Ihrer Datenbank ist %1$0.2f MB. Ihr Datenbankserver ist jedoch wahrscheinlich so konfiguriert, dass er nur bis zu %3$0.2f MB akzeptiert (ohne Verbindung zum Datenbankserver können wir das nicht überprüfen). Wenn Sie mit der Datenbankwiederherstellung fortfahren, erhalten Sie höchstwahrscheinlich den Datenbankfehlercode 1153; oder eine Fehlermeldung 'ER_NET_PACKET_TOO_LARGE'; oder eine Fehlermeldung 'Got a packet bigger than 'max_allowed_packet' bytes'. Wenn dies passiert, bitten Sie bitte Ihren Hoster, den Wert der Konfigurationsvariable <strong>max_allowed_packet</strong> Ihres Datenbankservers auf mindestens %2$d MB zu setzen."


DATABASE_LBL_SPECIFICTABLES_LBL="Datenbankeinträge zur Wiederherstellung auswählen"
DATABASE_LBL_SPECIFICTABLES_ADD_ALL="Alle hinzufügen"
DATABASE_LBL_SPECIFICTABLES_CLEAR_ALL="Alle entfernen"
DATABASE_LBL_SPECIFICTABLES_HELP="Standardmäßig stellt das Wiederherstellungsskript alle Tabellen in der Datenbank wieder her. Wenn Sie nur bestimmte Tabellen wiederherstellen möchten, wählen Sie diese bitte unten aus."
SETUP_LBL_SERVERCONFIG_DISABLEFORCESSL_WARN="Sie stellen auf einer unverschlüsselten (HTTP) Website wieder her, aber Ihre Globale Konfiguration gibt an, dass die Website über eine verschlüsselte (HTTPS) Verbindung aufgerufen werden soll. Wenn Ihre aktuelle Website HTTPS nicht unterstützt, setzen Sie die Option unten bitte auf „Keine"."

SETUP_LBL_HTACCESSCHANGE_LBL=".htaccess-Behandlung"
SETUP_LBL_HTACCESSCHANGE_DESC="Wählen Sie aus, was mit der <code>.htaccess</code>-Datei Ihrer Website geschehen soll.<br/><strong>Keine Änderung</strong>. Die Datei wird unverändert beibehalten.<br/><strong>Standard verwenden</strong>. Ersetzt den Inhalt der .htaccess-Datei im Stammverzeichnis Ihrer Website durch den Inhalt der Standard-Datei htaccess.txt, die mit Joomla ausgeliefert wird. Die alte Datei wird in htaccess.bak umbenannt.<br/><strong>PHP-Handler-Zeilen entfernen</strong>: Entfernt alle AddHandler/SetHandler-Zeilen aus Ihrer .htaccess-Datei. Dies sind serverspezifische Direktiven, die normalerweise verwendet werden, um eine bestimmte PHP-Version auf Ihre Website anzuwenden. Verwenden Sie diese Option, wenn Sie auf einen anderen Server wiederherstellen.<br/><strong>PHP-Handler-Zeilen ersetzen</strong>: Verwendet die AddHandler/SetHandler-Zeilen in Ihrer aktuellen .htaccess-Datei. Verwenden Sie dies, wenn Sie vor der Ausführung von Kickstart oder dem Site Transfer Wizard eine andere PHP-Version für Ihre Website einstellen mussten.<br/>"
SETUP_LBL_HTACCESSCHANGE_NONE="Keine Änderung"
SETUP_LBL_HTACCESSCHANGE_DEFAULT="Standard verwenden"
SETUP_LBL_HTACCESSCHANGE_REMOVEHANDLER="PHP-Handler-Zeilen entfernen"
SETUP_LBL_HTACCESSCHANGE_REPLACEHANDLER="PHP-Handler-Zeilen ersetzen"
