MAIN_LBL_EXTRAINFO_WHATIS_DETAILS="Es wird ein Vergleich der zum Zeitpunkt des Backups erfassten Informationen mit den entsprechenden Informationen des Servers angezeigt, auf dem Sie die Wiederherstellung durchführen. Unterschiede zwischen diesen Einstellungen können sich auf die wiederhergestellte Website auswirken."
