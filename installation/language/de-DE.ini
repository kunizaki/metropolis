; ==============================================================================
FINALISE_LBL_DONTFORGETCONFIG="Sie müssen die Datei <code>%s</code> anhand der unten stehenden Informationen erstellen, damit Ihre wiederhergestellte Website korrekt funktioniert."
FINALISE_HEADER_CONFIGURATION="Ihre configuration.php erstellen"
FINALISE_LBL_ACTION_REQUIRED="Handlung erforderlich"
FINALISE_LBL_CONFIGINTRO="Das Wiederherstellungsskript konnte die Datei <code>%1$s</code> Ihrer Website nicht automatisch schreiben. Sie müssen dies selbst tun. Öffnen Sie einen <em>Nur-Text</em>-Editor wie Notepad++ (Windows), gEdit (Linux) oder Textastic (macOS). Erstellen Sie eine neue Datei namens <code>%1$s</code> mit folgendem Inhalt:"
FINALISE_LBL_CONFIGOUTRO="Denken Sie daran, diese Datei als <code>%s</code> im Stammverzeichnis Ihrer Website hochzuladen. Das Stammverzeichnis Ihrer Website heißt normalerweise public_html, www, httpdocs, htdocs oder ähnlich. Wenn Sie nicht sicher sind, welches Ihr Website-Stammverzeichnis ist, fragen Sie bitte Ihren Hoster."
FINALISE_LBL_COPYCONFIG="In die Zwischenablage kopieren"
FINALISE_BTN_REMOVEINSTALLATION="Installationsverzeichnis entfernen"

FINALISE_LBL_READY="Die Wiederherstellung ist abgeschlossen"
FINALISE_LBL_NEXT_STEPS="Nächste Schritte"
FINALISE_LBL_ALMOSTREADY="Die Wiederherstellung ist <em>fast</em> abgeschlossen"
FINALISE_LBL_MAKESURECONFIG="Stellen Sie sicher, dass Sie die Datei <code>%s</code> wie oben beschrieben erstellt haben, und überprüfen Sie deren Inhalt anhand der auf dieser Seite angezeigten Informationen. Wenn Sie das nicht tun, <em>wird</em> Ihre Website beschädigt sein."
FINALISE_LBL_KICKSTART="Schließen Sie dieses Fenster, um zu Kickstart zurückzukehren. Klicken Sie auf die Schaltfläche <strong>Aufräumen</strong>, um Ihre wiederhergestellte Website zu nutzen."
FINALISE_LBL_INTEGRATED="Schließen Sie dieses Fenster, um zur Wiederherstellungsseite zurückzukehren. Klicken Sie auf die Schaltfläche <strong>Aufräumen</strong>, um Ihre wiederhergestellte Website zu nutzen."
FINALISE_LBL_STANDALONE="Klicken Sie auf die folgende Schaltfläche, um das Wiederherstellungsskript zu entfernen und Ihre Website zu nutzen."

FINALISE_HEADER_ERROR="Ein Fehler ist aufgetreten"
FINALISE_LBL_ERROR="Wir konnten Ihr Verzeichnis <code>installation</code> nicht automatisch entfernen. Schließen Sie bitte dieses Meldungsfeld, indem Sie auf die Schaltfläche &times; in der oberen rechten Ecke klicken. Entfernen Sie dann das Verzeichnis <code>installation</code> manuell, z. B. über den Datei-Browser Ihres Hosting-Kontrollpanels oder per FTP/SFTP."

FINALISE_HEADER_SUCCESS="Bereit, Ihre Website zu nutzen!"
FINALISE_LBL_SUCCESS="Das Verzeichnis <code>installation</code> wurde entfernt und Ihre Website ist einsatzbereit. Bitte beachten Sie, dass aufgrund von Unterschieden in der Serverkonfiguration möglicherweise einige Probleme beim Arbeiten mit Ihrer Website auftreten. In diesem Fall konsultieren Sie bitte die folgende URL:<br/><span class='label label-info'><code>%s</code></span><br/>Tipp: Setzen Sie diese URL als Lesezeichen für zukünftige Referenz.<br/>Klicken Sie nun auf die Schaltfläche unten, um das Frontend Ihrer Website zu besuchen."
FINALISE_BTN_VISITFRONTEND="Frontend Ihrer Website besuchen"

OFFSITEDIRS_HEADER_MASTER="Wiederherstellung von <code>%s</code>"
OFFSITEDIRS_LBL_EXPLANATION="<p>Als Sie Ihre Website gesichert haben, befanden sich einige Dateien außerhalb des Stammverzeichnisses Ihrer Website (dem gesicherten Hauptordner). Die betreffenden Dateien befanden sich im Ordner <code>%s</code>.</p><p>Diese Dateien werden derzeit nach <code>%s</code> extrahiert, was <em>nicht</em> der Ort ist, an dem sie für das Funktionieren Ihrer Website sein müssen. Dies ist nur ein temporärer Speicherort, der dadurch bedingt ist, dass beim Extrahieren eines Archivs keine Dateien <em>oberhalb</em> des Ordners erstellt werden können, in den Sie extrahieren. Daher müssen Sie diese Dateien verschieben, damit Ihre Website funktioniert.</p><p>Sie können unten den absoluten Dateisystempfad angeben, an den sie kopiert werden müssen. Zur Information: Ihre Website wird derzeit an den absoluten Dateisystempfad <code>%s</code> extrahiert.</p>"
OFFSITEDIRS_FOLDER_DETAILS="Ordnerdetails"
OFFSITEDIRS_VIRTUAL_FOLDER="Aktuell gespeichert in"
OFFSITEDIRS_TARGET_FOLDER="Wird kopiert nach"
OFFSITEDIRS_ERR_INVALIDKEY="Ungültiges virtuelles Verzeichnis"
OFFSITEDIRS_HEADER_COPY="Ordner kopieren"
OFFSITEDIRS_HEADER_SUCCESS="Ordner kopieren war erfolgreich"
OFFSITEDIRS_MSG_SUCCESS="Klicken Sie auf die Schaltfläche unten, um zum nächsten Schritt zu gelangen"
OFFSITEDIRS_BTN_SUCCESS="Nächster Schritt"
OFFSITEDIRS_HEADER_ERROR="Beim Kopieren des Ordners ist ein Fehler aufgetreten. Die Fehlermeldung finden Sie unten. Klicken Sie auf die Schaltfläche &times; oben rechts in diesem Dialogfeld, um es zu schließen und zur Seite für das externe Kopieren zurückzukehren."
OFFSITEDIRS_VIRTUAL_DIR_NOT_FOUND="Virtuelles Verzeichnis nicht gefunden.<br/> Bitte überspringen Sie diesen Schritt und versuchen Sie, Ihre Website erneut zu sichern."
OFFSITEDIRS_VIRTUAL_COPY_ERROR="Beim Kopieren des virtuellen Verzeichnisses an seine Zielposition ist ein Fehler aufgetreten.<br/> Höchstwahrscheinlich liegt ein Berechtigungsproblem vor, sodass Sie das Verzeichnis manuell aus dem Verzeichnis <code>external_folder</code> kopieren müssen."

