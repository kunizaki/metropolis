MAIN_LBL_EXTRAINFO_HOST="Hostname"
MAIN_LBL_EXTRAINFO_HOST_DIFFERS_JOOMLA="Die Wiederherstellung einer Joomla!-Website auf einer anderen Domain oder Subdomain ist in der Regel kein Problem. Möglicherweise müssen Sie einige Drittanbieter-Erweiterungen neu konfigurieren, wenn diese den vollständigen Domainnamen bzw. URL-Pfad in ihrer Konfiguration speichern, obwohl Joomla! den korrekten Wert zur Laufzeit bereitstellt."
MAIN_LBL_EXTRAINFO_HOST_DIFFERS_WORDPRESS="Wenn Sie eine WordPress-Website auf einer anderen Domain oder Subdomain wiederherstellen, müssen die zahlreichen in der WordPress-Datenbank gespeicherten Verweise auf die URL der Website ersetzt werden. Dieses Wiederherstellungsskript kann das für Sie im Schritt „Daten ersetzen" gegen Ende des Wiederherstellungsprozesses erledigen."
MAIN_LBL_EXTRAINFO_HOST_DIFFERS_GENERIC="Sie stellen Ihre Website auf einer anderen Domain oder Subdomain wieder her. Bitte prüfen Sie, ob Sie Ihre Website nach Abschluss des Wiederherstellungsprozesses neu konfigurieren müssen."

MAIN_LBL_EXTRAINFO_DATE="Datum"
MAIN_LBL_EXTRAINFO_DATE_PAST="Das aktuelle Datum scheint vor dem Backup-Datum zu liegen. Bitte stellen Sie sicher, dass auf dem neuen Server das korrekte Datum, die korrekte Uhrzeit und die korrekte Zeitzone eingestellt sind."

MAIN_LBL_EXTRAINFO_AKEEBAVERSION="Version der Backup-Software"
MAIN_LBL_EXTRAINFO_AKEEBAVERSION_OLDER="Das Wiederherstellungsskript ist älter als die Version von Akeeba Backup, die das Backup erstellt hat. Dies wird höchstwahrscheinlich zu Problemen bei der Wiederherstellung führen; ältere Versionen des Wiederherstellungsskripts kennen neue Funktionen nicht, die in späteren Versionen von Akeeba Backup eingeführt wurden."

MAIN_LBL_EXTRAINFO_PHPVERSION="PHP-Version"
MAIN_LBL_EXTRAINFO_PHPVERSION_DIFFERS="Sie stellen auf einer anderen PHP-Version (%s) wieder her als die, auf der Ihre gesicherte Website lief (%s). Einige der Software auf Ihrer Website ist möglicherweise damit nicht kompatibel."

MAIN_LBL_EXTRAINFO_ROOT="Stammverzeichnis"
MAIN_LBL_EXTRAINFO_ROOT_DIFFERS_JOOMLA="Die Wiederherstellung einer Joomla!-Website in einem anderen Verzeichnis ist in der Regel kein Problem. Möglicherweise müssen Sie einige Drittanbieter-Erweiterungen neu konfigurieren, wenn diese den vollständigen Pfad zu Ihrer Website in ihrer Konfiguration speichern, obwohl Joomla! den korrekten Wert zur Laufzeit bereitstellt."
MAIN_LBL_EXTRAINFO_ROOT_DIFFERS_WORDPRESS="Wenn Sie eine WordPress-Website in einem anderen Verzeichnis wiederherstellen, müssen die zahlreichen in der WordPress-Datenbank gespeicherten Verweise auf das Verzeichnis der Website ersetzt werden. Dieses Wiederherstellungsskript kann das für Sie im Schritt „Daten ersetzen" gegen Ende des Wiederherstellungsprozesses erledigen."
MAIN_LBL_EXTRAINFO_ROOT_DIFFERS_GENERIC="Sie stellen Ihre Website in einem anderen Verzeichnis wieder her als dem, aus dem Sie das Backup erstellt haben. Bitte prüfen Sie, ob Sie Ihre Website nach Abschluss des Wiederherstellungsprozesses neu konfigurieren müssen."

