DATABASE_NOCONNECTORS_LBL_STEP_HEAD="Können Sie Schritt-für-Schritt-Anleitungen geben?"
DATABASE_NOCONNECTORS_LBL_STEP_NO="Grundsätzlich nein, das können wir nicht."
DATABASE_NOCONNECTORS_LBL_STEP_SPECIFIC="Die Anweisungen sind für jede Hosting-Umgebung spezifisch. Es ist in der Regel schneller und genauer, die Personen zu fragen, die die Hosting-Umgebung aufgebaut haben und warten, um spezifische Anweisungen zu erhalten."
DATABASE_NOCONNECTORS_LBL_INERROR_HEAD="Kann ich diese Meldung fälschlicherweise erhalten?"
DATABASE_NOCONNECTORS_LBL_INERROR_NO="Nein, Sie können diese Meldung unmöglich fälschlicherweise erhalten."
DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Diese Meldung erscheint, wenn PHP meldet, dass keine der Datenbankverbindungsfunktionen für MySQL-kompatible Datenbankserver verfügbar sind."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Bitte beachten Sie, dass Ihr Server möglicherweise meldet, dass die Erweiterungen für eine andere PHP-Version oder PHP-Installation installiert sind, z. B. die separate PHP-Installation des Hosting-Kontrollpanels. Dies ist nicht dieselbe PHP-Installation und/oder -Version, die Sie zur Wiederherstellung Ihrer Website verwenden."
DATABASE_NOCONNECTORS_LBL_USEOTHER_HEAD="Kann ich eine andere Datenbanktechnologie verwenden, z. B. PostgreSQL?"
DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="Nein, das können Sie nicht."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Verschiedene Datenbanktechnologien verwenden inkompatible Datenbankstrukturen, Datenformate, Datenbanktreiber und erfordern unterschiedlich geschriebenen SQL- und PHP-Code. Sie können keine Nicht-MySQL-Datenbank mit Daten verwenden, die aus einer MySQL-kompatiblen Datenbank stammen und für eine solche geschrieben wurden."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="Wird es funktionieren, wenn ich meine Website neu installiere?"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="Nein, das wird es nicht."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="Ihr CMS muss ebenfalls eine Verbindung zur Datenbank herstellen. Der einzige Weg dazu ist die Verwendung derselben PHP-Erweiterungen. Sie werden daher dasselbe Problem haben."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="Es <em>kann</em> möglich sein, dass Ihr CMS Ihnen erlaubt, eine andere Datenbanktechnologie bei der Installation einer neuen Website zu verwenden, z. B. PostgreSQL. Allerdings wird nicht alle Software, die Sie zuvor auf Ihrer Website verwendet haben, damit funktionieren. Dies wird es Ihnen unmöglich machen, Ihre Website neu aufzubauen."

