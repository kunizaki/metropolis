MAIN_ERR_CHECK_UPLOADS_SUPPORT="PHP %s auf Ihrem Server sollte die PHP-Einstellung <code>file_uploads</code> auf 1 gesetzt haben, um Datei-Uploads zu ermöglichen. Dies ist für die Medienverwaltung und die Software-Installation erforderlich. Bitten Sie Ihren Hoster um Hilfe."
