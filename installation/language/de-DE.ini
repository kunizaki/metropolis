DATABASE_HEADER_CONNECTION="Verbindungsinformationen"
DATABASE_LBL_TYPE="Datenbanktyp"
DATABASE_LBL_TYPE_HELP="Dies ist normalerweise MySQLi (<em>mit</em> dem abschließenden „i")"
DATABASE_LBL_HOSTNAME="Hostname des Datenbankservers"
DATABASE_LBL_HOSTNAME_HELP="Der Hostname oder die IP-Adresse des Datenbankservers (normalerweise: localhost). <strong>WICHTIG!</strong> <code>localhost</code> und <code>127.0.0.1</code> bedeuten zwei verschiedene Dinge, siehe unten. Verbindungsbeispiele:<ul><li><code>localhost</code></li> Verbindung zu localhost über den Standard-UNIX-Socket (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Verbindung zu localhost über TCP/IP mit dem Standardport (3306).<li><code>127.0.0.1:1234</code></li> Verbindung zu localhost über TCP/IP mit Port 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Verbindung zum IPv6-Host unter der Adresse 2607:f0d0:1002:51::4 über TCP/IP mit Port 1234. Hinweis: Alle IPv6-Adressen MÜSSEN in eckige Klammern eingeschlossen werden!</li><li><code>mysql.example.com:1234</code></li> Verbindung zu mysql.example.com über TCP/IP mit Port 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Verbindung über den UNIX-Socket in /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Verbindung über die Windows Named Pipe „MySQL" (funktioniert offensichtlich nur auf Windows-Servern).</ul>"
DATABASE_LBL_USERNAME="Benutzername"
DATABASE_LBL_USERNAME_HELP="Der Benutzername, den Sie zur Verbindung mit Ihrer Datenbank verwenden. Die meisten Hoster, die cPanel, Plesk und andere gängige Hosting-Panels verwenden, vergeben Benutzernamen wie abcdef_benutzername, wobei abcdef Ihr Benutzername im Hosting-Kontrollpanel ist. Falls Sie unsicher sind, fragen Sie bitte Ihren Hoster."
DATABASE_LBL_PASSWORD="Passwort"
DATABASE_LBL_PASSWORD_HELP="Das Passwort, das Sie zur Verbindung mit Ihrer Datenbank verwenden."
DATABASE_LBL_DBNAME="Datenbankname"
DATABASE_LBL_DBNAME_HELP="Der Name Ihrer Datenbank. Die meisten Hoster, die cPanel, Plesk und andere gängige Hosting-Panels verwenden, vergeben Datenbanknamen wie <code>abcdef_benutzername</code>, wobei <code>abcdef</code> Ihr Benutzername im Hosting-Kontrollpanel ist. Falls Sie unsicher sind, fragen Sie bitte Ihren Hoster."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Ungewöhnliche Optionen"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Die folgenden Optionen werden in weniger verbreiteten und exotischen MySQL-Konfigurationen verwendet."
DATABASE_LBL_PORT="Datenbankport"
DATABASE_LBL_PORT_HELP="<strong>Optional</strong>. Der TCP/IP-Port der Datenbank, falls er vom Standard (3306) abweicht. Dies gilt nicht, wenn Sie den Hostnamen <code>localhost</code> oder einen Socket verwenden. Wenn Sie nicht wissen, was das bedeutet, lassen Sie dieses Feld leer."
DATABASE_LBL_SOCKET="UNIX-Socket / Windows Named Pipe"
DATABASE_LBL_SOCKET_HELP="<strong>Optional</strong>. Wenn Sie eine Verbindung zu Ihrem Datenbankserver über einen UNIX-Socket (z. B. <code>unix:/tmp/mysql.sock</code>) oder eine Windows Named Pipe (z. B. <code>\\.\MySQL</code>) herstellen, geben Sie diesen hier ein. Wenn Sie nicht wissen, was das bedeutet, lassen Sie dieses Feld leer."
DATABASE_LBL_DBENCRYPTION="SSL/TLS verwenden"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Optional.</strong> Möchten Sie eine Verbindung zu MySQL über SSL/TLS herstellen? Dies kann verwendet werden, um die Datenbankverbindung zu verschlüsseln und sich optional ohne Passwort anzumelden. Sie müssen den Pfad des MySQL-Client-Schlüssels und der Zertifikatsdatei angeben. Dies ist eine sehr ungewöhnliche Option. Wenn Sie nicht wissen, was das ist, ignorieren Sie bitte diese und die nächsten Optionen."
DATABASE_LBL_DBSSLCIPHER="SSL-Verschlüsselungsverfahren"
DATABASE_LBL_DBSSLCIPHER_HELP="Wird nur verwendet, wenn SSL/TLS verwenden aktiviert ist. Eine durch Doppelpunkte getrennte Liste der Verschlüsselungsverfahren für die SSL/TLS-Verbindung, z. B. <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. Falls unsicher, lassen Sie dieses Feld leer."
DATABASE_LBL_DBSSLCERT="SSL-Zertifikatsdatei"
DATABASE_LBL_DBSSLCERT_HELP="Wird nur verwendet, wenn SSL/TLS verwenden aktiviert ist. Der absolute Dateisystempfad zur Client-Zertifikatsdatei im PEM-Format."
DATABASE_LBL_DBSSLKEY="SSL-Schlüsseldatei"
DATABASE_LBL_DBSSLKEY_HELP="Wird nur verwendet, wenn SSL/TLS verwenden aktiviert ist. Der absolute Dateisystempfad zur Client-Schlüsseldatei im PEM-Format."
DATABASE_LBL_DBSSLCA="SSL-CA-Datei"
DATABASE_LBL_DBSSLCA_HELP="Wird nur verwendet, wenn SSL/TLS verwenden aktiviert ist. Der absolute Dateisystempfad zur Zertifizierungsstellen-(CA-)Datei für die Verbindung zum Server im PEM-Format. Dies wird nur berücksichtigt, wenn „Serverzertifikat überprüfen" aktiviert ist."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Serverzertifikat überprüfen"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Wird nur verwendet, wenn SSL/TLS verwenden aktiviert ist. Überprüft die Serverantwort anhand der Zertifizierungsstellen-(CA-)Datei. Sie müssen die CA-Datei angeben, damit diese Option korrekt funktioniert. Wenn die Datenbankwiederherstellung wiederholt fehlschlägt, versuchen Sie, diese Option zu deaktivieren."

DATABASE_HEADER_ADVANCED="Erweiterte Optionen"
DATABASE_LBL_EXISTING="Vorhandene Tabellen"
DATABASE_LBL_EXISTING_HELP="Wählen Sie aus, was mit vorhandenen Tabellen geschehen soll. „Löschen" löscht vorhandene Tabellen mit denselben Namen wie die wiederherzustellenden Tabellen. „Sichern" benennt vorhandene Tabellen mit denselben Namen wie die wiederherzustellenden Tabellen um, indem ihr Präfix in bak_ geändert wird. „Gleichen Präfix löschen" löscht alle Tabellen mit demselben Präfix, auch wenn sie nicht im wiederherzustellenden Backup enthalten sind. „Alle löschen" löscht alle Tabellen, auch solche mit einem anderen Präfix. Die letzten beiden Optionen sind GEFÄHRLICH und sollten mit ÄUSSERSTER VORSICHT verwendet werden."
DATABASE_LBL_EXISTING_DROP="Löschen"
DATABASE_LBL_EXISTING_BACKUP="Sichern"
DATABASE_LBL_EXISTING_DROPPREFIX="Gleichen Präfix löschen"
DATABASE_LBL_EXISTING_DROPALL="Alle löschen"
DATABASE_LBL_PREFIX="Tabellenpräfix"
DATABASE_LBL_PREFIX_HELP="Das Präfix aller wiederhergestellten Datenbanktabellen, die zum Zeitpunkt des Backups ein Präfix hatten. Das für die Hauptdatenbank der Website verwendete Präfix wird auch in Ihre Joomla!-Datei configuration.php geschrieben. Bitte beachten Sie, dass einige Erweiterungen möglicherweise Fehlfunktionen aufweisen oder sogar Ihre Website komplett zum Absturz bringen können, wenn Sie das Präfix des Datenbanknamens beim Wiederherstellen/Transferieren Ihrer Website ändern."
DATABASE_LBL_FOREIGNKEY="Fremdschlüsselprüfungen unterdrücken"
DATABASE_LBL_FOREIGNKEY_HELP="Deaktiviert die Fremdschlüsselprüfung von MySQL während der Wiederherstellung. Dies ist zwingend erforderlich, wenn Sie eine Datenbank wiederherstellen, die Relationen auf Tabellenebene (Fremdschlüssel) verwendet. Falls Sie unsicher sind, lassen Sie diese Option aktiviert; sie schadet nicht."
DATABASE_LBL_NOAUTOVALUE="Kein Auto-Wert bei Null"
DATABASE_LBL_NOAUTOVALUE_HELP="Ermöglicht die Wiederherstellung von Tabellen mit automatisch inkrementierenden Feldern, deren Wert Null ist. Magento und Drupal erfordern dies für eine ordnungsgemäße Wiederherstellung. HINWEIS: Laut MySQL-Dokumentation: „Das Speichern von 0 ist keine empfohlene Praxis.""
DATABASE_LBL_REPLACE="REPLACE statt INSERT verwenden"
DATABASE_LBL_REPLACE_HELP="Das Wiederherstellungsskript verwendet normalerweise INSERT-Befehle, um die Datenbankdaten wiederherzustellen. Dies funktioniert bei Daten bestimmter Erweiterungen nicht gut und verursacht Wiederherstellungsprobleme. Wenn Sie Fehler bei der Datenbankwiederherstellung erhalten, aktivieren Sie dieses Kontrollkästchen und klicken Sie erneut auf die Schaltfläche „Weiter"."
DATABASE_LBL_FORCEUTF8DB="UTF-8-Kollation auf Datenbank erzwingen"
DATABASE_LBL_FORCEUTF8DB_HELP="Wenn aktiviert, versucht das Wiederherstellungsskript, die Standard-Kollation Ihrer Tabelle in Unicode (UTF-8) zu konvertieren, wie von Joomla! empfohlen. Dies funktioniert nicht auf allen Servern. Aktivieren Sie es, wenn Sie anstelle internationaler Zeichen Fragezeichen oder unlesbaren Text sehen."
DATABASE_LBL_FORCEUTF8TABLES="UTF-8-Kollation auf Tabellen erzwingen"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Wenn aktiviert, versucht das Wiederherstellungsskript, alle Textfelder der wiederhergestellten Tabellen in Unicode (UTF-8) zu konvertieren. Dies ist eine Problemumgehung, wenn Sie die obige Option nicht verwenden können. Bitte beachten Sie, dass Sie <em>zukünftig</em> Probleme haben werden, wenn Ihre Datenbank-Kollation nicht UTF-8 ist und eine Erweiterungsaktualisierung ein neues Textfeld hinzufügt."
DATABASE_LBL_UTF8MB4DETECT="UTF8MB4-Automatik-Erkennung zulassen"
DATABASE_LBL_UTF8MB4DETECT_HELP="Wenn aktiviert und Ihr Datenbankserver UTF8MB4 (UTF-8 Multibyte) unterstützt, wird es anstelle des normalen UTF-8 verwendet. WARNUNG: Verwenden Sie dies nur, wenn Ihre Website beim Erstellen des Backups UTF8MB4 verwendet hat. Deaktivieren Sie diese Option, wenn nach der Wiederherstellung Ihrer Website unlesbarer Text erscheint!"
DATABASE_LBL_CHARSET_CONVERSION="Zeichensatz normalisieren"
DATABASE_LBL_CHARSET_CONVERSION_YES="Aktiviert"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Automatisch erkennen (empfohlen)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Deaktiviert"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Steuert die Kollationsnormalisierung bei der Wiederherstellung auf unterschiedliche Datenbankplattformen oder Versionsfamilien (z. B. MariaDB zu MySQL). <strong>Automatisch erkennen</strong>: Die Zeichensatzkonvertierung wird automatisch angewendet, wenn das Wiederherstellungsskript feststellt, dass das Backup auf einer anderen Datenbankplattform oder Versionsfamilie als dem Zielserver erstellt wurde. <strong>Aktiviert</strong>: Kollationen immer normalisieren, unabhängig von der Plattform. <strong>Deaktiviert</strong>: Kollationen niemals normalisieren; verwenden Sie dies nur, wenn Sie sicher sind, dass Sie auf exakt dasselbe Datenbankserver-Fabrikat (MySQL vs. MariaDB) und dieselbe Versionsfamilie wiederherstellen."

DATABASE_HEADER_FINETUNING="Feinabstimmung"
DATABASE_MSG_FINETUNING="Ändern Sie diese Einstellungen nur, wenn Sie von unserem Support dazu aufgefordert werden oder wenn die Datenbankwiederherstellung scheinbar feststeckt. Das Setzen der Werte 5 und 2000 in den folgenden Feldern führt zu einer viel langsameren Wiederherstellung, schlägt aber auf preisgünstigem, unzuverlässigem Hosting weniger häufig fehl."
DATABASE_LBL_MAXEXECTIME="Maximale Ausführungszeit"
DATABASE_LBL_MAXEXECTIME_HELP="Das Wiederherstellungsskript unterteilt den Datenbankwiederherstellungsprozess in kleine Verarbeitungsabschnitte, um Server-Timeouts zu vermeiden. Dieser Wert bestimmt, wie lange jeder dieser Abschnitte dauert. Möglicherweise müssen Sie diesen Wert anpassen, wenn die Datenbankwiederherstellung nicht abgeschlossen wird. Der Standardwert beträgt 10 Sekunden."
DATABASE_LBL_THROTTLEMSEC="Drosselungszeit"
DATABASE_LBL_THROTTLEMSEC_HELP="Das Wiederherstellungsskript kann optional die Rate des Datenbankwiederherstellungsprozesses für stark fehlerhafte Server drosseln. Sie können die Drosselungszeit zwischen den Verarbeitungsabschnitten in Millisekunden (1/1000 Sekunde) eingeben. Um beispielsweise eine Drosselungszeit von 5 Sekunden zwischen den Schritten hinzuzufügen, geben Sie 5000 in dieses Feld ein. Der Standardwert von 250 sollte auf den meisten Servern funktionieren."

DATABASE_LBL_ON_CREATE_ERROR="Bei CREATE-Fehler anhalten"
DATABASE_LBL_ON_CREATE_ERROR_HELP="Soll die Wiederherstellung sofort angehalten werden, wenn beim Erstellen einer Tabelle, Ansicht, Funktion, eines Triggers oder einer gespeicherten Prozedur ein Fehler auftritt? Wenn nicht aktiviert, werden solche Fehler ignoriert und die Wiederherstellung wird mit möglichen Datenbeschädigungen und/oder Problemen auf der wiederhergestellten Website fortgesetzt."
DATABASE_LBL_ON_OTHER_ERROR="Bei sonstigem Fehler anhalten"
DATABASE_LBL_ON_OTHER_ERROR_HELP="Soll die Wiederherstellung sofort angehalten werden, wenn beim Ausführen eines anderen Datenbankbefehls, z. B. beim Wiederherstellen oder Löschen von Daten, ein Fehler auftritt? Wenn nicht aktiviert, werden solche Fehler ignoriert und die Wiederherstellung wird mit möglichen Datenbeschädigungen und/oder Problemen auf der wiederhergestellten Website fortgesetzt."

DATABASE_HEADER_DBRESTORE="Datenbankwiederherstellung"
DATABASE_LBL_RESTORATION_PROGRESS="Wiederherstellungsfortschritt"
DATABASE_LBL_RESTORED="Wiederhergestellt"
DATABASE_LBL_TOTAL="Gesamtgröße"
DATABASE_LBL_ETA="Geschätzte Restzeit"

DATABASE_HEADER_SUCCESS="Die Datenbankwiederherstellung war erfolgreich"
DATABASE_HEADER_WARNINGS="Die Datenbankwiederherstellung wurde abgeschlossen, aber einige Abfragen konnten nicht ausgeführt werden"
DATABASE_MSG_WARNINGS="Ihre wiederhergestellte Website funktioniert möglicherweise nicht ordnungsgemäß, bis Sie diese Probleme manuell beheben. Bitte überprüfen Sie die fehlgeschlagenen Abfragen und den Grund für ihr Fehlschlagen in der Protokolldatei:"
DATABASE_MSG_SUCCESS="Klicken Sie auf die Schaltfläche unten, um zum nächsten Schritt zu gelangen"
DATABASE_BTN_SUCCESS="Nächster Schritt"

DATABASE_HEADER_INPROGRESS_WARNINGS="Einige Abfragen sind fehlgeschlagen"
DATABASE_MSG_INPROGRESS_WARNINGS="Einige SQL-Abfragen konnten nicht ausgeführt werden, aber Sie haben sich entschieden, diese zu ignorieren. Sie können diese und den Grund für ihr Fehlschlagen nach Abschluss der Wiederherstellung in der folgenden Protokolldatei überprüfen:"

DATABASE_HEADER_ERROR="Beim Wiederherstellen der Datenbank ist ein Fehler aufgetreten. Die Fehlermeldung finden Sie unten. Klicken Sie auf die Schaltfläche &times; oben rechts in diesem Dialogfeld, um es zu schließen und zur Seite der Datenbankwiederherstellung zurückzukehren."
DATABASE_ERR_INVALIDKEY="Ungültiger Datenbankschlüssel"

DATABASE_ERR_COMPLEXPASSWORD="!!! WARNUNG !!!\n\nIhr Datenbankpasswort enthält Sonderzeichen. Viele Webserver lehnen diese Passwörter ab oder verändern sie, was dazu führt, dass die Datenbankwiederherstellung mit einem Datenbankverbindungsfehler fehlschlägt.\n\nWir empfehlen DRINGEND, dass Sie Ihr Datenbankpasswort in eine lange (32 Zeichen oder länger) zufällige Zeichenfolge ändern, die NUR aus Großbuchstaben A-Z, Kleinbuchstaben a-z und Ziffern 0-9 besteht.\n\nMöchten Sie die Warnung ignorieren und die Datenbankwiederherstellung auf eigenes Risiko fortsetzen?"
DATABASE_ERR_UPPERCASEPREFIX="!!! WARNUNG !!!\n\nIhr Tabellenpräfix enthält einen oder mehrere Großbuchstaben. Dies kann auf der wiederhergestellten Website zu schwerwiegenden Problemen führen und/oder es unmöglich machen, Ihre Website auf einem anderen Server wiederherzustellen. Dies liegt an der Art und Weise, wie MySQL Großbuchstaben behandelt, und kann laut MySQL-Dokumentation nicht effektiv umgangen werden.\n\nWir empfehlen DRINGEND, einen ausschließlich aus Kleinbuchstaben bestehenden Tabellenpräfix zu verwenden.\n\nMöchten Sie die Warnung ignorieren und die Datenbankwiederherstellung auf eigenes Risiko fortsetzen?"
DATABASE_ERR_EMPTY_INFO="!!! WARNUNG !!!\n\nSie haben nicht alle erforderlichen Felder ausgefüllt (Datenbankserver-Hostname, Datenbankname, Datenbankbenutzername, Datenbankpasswort und Tabellenpräfix). Dies wird höchstwahrscheinlich zu einem Fehler beim Versuch führen, eine Verbindung zur Datenbank herzustellen und/oder auf der wiederhergestellten Website.\n\nSind Sie ABSOLUT SICHER, dass Sie das wirklich so beabsichtigen?"

DATABASE_HEADER_RESTORERETRY="Wiederherstellung angehalten und wird automatisch fortgesetzt"
DATABASE_LBL_RESTOREFAILEDRETRY="Die Datenbankwiederherstellung wurde angehalten, weil ein Fehler erkannt wurde. Das Wiederherstellungsskript wird jedoch versuchen, den Prozess fortzusetzen. Wenn Sie die Wiederherstellung nicht fortsetzen möchten, klicken Sie bitte auf die Schaltfläche „Abbrechen" unten."
DATABASE_LBL_WILLRETRY="Wiederherstellung wird fortgesetzt in"
DATABASE_LBL_WILLRETRYSECONDS="Sekunden"
DATABASE_LBL_CANCEL="Abbrechen"
DATABASE_LBL_BTNRESUME="Fortsetzen"
DATABASE_LBL_LASTERRORMESSAGEWAS="Zur Information: Die letzte Fehlermeldung lautete:"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="Der erhaltene Fehler war:"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="So beheben Sie diesen Fehler"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Debug-Informationen"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Anzeigen / Ausblenden"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Bitte fügen Sie diese Informationen in Ihre Support-Anfrage ein, wenn Sie weitere Hilfe benötigen. Teilen Sie uns mit, welche Fehlerbehebungsschritte Sie bereits versucht haben."

DATABASE_RESTORE_DBNAME_HEAD="Falscher Datenbankname oder kein Datenbankzugriff"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="Der Datenbankserver meldet, dass Hostname, Benutzername und Passwort des Datenbankservers korrekt sind, er aber keine Verbindung zur angegebenen Datenbank in der Option „Datenbankname" herstellen kann. Das bedeutet, dass die Datenbank entweder nicht existiert <em>oder</em> Sie Ihrem Datenbankbenutzer keinen Zugriff auf diese Datenbank gewährt haben."
DATABASE_RESTORE_DBUSER_HEAD="Falsche Datenbankverbindungsinformationen"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="Wir konnten keine Verbindung zu Ihrem Datenbankserver mit dem angegebenen Hostnamen, Benutzernamen und Passwort herstellen."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Überprüfen Sie den Hostnamen Ihres Datenbankservers. Denken Sie daran, dass <code>localhost</code> und <code>127.0.0.1</code> unterschiedliche Bedeutungen haben, wenn Sie eine Verbindung zu einer Datenbank herstellen."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Überprüfen Sie Ihren Datenbanknamen und Ihren Datenbankbenutzernamen. Die meisten Hoster stellen dem Datenbanknamen Ihren Hosting-Kontonamen als Präfix voran. Falls Sie unsicher sind, fragen Sie Ihren Hoster."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Überprüfen Sie Ihr Passwort. Groß- und Kleinschreibung ist wichtig: ABC, abc und Abc sind drei <em>verschiedene</em> Passwörter."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Wenn Sie Ihre Website kopieren oder verschieben, stellen Sie sicher, dass Sie die Datenbankverbindungsinformationen für die neue Website eingeben."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Wenn Sie noch keine Datenbank haben, müssen Sie eine erstellen. Die meisten Hoster erlauben es diesem Wiederherstellungsskript aus Sicherheitsgründen nicht, eine neue Datenbank zu erstellen."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Wenn Sie eine neue Datenbank erstellt haben, stellen Sie sicher, dass Sie auch einen Datenbankbenutzer erstellt <strong>und</strong> diesen der Datenbank zugewiesen haben, indem Sie ihm alle Rechte an der Datenbank gewähren."

; ==============================================================================
; Site setup
; ==============================================================================
SETUP_HEADER_SITEPARAMS="Website-Parameter"
SETUP_HEADER_SITEPARAMS_HELP="Dies sind die grundlegenden Parameter Ihrer Website. Sie können diese nach Abschluss der Wiederherstellung jederzeit über das Backend Ihrer Website unter „Globale Konfiguration" ändern."
SETUP_LBL_SITENAME="Website-Name"
SETUP_LBL_SITENAME_HELP="Der Name Ihrer Website, der u. a. in den HTML-Seiten der Website verwendet wird."
SETUP_LBL_SITEEMAIL="E-Mail-Adresse der Website"
SETUP_LBL_SITEEMAIL_HELP="Die E-Mail-Adresse, von der die E-Mails Ihrer Website zu stammen scheinen."
SETUP_LBL_EMAILSENDER="Absendername der Website-E-Mails"
SETUP_LBL_EMAILSENDER_HELP="Der Name des Absenders, der für alle von Ihrer Website gesendeten E-Mails verwendet wird."
SETUP_LBL_LIVESITE="URL der Live-Website"
SETUP_LBL_LIVESITE_HELP="Einige Server haben Schwierigkeiten, die URL Ihrer Website zu ermitteln, was dazu führen kann, dass SEF-URLs und Menüeinträge nicht funktionieren. Auf diesen Servern müssen Sie die URL Ihrer Website ohne abschließenden Schrägstrich eingeben, z. B. <code>http://www.example.com</code>. In den meisten Fällen ist dies nicht erforderlich und Sie können dieses Feld leer lassen."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="WARNUNG! Ihr Webserver läuft unter Windows. Das Ausfüllen der URL der Live-Website bei einem Betrieb unter Windows macht es aufgrund eines Fehlers in Joomla! unmöglich, sich im Administrator-Bereich Ihrer Website anzumelden. Bitte lassen Sie dieses Feld leer."
SETUP_LBL_USESITEDIRS="Tmp- und Log-Pfade überschreiben"
SETUP_LBL_USESITEDIRS_HELP="Das Wiederherstellungsskript verwendet standardmäßig die in der Globalen Konfiguration der gesicherten Website bereits eingerichteten tmp- und log-Pfade. Wenn Sie auf einem anderen Server wiederherstellen oder Ihre Website klonen, kann dies zu Problemen führen. Klicken Sie in diesem Fall oder wenn Sie unsicher sind auf die Schaltfläche — das Wiederherstellungsskript wird dann die Pfade für das temporäre Verzeichnis und das Log-Verzeichnis mit sinnvollen Werten für die wiederherzustellende Website befüllen. Sie können diese Pfade im Abschnitt „Verzeichnisse feinabstimmen" unten ändern."
SETUP_LBL_USESITEDIRS_51="Tmp-, Log- und Cache-Pfade überschreiben"
SETUP_LBL_USESITEDIRS_HELP_51="Das Wiederherstellungsskript verwendet standardmäßig die in der Globalen Konfiguration der gesicherten Website bereits eingerichteten tmp-, log- und cache-Pfade. Wenn Sie auf einem anderen Server wiederherstellen oder Ihre Website klonen, kann dies zu Problemen führen. Klicken Sie in diesem Fall oder wenn Sie unsicher sind auf die Schaltfläche — das Wiederherstellungsskript wird dann die Pfade für das temporäre Verzeichnis und das Log-Verzeichnis mit sinnvollen Werten für die wiederherzustellende Website befüllen und das Cache-Verzeichnis auf eine leere Zeichenfolge zurücksetzen (was Joomla! anweist, den Ordner <code>administrator/cache</code> zu verwenden). Sie können diese Pfade im Abschnitt „Verzeichnisse feinabstimmen" unten ändern."
SETUP_LBL_COOKIEDOMAIN="Cookie-Domain"
SETUP_LBL_COOKIEDOMAIN_HELP="Die Cookie-Domain ist der Domainname Ihrer Website, ohne das Protokoll und in der Regel ohne den www-Teil. Wenn Sie beispielsweise auf http://www.example.com wiederherstellen, ist die Cookie-Domain example.com (nochmals zur Betonung: KEIN http:// darin!!)."
SETUP_LBL_COOKIEPATH="Cookie-Pfad"
SETUP_LBL_COOKIEPATH_HELP="Der Cookie-Pfad ist das Unterverzeichnis Ihrer Website, relativ zum Stammverzeichnis der Domain. Wenn Sie im Stammverzeichnis einer Domain wiederherstellen, z. B. http://www.example.com, dann ist es / (ein einzelner Schrägstrich). Wenn Sie in einem Unterverzeichnis wiederherstellen, ist es ein Schrägstrich gefolgt vom Verzeichnisnamen. Wenn Sie beispielsweise auf http://www.example.com/joomla wiederherstellen, ist der Cookie-Pfad /joomla (MIT führendem Schrägstrich, aber OHNE abschließenden Schrägstrich)."

SETUP_HEADER_FTPPARAMS="FTP-Schicht-Optionen"
SETUP_HEADER_FTPPARAMS_HELP="Dies sind optionale Einstellungen, die es Joomla! ermöglichen, FTP zum Schreiben in anderweitig nicht beschreibbare Dateien und Verzeichnisse zu verwenden. Dies ist in der Regel nur bei Shared-Hosting erforderlich. Weitere Informationen finden Sie im Hilfetext der Optionen."
SETUP_LABEL_FTPENABLE="FTP-Schicht aktivieren"
SETUP_LABEL_FTPENABLE_HELP="Bei manchen Shared-Hostern ist es PHP unmöglich, in per FTP hochgeladene Dateien und Verzeichnisse zu schreiben. Wenn Sie einen solchen Hoster nutzen und FTP oder die FTP-Upload-Extraktionsoption von Kickstart verwendet haben, sollten Sie die FTP-Schicht konfigurieren und aktivieren."
SETUP_LABEL_FTPHOST="Hostname"
SETUP_LABEL_FTPHOST_HELP="Der Hostname oder die IP-Adresse Ihres FTP-Servers <b>ohne</b> den Protokoll-Präfix ftp://. Es ist normalerweise localhost oder 127.0.0.1. Falls Sie unsicher sind, fragen Sie Ihren Hoster."
SETUP_LABEL_FTPPORT="Port"
SETUP_LABEL_FTPPORT_HELP="Der TCP-Port, auf dem der FTP-Server hört. Dies ist normalerweise 21. Falls Sie unsicher sind, setzen Sie ihn auf 21 oder fragen Sie Ihren Hoster."
SETUP_LABEL_FTPUSER="Benutzername"
SETUP_LABEL_FTPUSER_HELP="Der Benutzername, den Sie für die FTP-Verbindung verwenden. Falls Sie unsicher sind, fragen Sie Ihren Hoster."
SETUP_LABEL_FTPPASS="Passwort"
SETUP_LABEL_FTPPASS_HELP="Das Passwort, das Sie für die FTP-Verbindung verwenden. Falls Sie unsicher sind, fragen Sie Ihren Hoster."
SETUP_LABEL_FTPDIR="Verzeichnis"
SETUP_LABEL_FTPDIR_HELP="Das FTP-Verzeichnis, in dem die Dateien Ihrer Website (wie index.php) zu finden sind. Falls Sie unsicher sind, fragen Sie Ihren Hoster."

SETUP_HEADER_SUPERUSERPARAMS="Super-User-Einstellungen"
SETUP_HEADER_SUPERUSERPARAMS_HELP="Das Wiederherstellungsskript stellt Ihre Website mit dem Super User wieder her, der auf der ursprünglichen Website gesichert wurde. Sie können auf dieser Seite optional einen (und nur einen) Super User auswählen und dessen E-Mail-Adresse und Passwort ändern. Dies ist äußerst nützlich, wenn Sie eine Website klonen."
SETUP_LABEL_SUPERUSER="Super User"
SETUP_LABEL_SUPERUSER_HELP="Sie können optional ein Super-User-Konto auswählen, dessen E-Mail und/oder Passwort auf der wiederhergestellten Website geändert werden. <b>Nur der ausgewählte Super User wird geändert.</b> Wenn Sie das nicht möchten, lassen Sie die Standardauswahl „—" bestehen, die kein Benutzerkonto ändert."
SETUP_LABEL_SUPERADMIN="Administrator"
SETUP_LABEL_SUPERUSEREMAIL="E-Mail"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Geben Sie die E-Mail-Adresse des Super Users ein. Stellen Sie sicher, dass sie nicht bereits von einem anderen Benutzer auf der Website verwendet wird, da Ihre wiederhergestellte Website sonst beschädigt wird!"
SETUP_LABEL_SUPERUSERPASSWORD="Passwort"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Geben Sie das neue Passwort ein, das dem Super User zugewiesen werden soll. Wenn Sie das Passwort des Super Users nicht ändern möchten, lassen Sie dieses und die folgenden Felder leer."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Geben Sie das neue Passwort ein, das dem Super User zugewiesen werden soll."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Passwort (Wiederholung)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Wiederholen Sie das Passwort. So können wir sicherstellen, dass Sie oben keinen Tippfehler gemacht haben."

SETUP_HEADER_FINETUNING="Verzeichnisse feinabstimmen"
SETUP_HEADER_FINETUNING_HELP="Joomla! benötigt zwei beschreibbare Verzeichnisse für temporäre Dateien und Logs. Sie können diese hier festlegen. Tipp: Wenn sie nicht beschreibbar sind, Sie aber oben bereits die FTP-Schicht aktiviert haben, versucht das Wiederherstellungsskript, sie automatisch beschreibbar zu machen und zu sichern."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Neues Secret generieren"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Aktivieren Sie dies, wenn Sie Ihre Website zwischen Servern und/oder Domains verschieben. Es generiert neue Secrets in der Konfigurationsdatei Ihrer Website, um die Wiederverwendung von Sitzungen von der alten Website zu verhindern. Beachten Sie, dass Drittanbieter-Software, die die Secrets der Website zur Verschlüsselung von Informationen verwendet, möglicherweise nicht auf ihre Daten zugreifen kann, wenn Sie das tun."
SETUP_LABEL_SITEROOT="Website-Stammverzeichnis"
SETUP_LABEL_SITEROOT_HELP="Dies ist der Pfad zum Stammverzeichnis Ihrer Website. Er wird zu Ihrer Information angezeigt. Dreifachklick (oder langes Tippen) darauf, um ihn auszuwählen; dann können Sie ihn kopieren und in den folgenden Feldern verwenden."
SETUP_LABEL_TMPPATH="Temporäres Verzeichnis"
SETUP_LABEL_TMPPATH_HELP="Das Verzeichnis, in dem Joomla! temporäre Daten speichert. Wir empfehlen, es außerhalb des Stammverzeichnisses Ihrer Website zu platzieren. Standard: das Verzeichnis <code>tmp</code> unter dem Stammverzeichnis Ihrer Website."
SETUP_LABEL_LOGSPATH="Log-Verzeichnis"
SETUP_LABEL_LOGSPATH_HELP="Das Verzeichnis, in dem Joomla! seine Log-Dateien speichert. Wir empfehlen, es außerhalb des Stammverzeichnisses Ihrer Website zu platzieren. Standard: das Verzeichnis <code>log</code> unter dem Stammverzeichnis Ihrer Website."
SETUP_LBL_CACHE_PATH="Cache-Verzeichnis"
SETUP_LBL_CACHE_PATH_HELP="Das Verzeichnis, in dem Joomla! seine temporären Cache-Dateien speichert. Wir empfehlen, es außerhalb des Stammverzeichnisses Ihrer Website zu platzieren. Wenn Sie dieses Feld leer lassen, wird das Verzeichnis <code>administrator/cache</code> unter dem Stammverzeichnis Ihrer Website verwendet (Standardwert und empfohlener Wert). HINWEIS: Joomla! wird für seine Datei <code>autoload_psr4.php</code> immer <code>administrator/cache</code> verwenden, es sei denn, die Konstante <code>JPATH_CACHE</code> wird überschrieben."

SETUP_ERR_PASSWORDSDONTMATCH="Die Passwörter des Super Users stimmen nicht überein"
SETUP_ERR_EMAILEMPTY="Die E-Mail-Adresse des Super Users ist leer"

