OFFSITEDIRS_HEADER_MASTER="Restauration de <code>%s</code>"
OFFSITEDIRS_LBL_EXPLANATION="<p>Lorsque vous avez sauvegardé votre site, certains fichiers se trouvaient en dehors de la racine de votre site (son dossier principal en cours de sauvegarde). Les fichiers en question se trouvaient dans le dossier <code>%s</code>.</p><p>Ces fichiers sont actuellement extraits dans <code>%s</code>, ce qui n'est <em>pas</em> l'emplacement où ils doivent se trouver pour que votre site fonctionne. Il s'agit simplement d'un emplacement temporaire nécessité par le fait que l'extraction d'une archive ne peut pas créer des fichiers <em>au-dessus</em> du dossier vers lequel vous l'extrayez. Vous devez donc déplacer ces fichiers pour que votre site fonctionne.</p><p>Vous pouvez indiquer ci-dessous le chemin absolu vers l'emplacement absolu dans le système de fichiers où ils doivent être copiés. Pour information, votre site est actuellement extrait vers l'emplacement absolu <code>%s</code> dans le système de fichiers.</p>"
