DATABASE_NOCONNECTORS_LBL_NOAI="Nous déconseillons <em>vivement</em> d'utiliser des assistants « IA » (par ex. ChatGPT, Copilot, etc.) pour résoudre ce problème. Vous risquez de recevoir des instructions obsolètes, incorrectes ou dangereuses qui pourraient aggraver votre problème."
DATABASE_NOCONNECTORS_LBL_PHP_PER_VERSION_CONFIG="Veuillez noter que <em>chaque version de PHP possède sa propre configuration</em> ; assurez-vous d'activer les extensions sur la bonne version de PHP."
DATABASE_NOCONNECTORS_LBL_FAQ="Questions fréquemment posées"
DATABASE_NOCONNECTORS_LBL_STEP_HEAD="Pouvez-vous fournir des instructions étape par étape ?"
DATABASE_NOCONNECTORS_LBL_STEP_NO="De façon générale, non, nous ne le pouvons pas."
DATABASE_NOCONNECTORS_LBL_STEP_SPECIFIC="Les instructions sont spécifiques à chaque environnement d'hébergement. Il est généralement plus rapide et plus précis de demander aux personnes qui ont conçu et maintiennent l'environnement d'hébergement de vous fournir des instructions spécifiques."
DATABASE_NOCONNECTORS_LBL_INERROR_HEAD="Puis-je recevoir ce message par erreur ?"
DATABASE_NOCONNECTORS_LBL_INERROR_NO="Non, il vous est impossible de recevoir ce message par erreur."
DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Ce message apparaît lorsque PHP signale qu'aucune des fonctions de connexion à la base de données pour les serveurs de base de données compatibles MySQL n'est disponible."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Veuillez noter que votre serveur peut indiquer que les extensions sont installées pour une version de PHP différente ou une installation PHP différente, comme l'installation PHP séparée utilisée par le panneau de contrôle d'hébergement. Il ne s'agit pas de la même installation PHP et/ou de la même version que celle que vous utilisez pour restaurer votre site."
DATABASE_NOCONNECTORS_LBL_USEOTHER_HEAD="Puis-je utiliser une technologie de base de données différente, par ex. PostgreSQL ?"
DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="Non, vous ne le pouvez pas."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Les différentes technologies de bases de données utilisent des structures de bases de données, des formats de données, des pilotes de bases de données incompatibles, et nécessitent du code SQL et PHP rédigé différemment. Vous ne pouvez pas utiliser une base de données non-MySQL avec des données provenant d'un logiciel écrit pour une base de données compatible MySQL."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="Cela fonctionnera-t-il si je réinstalle mon site ?"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="Non, cela ne fonctionnera pas."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="Votre CMS doit également se connecter à la base de données. La seule façon de le faire est d'utiliser les mêmes extensions PHP. Vous vous retrouverez donc avec le même problème."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="Il <em>est possible</em> que votre CMS vous permette d'utiliser une technologie de base de données différente lors de l'installation d'un nouveau site, par ex. PostgreSQL. Cependant, tous les logiciels que vous utilisiez précédemment sur votre site ne seront pas nécessairement compatibles avec celle-ci. Cela rendra impossible la réimplémentation de votre site."

