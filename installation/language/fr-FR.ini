FINALISE_LBL_CONFIGOUTRO="N'oubliez pas de téléverser ce fichier sous le nom <code>%s</code> dans la racine de votre site. La racine de votre site s'appelle généralement public_html, www, httpdocs, htdocs ou quelque chose de similaire. Si vous n'êtes pas sûr de quel est le répertoire racine de votre site, veuillez contacter votre hébergeur."
