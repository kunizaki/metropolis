FINALISE_HEADER_SUCCESS="Prêt à commencer à utiliser votre site !"
FINALISE_LBL_SUCCESS="Le répertoire <code>installation</code> a été supprimé et votre site est prêt à être utilisé. Veuillez noter que, comme nous l'avons mentionné précédemment, en raison des différences de configuration du serveur, vous pourriez rencontrer quelques problèmes avec votre site. Si cela se produit, veuillez consulter l'URL suivante :<br/><span class='label label-info'><code>%s</code></span><br/>Conseil : Ajoutez cette URL à vos favoris pour référence future.<br/>Cliquez maintenant sur le bouton ci-dessous pour visiter la partie publique de votre site."
