DATABASE_HEADER_CONNECTION="Informations de connexion"
DATABASE_LBL_TYPE="Type de base de données"
DATABASE_LBL_TYPE_HELP="Il s'agit généralement de MySQLi (<em>avec</em> le « i » final)"
DATABASE_LBL_HOSTNAME="Nom d'hôte du serveur de base de données"
DATABASE_LBL_HOSTNAME_HELP="Le nom d'hôte ou l'adresse IP du serveur de base de données (généralement : localhost). <strong>IMPORTANT !</strong> <code>localhost</code> et <code>127.0.0.1</code> désignent deux choses différentes, voir ci-dessous. Exemples de connexion :<ul><li><code>localhost</code></li> Se connecter à localhost via le socket UNIX par défaut (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Se connecter à localhost via TCP/IP en utilisant le port par défaut (3306).<li><code>127.0.0.1:1234</code></li> Se connecter à localhost via TCP/IP en utilisant le port 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Se connecter à l'hôte IPv6 à l'adresse 2607:f0d0:1002:51::4 via TCP/IP en utilisant le port 1234. Remarque : toutes les adresses IPv6 DOIVENT être encadrées par des crochets !</li><li><code>mysql.example.com:1234</code></li> Se connecter à mysql.example.com via TCP/IP en utilisant le port 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Se connecter via le socket UNIX dans /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Se connecter via le canal nommé Windows « MySQL » (fonctionne évidemment uniquement sur les serveurs Windows).</ul>"
DATABASE_LBL_USERNAME="Nom d'utilisateur"
DATABASE_LBL_USERNAME_HELP="Le nom d'utilisateur que vous utilisez pour vous connecter à votre base de données. La plupart des hébergeurs utilisant cPanel, Plesk et d'autres panneaux d'hébergement majeurs donnent des noms d'utilisateur de type abcdef_username, où abcdef est votre nom d'utilisateur du panneau de contrôle d'hébergement. En cas de doute, veuillez contacter votre hébergeur."
DATABASE_LBL_PASSWORD="Mot de passe"
DATABASE_LBL_PASSWORD_HELP="Le mot de passe que vous utilisez pour vous connecter à votre base de données."
DATABASE_LBL_DBNAME="Nom de la base de données"
DATABASE_LBL_DBNAME_HELP="Le nom de votre base de données. La plupart des hébergeurs utilisant cPanel, Plesk et d'autres panneaux d'hébergement majeurs donnent des noms de base de données de type <code>abcdef_username</code>, où <code>abcdef</code> est votre nom d'utilisateur du panneau de contrôle d'hébergement. En cas de doute, veuillez contacter votre hébergeur."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Options peu courantes"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Les options suivantes sont utilisées dans des configurations MySQL moins courantes et atypiques."
DATABASE_LBL_PORT="Port de la base de données"
DATABASE_LBL_PORT_HELP="<strong>Facultatif</strong>. Le port TCP/IP de la base de données, s'il est différent du port par défaut (3306). Cela ne s'applique pas si vous utilisez le nom d'hôte <code>localhost</code> ou un socket. Si vous ne savez pas ce que cela signifie, laissez ce champ vide."
DATABASE_LBL_SOCKET="Socket UNIX / Canal nommé Windows"
DATABASE_LBL_SOCKET_HELP="<strong>Facultatif</strong>. Si vous vous connectez à votre serveur de base de données via un socket UNIX (par ex. <code>unix:/tmp/mysql.sock</code>) ou un canal nommé Windows (par ex. <code>\\.\MySQL</code>), veuillez l'indiquer ici. Si vous ne savez pas ce que cela signifie, laissez ce champ vide."
DATABASE_LBL_DBENCRYPTION="Utiliser SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Facultatif.</strong> Voulez-vous vous connecter à MySQL via SSL/TLS ? Cela peut être utilisé pour chiffrer la connexion à la base de données et éventuellement pour vous y connecter sans mot de passe. Vous devrez fournir le chemin du fichier de clé et de certificat client MySQL. Il s'agit d'une option très peu courante. Si vous ne savez pas ce que c'est, veuillez ignorer cette option et les quelques suivantes."
DATABASE_LBL_DBSSLCIPHER="Chiffrements SSL"
DATABASE_LBL_DBSSLCIPHER_HELP="Utilisé uniquement lorsque Utiliser SSL/TLS est activé. Une liste de chiffrements de chiffrement à utiliser pour la connexion SSL/TLS, séparés par des deux-points, par ex. <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. En cas de doute, laissez ce champ vide."
DATABASE_LBL_DBSSLCERT="Fichier de certificat SSL"
DATABASE_LBL_DBSSLCERT_HELP="Utilisé uniquement lorsque Utiliser SSL/TLS est activé. Le chemin absolu dans le système de fichiers vers le fichier de certificat client au format PEM."
DATABASE_LBL_DBSSLKEY="Fichier de clé SSL"
DATABASE_LBL_DBSSLKEY_HELP="Utilisé uniquement lorsque Utiliser SSL/TLS est activé. Le chemin absolu dans le système de fichiers vers le fichier de clé client au format PEM."
DATABASE_LBL_DBSSLCA="Fichier CA SSL"
DATABASE_LBL_DBSSLCA_HELP="Utilisé uniquement lorsque Utiliser SSL/TLS est activé. Le chemin absolu dans le système de fichiers vers le fichier de l'autorité de certification (AC) pour la connexion au serveur, au format PEM. Cela est uniquement pris en compte lorsque Vérifier le certificat du serveur est activé."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Vérifier le certificat du serveur"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Utilisé uniquement lorsque Utiliser SSL/TLS est activé. Vérifie la réponse du serveur par rapport au fichier de l'autorité de certification (AC). Vous devez fournir le fichier AC pour que cette option fonctionne correctement. Si votre restauration de base de données échoue systématiquement, essayez de désactiver cette option."

DATABASE_HEADER_ADVANCED="Options avancées"
DATABASE_LBL_EXISTING="Avec les tables existantes"
DATABASE_LBL_EXISTING_HELP="Sélectionnez ce qu'il faut faire avec les tables existantes. « Supprimer » supprimera les tables existantes portant les mêmes noms que les tables en cours de restauration. « Sauvegarder » renommera les tables existantes portant les mêmes noms que les tables en cours de restauration, en changeant leur préfixe en bak_. « Supprimer même préfixe » supprimera toutes les tables ayant le même préfixe, même si elles ne sont pas incluses dans la sauvegarde en cours de restauration. « Tout supprimer » supprimera toutes les tables, même avec un préfixe différent. Ces deux dernières options sont DANGEREUSES et doivent être utilisées avec une EXTRÊME PRUDENCE."
DATABASE_LBL_EXISTING_DROP="Supprimer"
DATABASE_LBL_EXISTING_BACKUP="Sauvegarder"
DATABASE_LBL_EXISTING_DROPPREFIX="Supprimer même préfixe"
DATABASE_LBL_EXISTING_DROPALL="Tout supprimer"
DATABASE_LBL_PREFIX="Préfixe des noms de tables"
DATABASE_LBL_PREFIX_HELP="Le préfixe de toutes les tables de base de données restaurées qui avaient un préfixe au moment de la sauvegarde. Le préfixe utilisé pour la base de données principale du site sera également écrit dans votre fichier Joomla! configuration.php. Veuillez noter que certaines extensions peuvent mal fonctionner ou même complètement planter votre site si vous modifiez le préfixe des noms de tables lors de la restauration/transfert de votre site."
DATABASE_LBL_FOREIGNKEY="Désactiver les vérifications de clés étrangères"
DATABASE_LBL_FOREIGNKEY_HELP="Désactive la vérification des clés étrangères de MySQL pendant la restauration. Cela est obligatoire lorsque vous restaurez une base de données qui utilise des relations au niveau des tables (clés étrangères). En cas de doute, laissez cette option cochée ; cela ne causera aucun problème."
DATABASE_LBL_NOAUTOVALUE="Pas de valeur automatique à zéro"
DATABASE_LBL_NOAUTOVALUE_HELP="Vous permet de restaurer des tables avec des champs à auto-incrémentation dont la valeur est zéro. Magento et Drupal l'exigent pour une restauration correcte. REMARQUE : Selon la documentation de MySQL : « Le stockage de 0 n'est pas une pratique recommandée »."
DATABASE_LBL_REPLACE="Utiliser REPLACE au lieu de INSERT"
DATABASE_LBL_REPLACE_HELP="Le script de restauration utilise normalement des commandes INSERT pour restaurer les données de la base de données. Cela ne fonctionne pas bien avec les données de certaines extensions, causant des problèmes de restauration. Si vous obtenez des erreurs de restauration de base de données, cochez cette case et cliquez à nouveau sur le bouton Suivant."
DATABASE_LBL_FORCEUTF8DB="Forcer l'interclassement UTF-8 sur la base de données"
DATABASE_LBL_FORCEUTF8DB_HELP="Lorsque cette option est cochée, le script de restauration tentera de convertir l'interclassement par défaut de votre table en Unicode (UTF-8), comme le suggère Joomla!. Cela ne fonctionne pas sur tous les serveurs. Cochez cette option si vous obtenez des points d'interrogation ou du texte corrompu à la place des caractères internationaux."
DATABASE_LBL_FORCEUTF8TABLES="Forcer l'interclassement UTF-8 sur les tables"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Lorsque cette option est cochée, le script de restauration tentera de convertir tous les champs texte des tables restaurées en Unicode (UTF-8). Il s'agit d'une solution de contournement lorsque vous ne pouvez pas utiliser l'option ci-dessus. Veuillez noter que si l'interclassement de votre base de données est autre chose qu'UTF-8, vous <em>aurez</em> des problèmes à l'avenir, après qu'une mise à jour d'extension ajoute un nouveau champ texte."
DATABASE_LBL_UTF8MB4DETECT="Autoriser la détection automatique d'UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Si cette option est activée et que votre serveur de base de données prend en charge UTF8MB4 (UTF-8 multioctet), il sera utilisé à la place du simple UTF-8. AVERTISSEMENT : à utiliser uniquement si votre site utilisait UTF8MB4 au moment de la sauvegarde. Décochez cette option si vous obtenez du texte corrompu après la restauration de votre site !"
DATABASE_LBL_CHARSET_CONVERSION="Normaliser le jeu de caractères"
DATABASE_LBL_CHARSET_CONVERSION_YES="Activé"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Détection automatique (recommandée)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Désactivé"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Contrôle la normalisation de l'interclassement lors de la restauration entre différentes plateformes de base de données ou familles de versions (par ex. MariaDB vers MySQL). <strong>Détection automatique</strong> : la conversion du jeu de caractères est appliquée automatiquement lorsque le script de restauration détermine que la sauvegarde a été créée sur une plateforme de base de données ou une famille de versions différente de celle du serveur cible. <strong>Activé</strong> : normaliser toujours les interclassements quelle que soit la plateforme. <strong>Désactivé</strong> : ne jamais normaliser les interclassements ; à utiliser uniquement si vous êtes certain de restaurer vers exactement le même type de serveur de base de données (MySQL vs MariaDB) et la même famille de versions."

DATABASE_HEADER_FINETUNING="Réglage fin"
DATABASE_MSG_FINETUNING="Ne modifiez ces paramètres que si notre support vous le demande, ou si la restauration de la base de données semble bloquée. Définir les valeurs 5 et 2000 dans les champs ci-dessous entraînera une restauration beaucoup plus lente, mais moins susceptible d'échouer sur un hébergement bon marché et peu fiable."
DATABASE_LBL_MAXEXECTIME="Durée maximale d'exécution"
DATABASE_LBL_MAXEXECTIME_HELP="Le script de restauration divise le processus de restauration de la base de données en petits blocs de traitement pour éviter les délais d'attente du serveur. Cette valeur détermine la durée de chacun de ces blocs. Vous devrez peut-être modifier cette valeur si votre restauration de base de données ne se termine pas. La valeur par défaut est de 10 secondes."
DATABASE_LBL_THROTTLEMSEC="Temporisation"
DATABASE_LBL_THROTTLEMSEC_HELP="Le script de restauration peut éventuellement ralentir le rythme du processus de restauration de la base de données pour les serveurs qui se comportent très mal. Vous pouvez saisir la temporisation entre les blocs de traitement en millisecondes (1/1000 de seconde). Par exemple, pour ajouter une temporisation de 5 secondes entre les étapes, saisissez 5000 dans ce champ. La valeur par défaut de 250 devrait fonctionner sur la plupart des serveurs."

DATABASE_LBL_ON_CREATE_ERROR="Arrêter en cas d'erreur CREATE"
DATABASE_LBL_ON_CREATE_ERROR_HELP="La restauration doit-elle être immédiatement arrêtée en cas d'erreur lors de la création d'une table, d'une vue, d'une fonction, d'un déclencheur ou d'une procédure stockée ? Si cette option n'est pas cochée, de telles erreurs seront ignorées et la restauration se poursuivra avec une possible corruption de données et/ou des problèmes sur le site restauré."
DATABASE_LBL_ON_OTHER_ERROR="Arrêter en cas d'autre erreur"
DATABASE_LBL_ON_OTHER_ERROR_HELP="La restauration doit-elle être immédiatement arrêtée en cas d'erreur lors de l'exécution d'une autre commande de base de données, comme la restauration ou la suppression de données ? Si cette option n'est pas cochée, de telles erreurs seront ignorées et la restauration se poursuivra avec une possible corruption de données et/ou des problèmes sur le site restauré."

DATABASE_HEADER_DBRESTORE="Restauration de la base de données"
DATABASE_LBL_RESTORATION_PROGRESS="Progression de la restauration"
DATABASE_LBL_RESTORED="Restauré"
DATABASE_LBL_TOTAL="Taille totale"
DATABASE_LBL_ETA="Temps restant estimé"

DATABASE_HEADER_SUCCESS="La restauration de la base de données a réussi"
DATABASE_HEADER_WARNINGS="La restauration de la base de données s'est terminée mais certaines requêtes ont échoué"
DATABASE_MSG_WARNINGS="Votre site restauré pourrait ne pas fonctionner correctement tant que vous ne résolvez pas manuellement ces problèmes. Veuillez examiner les requêtes qui ont échoué et la raison de leur échec en consultant le fichier journal :"
DATABASE_MSG_SUCCESS="Cliquez sur le bouton ci-dessous pour passer à l'étape suivante"
DATABASE_BTN_SUCCESS="Étape suivante"

DATABASE_HEADER_INPROGRESS_WARNINGS="Certaines requêtes ont échoué"
DATABASE_MSG_INPROGRESS_WARNINGS="Certaines requêtes SQL ont échoué à s'exécuter, mais vous avez choisi de les ignorer. Vous pouvez les examiner ainsi que la raison de leur échec après la fin de la restauration en consultant le fichier journal suivant :"

DATABASE_HEADER_ERROR="Une erreur s'est produite lors de la restauration de la base de données. Le message d'erreur se trouve ci-dessous. Cliquez sur le bouton &times; en haut à droite de cette boîte de dialogue pour la fermer et revenir à la page de restauration de la base de données."
DATABASE_ERR_INVALIDKEY="Clé de base de données invalide"

DATABASE_ERR_COMPLEXPASSWORD="!!! AVERTISSEMENT !!!\n\nVotre mot de passe de base de données contient des caractères spéciaux. De nombreux serveurs web rejettent ou modifient ces mots de passe, ce qui entraîne l'échec de la restauration de la base de données avec une erreur de connexion à la base de données.\n\nNous vous recommandons TRÈS VIVEMENT de changer votre mot de passe de base de données pour une longue chaîne aléatoire (32 caractères ou plus) composée UNIQUEMENT de lettres majuscules A-Z, de lettres minuscules a-z et de chiffres 0-9.\n\nVoulez-vous ignorer l'avertissement et procéder à la restauration de la base de données à vos propres risques ?"
DATABASE_ERR_UPPERCASEPREFIX="!!! AVERTISSEMENT !!!\n\nVotre préfixe des noms de tables contient un ou plusieurs caractères en majuscule. Cela peut provoquer de graves problèmes sur le site restauré et/ou rendre impossible la restauration de votre site sur un serveur différent. Cela est dû à la façon dont MySQL gère les lettres majuscules et ne peut pas être efficacement contourné, selon la documentation de MySQL.\n\nNous vous recommandons TRÈS VIVEMENT d'utiliser un préfixe de noms de tables entièrement en minuscules.\n\nVoulez-vous ignorer l'avertissement et procéder à la restauration de la base de données à vos propres risques ?"
DATABASE_ERR_EMPTY_INFO="!!! AVERTISSEMENT !!!\n\nVous n'avez pas rempli tous les champs obligatoires (nom d'hôte de la base de données, nom de la base de données, nom d'utilisateur de la base de données, mot de passe de la base de données et préfixe des noms de tables). Cela causera très probablement une erreur lors de la tentative de connexion à la base de données et/ou sur le site restauré.\n\nÊtes-vous ABSOLUMENT SÛR que c'est bien ce que vous voulez faire ?"

DATABASE_HEADER_RESTORERETRY="Restauration interrompue et reprise automatique"
DATABASE_LBL_RESTOREFAILEDRETRY="La restauration de la base de données a été interrompue car une erreur a été détectée. Cependant, le script de restauration tentera de reprendre le processus. Si vous ne souhaitez pas reprendre la restauration, veuillez cliquer sur le bouton Annuler ci-dessous."
DATABASE_LBL_WILLRETRY="La restauration reprendra dans"
DATABASE_LBL_WILLRETRYSECONDS="secondes"
DATABASE_LBL_CANCEL="Annuler"
DATABASE_LBL_BTNRESUME="Reprendre"
DATABASE_LBL_LASTERRORMESSAGEWAS="Pour information, le dernier message d'erreur était :"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="L'erreur reçue était :"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="Comment corriger cette erreur"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Informations de débogage"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Afficher / Masquer"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Veuillez inclure ces informations dans votre demande d'assistance si vous avez besoin d'aide supplémentaire. Indiquez-nous les étapes de dépannage que vous avez déjà essayées."

DATABASE_RESTORE_DBNAME_HEAD="Nom de base de données incorrect ou accès refusé à la base de données"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="Le serveur de base de données indique que le nom d'hôte, le nom d'utilisateur et le mot de passe du serveur de base de données sont corrects, mais il ne peut pas se connecter à la base de données que vous avez spécifiée dans l'option « Nom de la base de données ». Cela signifie que soit la base de données n'existe pas <em>soit</em> vous n'avez pas accordé à votre utilisateur de base de données l'accès à cette base de données."
DATABASE_RESTORE_DBUSER_HEAD="Informations de connexion à la base de données incorrectes"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="Nous n'avons pas pu nous connecter à votre serveur de base de données en utilisant le nom d'hôte, le nom d'utilisateur et le mot de passe que vous avez fournis."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Vérifiez le nom d'hôte de votre serveur de base de données. N'oubliez pas que <code>localhost</code> et <code>127.0.0.1</code> ont des significations différentes lors de la connexion à une base de données."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Vérifiez le nom de votre base de données et le nom d'utilisateur de la base de données. La plupart des hébergeurs préfixent le nom de la base de données avec le nom de votre compte d'hébergement. En cas de doute, contactez votre hébergeur."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Vérifiez votre mot de passe. La casse est importante : ABC, abc et Abc sont trois mots de passe <em>différents</em>."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Si vous copiez ou déplacez votre site, assurez-vous de saisir les informations de connexion à la base de données du nouveau site."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Si vous n'avez pas encore de base de données, vous devrez en créer une. La plupart des hébergeurs n'autorisent pas ce script de restauration à créer une nouvelle base de données pour des raisons de sécurité."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Si vous avez créé une nouvelle base de données, assurez-vous d'avoir également créé un utilisateur de base de données <strong>et</strong> de l'avoir affecté à la base de données, en lui accordant tous les privilèges sur cette base de données."

; ==============================================================================
; Site setup
; ==============================================================================
SETUP_HEADER_SITEPARAMS="Paramètres du site"
SETUP_HEADER_SITEPARAMS_HELP="Ce sont les paramètres de base de votre site. Vous pouvez toujours les modifier après la restauration depuis l'administration de votre site, sous Configuration globale."
SETUP_LBL_SITENAME="Nom du site"
SETUP_LBL_SITENAME_HELP="Le nom de votre site, utilisé notamment dans les pages HTML du site."
SETUP_LBL_SITEEMAIL="Adresse e-mail du site"
SETUP_LBL_SITEEMAIL_HELP="L'adresse e-mail depuis laquelle les e-mails de votre site sembleront provenir."
SETUP_LBL_EMAILSENDER="Nom de l'expéditeur du site"
SETUP_LBL_EMAILSENDER_HELP="Le nom de l'expéditeur utilisé pour tous les e-mails envoyés par votre site."
SETUP_LBL_LIVESITE="URL du site en production"
SETUP_LBL_LIVESITE_HELP="Certains serveurs ont du mal à déterminer l'URL de votre site, ce qui peut entraîner des problèmes avec les URLs SEF et les éléments de menu. Sur ces serveurs, vous devez saisir l'URL de votre site sans la barre oblique finale, par ex. <code>http://www.example.com</code>. Dans la plupart des cas, ce n'est pas nécessaire et vous pouvez laisser ce champ vide."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="AVERTISSEMENT ! Votre serveur web fonctionne sous Windows. Renseigner l'URL du site en production sur un serveur Windows rendra impossible la connexion à l'administration de votre site en raison d'un bogue dans Joomla!. Veuillez laisser ce champ vide."
SETUP_LBL_USESITEDIRS="Remplacer les chemins tmp et log"
SETUP_LBL_USESITEDIRS_HELP="Par défaut, le script de restauration utilisera les chemins tmp et log déjà configurés dans la Configuration globale du site sauvegardé. Si vous restaurez vers un serveur différent ou clonez votre site, cela peut poser des problèmes. Dans ce cas, ou si vous avez un doute, cliquez sur le bouton — le script de restauration renseignera les chemins du répertoire temporaire et du répertoire des journaux avec des valeurs appropriées pour le site vers lequel vous effectuez la restauration. Vous pouvez modifier ces chemins dans la section Réglage fin des répertoires ci-dessous."
SETUP_LBL_USESITEDIRS_51="Remplacer les chemins tmp, log et cache"
SETUP_LBL_USESITEDIRS_HELP_51="Par défaut, le script de restauration utilisera les chemins tmp, log et cache déjà configurés dans la Configuration globale du site sauvegardé. Si vous restaurez vers un serveur différent ou clonez votre site, cela peut poser des problèmes. Dans ce cas, ou si vous avez un doute, cliquez sur le bouton — le script de restauration renseignera les chemins du répertoire temporaire et du répertoire des journaux avec des valeurs appropriées pour le site vers lequel vous effectuez la restauration, et réinitialisera le répertoire du cache à une chaîne vide (ce qui indique à Joomla! d'utiliser le dossier <code>administrator/cache</code>). Vous pouvez modifier ces chemins dans la section Réglage fin des répertoires ci-dessous."
SETUP_LBL_COOKIEDOMAIN="Domaine du cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="Le domaine du cookie est le nom de domaine de votre site, sans le protocole et, généralement, sans la partie www. Par exemple, si vous restaurez vers http://www.example.com, le domaine du cookie est example.com (insistons encore une fois : il n'y a PAS de http:// !)."
SETUP_LBL_COOKIEPATH="Chemin du cookie"
SETUP_LBL_COOKIEPATH_HELP="Le chemin du cookie est le sous-répertoire de votre site, relatif à la racine du domaine. Si vous restaurez à la racine d'un domaine, par ex. http://www.example.com, il s'agit de / (une seule barre oblique). Si vous restaurez dans un sous-répertoire, il s'agit d'une barre oblique suivie du nom du répertoire. Par exemple, si vous restaurez vers http://www.example.com/joomla, le chemin du cookie est /joomla (AVEC une barre oblique au début, mais SANS barre oblique à la fin)."

SETUP_HEADER_FTPPARAMS="Options de la couche FTP"
SETUP_HEADER_FTPPARAMS_HELP="Ce sont des paramètres facultatifs qui permettent à Joomla! d'utiliser FTP pour écrire dans des fichiers et répertoires autrement non accessibles en écriture. Cela est généralement requis uniquement sur les hébergements mutualisés. Consultez le texte d'aide des options pour plus d'informations."
SETUP_LABEL_FTPENABLE="Activer la couche FTP"
SETUP_LABEL_FTPENABLE_HELP="Certains hébergements mutualisés rendent impossible l'écriture par PHP dans des fichiers et répertoires téléversés par FTP. Si vous êtes sur un tel hébergement et avez utilisé FTP ou l'option d'extraction par téléversement FTP de Kickstart, vous devez configurer et activer la couche FTP."
SETUP_LABEL_FTPHOST="Nom d'hôte"
SETUP_LABEL_FTPHOST_HELP="Le nom d'hôte ou l'adresse IP de votre serveur FTP <b>sans</b> le spécificateur de protocole ftp://. Il s'agit généralement de localhost ou 127.0.0.1. En cas de doute, contactez votre hébergeur."
SETUP_LABEL_FTPPORT="Port"
SETUP_LABEL_FTPPORT_HELP="Le port TCP sur lequel le serveur FTP écoute. Il s'agit généralement du port 21. En cas de doute, définissez-le à 21 ou contactez votre hébergeur."
SETUP_LABEL_FTPUSER="Nom d'utilisateur"
SETUP_LABEL_FTPUSER_HELP="Le nom d'utilisateur que vous utilisez pour vous connecter au FTP. En cas de doute, contactez votre hébergeur."
SETUP_LABEL_FTPPASS="Mot de passe"
SETUP_LABEL_FTPPASS_HELP="Le mot de passe que vous utilisez pour vous connecter au FTP. En cas de doute, contactez votre hébergeur."
SETUP_LABEL_FTPDIR="Répertoire"
SETUP_LABEL_FTPDIR_HELP="Le répertoire FTP où se trouvent les fichiers de votre site (comme index.php). En cas de doute, contactez votre hébergeur."

SETUP_HEADER_SUPERUSERPARAMS="Paramètres du Super Utilisateur"
SETUP_HEADER_SUPERUSERPARAMS_HELP="Le script de restauration restaure votre site avec le Super Utilisateur qui a été sauvegardé sur le site d'origine. Vous pouvez éventuellement sélectionner un (et un seul) Super Utilisateur sur cette page et modifier son adresse e-mail et son mot de passe. Cela est extrêmement utile lorsque vous clonez un site."
SETUP_LABEL_SUPERUSER="Super Utilisateur"
SETUP_LABEL_SUPERUSER_HELP="Vous pouvez éventuellement sélectionner un compte Super Utilisateur dont l'adresse e-mail et/ou le mot de passe seront modifiés sur le site restauré. <b>Seul le Super Utilisateur sélectionné sera modifié.</b> Si vous ne souhaitez pas faire cela, laissez la sélection par défaut « — » qui ne modifie aucun compte utilisateur."
SETUP_LABEL_SUPERADMIN="Administrateur"
SETUP_LABEL_SUPERUSEREMAIL="E-mail"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Saisissez l'adresse e-mail du Super Utilisateur. Assurez-vous qu'elle n'est pas utilisée par un autre utilisateur sur le site, sinon votre site restauré sera défaillant !"
SETUP_LABEL_SUPERUSERPASSWORD="Mot de passe"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Saisissez le nouveau mot de passe à attribuer au Super Utilisateur. Si vous ne souhaitez pas modifier le mot de passe du Super Utilisateur, laissez ce champ et les suivants vides."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Saisissez le nouveau mot de passe à attribuer au Super Utilisateur."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Mot de passe (confirmation)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Répétez le mot de passe. Cela nous permet de vérifier que vous n'avez pas fait de faute de frappe ci-dessus."

SETUP_HEADER_FINETUNING="Réglage fin des répertoires"
SETUP_HEADER_FINETUNING_HELP="Joomla! a besoin de deux répertoires accessibles en écriture pour ses fichiers temporaires et ses journaux. Vous pouvez les définir ici. Conseil : s'ils ne sont pas accessibles en écriture mais que vous avez déjà activé la couche FTP ci-dessus, le script de restauration tentera de les rendre accessibles en écriture et de les sécuriser automatiquement."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Générer un nouveau secret"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Activez cette option lors du déplacement de votre site entre des serveurs et/ou des domaines. Elle génère de nouveaux secrets dans le fichier de configuration de votre site pour éviter la réutilisation de session depuis l'ancien site. Notez que les logiciels tiers qui utilisent les secrets du site pour chiffrer des informations pourraient ne pas pouvoir accéder à leurs données lorsque vous faites cela."
SETUP_LABEL_SITEROOT="Racine du site"
SETUP_LABEL_SITEROOT_HELP="Il s'agit du chemin vers la racine de votre site. Il est affiché pour votre commodité. Triple-cliquez (ou appuyez longuement) dessus pour le sélectionner ; vous pouvez ensuite le copier et l'utiliser dans les champs ci-dessous."
SETUP_LABEL_TMPPATH="Répertoire temporaire"
SETUP_LABEL_TMPPATH_HELP="Le répertoire où Joomla! stockera les données temporaires. Nous recommandons de le placer en dehors de la racine de votre site. Par défaut : le répertoire <code>tmp</code> sous la racine de votre site."
SETUP_LABEL_LOGSPATH="Répertoire des journaux"
SETUP_LABEL_LOGSPATH_HELP="Le répertoire où Joomla! stockera ses fichiers journaux. Nous recommandons de le placer en dehors de la racine de votre site. Par défaut : le répertoire <code>log</code> sous la racine de votre site."
SETUP_LBL_CACHE_PATH="Répertoire du cache"
SETUP_LBL_CACHE_PATH_HELP="Le répertoire où Joomla! stockera ses fichiers de cache temporaires. Nous recommandons de le placer en dehors de la racine de votre site. Si vous laissez ce champ vide, le répertoire <code>administrator/cache</code> sous la racine de votre site sera utilisé (valeur par défaut et recommandée). REMARQUE : Joomla! utilisera toujours <code>administrator/cache</code> pour son fichier <code>autoload_psr4.php</code> à moins que la constante <code>JPATH_CACHE</code> ne soit remplacée."

