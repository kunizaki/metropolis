SETUP_LABEL_FORCESSL="Forcer SSL"
SETUP_LABEL_FORCESSL_TIP="Forcer l'accès au site à toujours se faire via SSL (https) pour les zones du site sélectionnées. Si vous avez SSL activé sur votre site, nous recommandons de toujours utiliser Site entier pour des raisons de sécurité."
