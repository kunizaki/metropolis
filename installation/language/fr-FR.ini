SETUP_HEADER_SERVERCONFIG="Fichiers de configuration spécifiques au serveur"
SETUP_SERVERCONFIG_DESCR="Les fichiers qui modifient le comportement de votre serveur lors de la diffusion de votre site peuvent entraîner des problèmes de chargement du site lors de la restauration vers un nouvel hébergeur. Utilisez les options ci-dessous pour les réinitialiser aux valeurs par défaut de Joomla!."
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI="Supprimer les fichiers .user.ini et/ou php.ini des répertoires principaux du site"
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI_HELP="Renomme les fichiers de configuration PHP <strong>.user.ini</strong> et <strong>php.ini</strong> dans le répertoire racine du site et le répertoire administrateur. Les fichiers renommés ont une extension .bak."
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG="Remplacer le fichier web.config principal par le défaut"
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG_HELP="Remplace le contenu du fichier web.config à la racine de votre site par le contenu du fichier web.config.txt standard livré avec Joomla. L'ancien fichier est renommé en web.config.bak"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Supprimer les fichiers .htaccess et .htpasswd dans le répertoire administrateur"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Supprime les fichiers .htaccess et .htpasswd dans le répertoire administrateur. Activez cette option si vous aviez appliqué une protection par mot de passe au répertoire administrateur — soit via le panneau de contrôle de votre hébergeur, soit via une extension de sécurité tierce telle qu'Admin Tools — et que vous restaurez vers un nouveau serveur qui ne prend pas en charge la même méthode de chiffrement de mot de passe que votre ancien serveur. <strong>IMPORTANT</strong> : N'oubliez pas de réactiver la protection par mot de passe du répertoire administrateur une fois la restauration terminée !"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="Les fichiers référencés par cette option n'existent pas sur votre serveur. C'est très bien ! Vous n'avez pas à vous en occuper et vous n'avez pas besoin de cette option."

DATABASE_WARN_LARGE_COLUMNS="La plus grande ligne de base de données de votre base de données fait %1$0.2f Mo. Cependant, votre serveur de base de données est susceptible d'être configuré pour n'accepter que jusqu'à %3$0.2f Mo (nous ne pouvons pas le vérifier sans nous connecter au serveur de base de données). Si vous procédez à la restauration de la base de données, vous recevrez très probablement un code d'erreur de base de données 1153 ; ou un message d'erreur 'ER_NET_PACKET_TOO_LARGE' ; ou un message d'erreur 'Got a packet bigger than 'max_allowed_packet' bytes'. Si cela se produit, veuillez demander à votre hébergeur de définir la valeur de la variable de configuration <strong>max_allowed_packet</strong> de votre serveur de base de données à au moins %2$d Mo."


DATABASE_LBL_SPECIFICTABLES_LBL="Sélectionnez les éléments de base de données à restaurer"
DATABASE_LBL_SPECIFICTABLES_ADD_ALL="Tout ajouter"
DATABASE_LBL_SPECIFICTABLES_CLEAR_ALL="Tout effacer"
DATABASE_LBL_SPECIFICTABLES_HELP="Par défaut, le script de restauration restaurera toutes les tables de la base de données. Si vous souhaitez restaurer uniquement des tables spécifiques, veuillez les sélectionner ci-dessous."
SETUP_LBL_SERVERCONFIG_DISABLEFORCESSL_WARN="Vous effectuez une restauration sur un site non chiffré (HTTP) mais votre Configuration globale indique que le site doit être accessible via une connexion chiffrée (HTTPS). Si votre site actuel ne prend pas en charge HTTPS, veuillez définir l'option ci-dessous sur « Aucun »."

SETUP_LBL_HTACCESSCHANGE_LBL="Gestion du .htaccess"
SETUP_LBL_HTACCESSCHANGE_DESC="Choisissez ce qu'il faut faire avec le fichier <code>.htaccess</code> de votre site.<br/><strong>Aucune modification</strong>. Le fichier est conservé tel quel.<br/><strong>Utiliser la valeur par défaut</strong>. Remplace le contenu du fichier .htaccess à la racine de votre site par le contenu du fichier htaccess.txt standard livré avec Joomla. L'ancien fichier est renommé en htaccess.bak<br/><strong>Supprimer les lignes de gestionnaire PHP</strong> Supprime toutes les lignes AddHandler/SetHandler de votre fichier .htaccess. Il s'agit de directives spécifiques au serveur qui sont généralement utilisées pour appliquer une version spécifique de PHP à votre site. À utiliser lors de la restauration vers un serveur différent.<br/><strong>Remplacer les lignes de gestionnaire PHP</strong> Utilise les lignes AddHandler/SetHandler de votre fichier .htaccess actuel. À utiliser si vous avez dû définir une version de PHP différente pour votre site avant d'exécuter Kickstart ou l'assistant de transfert de site.<br/>"
SETUP_LBL_HTACCESSCHANGE_NONE="Aucune modification"
SETUP_LBL_HTACCESSCHANGE_DEFAULT="Utiliser la valeur par défaut"
SETUP_LBL_HTACCESSCHANGE_REMOVEHANDLER="Supprimer les lignes de gestionnaire PHP"
SETUP_LBL_HTACCESSCHANGE_REPLACEHANDLER="Remplacer les lignes de gestionnaire PHP"
