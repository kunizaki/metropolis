FINALISE_LBL_MAKESURECONFIG="Assurez-vous d'avoir créé le fichier <code>%s</code> comme indiqué ci-dessus, et vérifiez son contenu par rapport à ce qui est affiché sur cette page. Ne pas le faire <em>entraînera</em> un site défaillant."
FINALISE_LBL_KICKSTART="Fermez cette fenêtre pour revenir à Kickstart. Cliquez sur le bouton <strong>Nettoyage</strong> pour commencer à utiliser votre site restauré."
