DATABASE_HEADER_CONNECTION="Informazioni di connessione"
DATABASE_LBL_TYPE="Tipo di database"
DATABASE_LBL_TYPE_HELP="Di solito è MySQLi (<em>con</em> la "i" finale)"
DATABASE_LBL_HOSTNAME="Nome host del server del database"
DATABASE_LBL_HOSTNAME_HELP="Il nome host o l'indirizzo IP del server del database (di solito: localhost). <strong>IMPORTANTE!</strong> <code>localhost</code> e <code>127.0.0.1</code> significano due cose diverse, vedi sotto. Esempi di connessione:<ul><li><code>localhost</code></li> Connessione a localhost tramite il socket UNIX predefinito (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Connessione a localhost tramite TCP/IP usando la porta predefinita (3306).<li><code>127.0.0.1:1234</code></li> Connessione a localhost tramite TCP/IP usando la porta 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Connessione all'host IPv6 all'indirizzo 2607:f0d0:1002:51::4 tramite TCP/IP usando la porta 1234. Nota: tutti gli indirizzi IPv6 DEVONO essere racchiusi tra parentesi quadre!</li><li><code>mysql.example.com:1234</code></li> Connessione a mysql.example.com tramite TCP/IP usando la porta 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Connessione tramite il socket UNIX in /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Connessione tramite la Named Pipe Windows "MySQL" (ovviamente funziona solo su server Windows).</ul>"
DATABASE_LBL_USERNAME="Nome utente"
DATABASE_LBL_USERNAME_HELP="Il nome utente utilizzato per connettersi al database. La maggior parte dei provider che utilizzano cPanel, Plesk e altri pannelli di hosting principali fornisce nomi utente come abcdef_nomeutente, dove abcdef è il nome utente del pannello di controllo dell'hosting. In caso di dubbio, chieda al suo provider."
DATABASE_LBL_PASSWORD="Password"
DATABASE_LBL_PASSWORD_HELP="La password utilizzata per connettersi al database."
DATABASE_LBL_DBNAME="Nome del database"
DATABASE_LBL_DBNAME_HELP="Il nome del suo database. La maggior parte dei provider che utilizzano cPanel, Plesk e altri pannelli di hosting principali fornisce nomi di database come <code>abcdef_nomeutente</code>, dove <code>abcdef</code> è il nome utente del pannello di controllo dell'hosting. In caso di dubbio, chieda al suo provider."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Opzioni non comuni"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Le seguenti opzioni vengono utilizzate in configurazioni MySQL meno comuni ed esotiche."
DATABASE_LBL_PORT="Porta del database"
DATABASE_LBL_PORT_HELP="<strong>Facoltativo</strong>. La porta TCP/IP del database, se diversa da quella predefinita (3306). Non si applica se si utilizza il nome host <code>localhost</code> o un socket. Se non sa cosa significa, lasci questo campo vuoto."
DATABASE_LBL_SOCKET="Socket UNIX / Named Pipe Windows"
DATABASE_LBL_SOCKET_HELP="<strong>Facoltativo</strong>. Se si sta connettendo al server del database tramite un socket UNIX (ad es. <code>unix:/tmp/mysql.sock</code>) o una Named Pipe Windows (ad es. <code>\\.\MySQL</code>) lo inserisca qui. Se non sa cosa significa, lasci questo campo vuoto."
DATABASE_LBL_DBENCRYPTION="Usa SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Facoltativo.</strong> Vuole connettersi a MySQL tramite SSL/TLS? Può essere utilizzato per cifrare la connessione al database e facoltativamente per accedervi senza utilizzare una password. Dovrà fornire il percorso del file chiave e del certificato client MySQL. Questa è un'opzione molto rara. Se non sa cosa sia, ignori questa e le prossime opzioni."
DATABASE_LBL_DBSSLCIPHER="Cifrari SSL"
DATABASE_LBL_DBSSLCIPHER_HELP="Utilizzato solo quando Usa SSL/TLS è abilitato. Un elenco separato da due punti dei cifrari di crittografia da utilizzare per la connessione SSL/TLS, ad es. <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. In caso di dubbio, lasci questo campo vuoto."
DATABASE_LBL_DBSSLCERT="File certificato SSL"
DATABASE_LBL_DBSSLCERT_HELP="Utilizzato solo quando Usa SSL/TLS è abilitato. Il percorso assoluto del filesystem al file del certificato client in formato PEM."
DATABASE_LBL_DBSSLKEY="File chiave SSL"
DATABASE_LBL_DBSSLKEY_HELP="Utilizzato solo quando Usa SSL/TLS è abilitato. Il percorso assoluto del filesystem al file della chiave client in formato PEM."
DATABASE_LBL_DBSSLCA="File CA SSL"
DATABASE_LBL_DBSSLCA_HELP="Utilizzato solo quando Usa SSL/TLS è abilitato. Il percorso assoluto del filesystem al file della Certification Authority (CA) per la connessione al server, in formato PEM. Viene preso in considerazione solo quando Verifica certificato server è abilitato."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Verifica certificato server"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Utilizzato solo quando Usa SSL/TLS è abilitato. Verifica la risposta del server rispetto al file della Certification Authority (CA). Deve fornire il file CA affinché questa opzione funzioni correttamente. Se il ripristino del database fallisce costantemente, provare a disabilitare questa opzione."

DATABASE_HEADER_ADVANCED="Opzioni avanzate"
DATABASE_LBL_EXISTING="Con le tabelle esistenti"
DATABASE_LBL_EXISTING_HELP="Selezionare cosa fare con le tabelle esistenti. "Elimina" eliminerà le tabelle esistenti con gli stessi nomi delle tabelle da ripristinare. "Backup" rinominerà le tabelle esistenti con gli stessi nomi delle tabelle da ripristinare, cambiando il loro prefisso in bak_. "Elimina stesso prefisso" eliminerà tutte le tabelle con lo stesso prefisso, anche se non sono incluse nel backup da ripristinare. "Elimina tutto" eliminerà tutte le tabelle, anche con un prefisso diverso. Le ultime due opzioni sono PERICOLOSE e devono essere utilizzate con ESTREMA CAUTELA."
DATABASE_LBL_EXISTING_DROP="Elimina"
DATABASE_LBL_EXISTING_BACKUP="Backup"
DATABASE_LBL_EXISTING_DROPPREFIX="Elimina stesso prefisso"
DATABASE_LBL_EXISTING_DROPALL="Elimina tutto"
DATABASE_LBL_PREFIX="Prefisso dei nomi delle tabelle del database"
DATABASE_LBL_PREFIX_HELP="Il prefisso di tutte le tabelle del database ripristinate che avevano un prefisso al momento del backup. Il prefisso utilizzato per il database principale del sito verrà anche scritto nel file configuration.php di Joomla!. Si noti che alcune estensioni potrebbero non funzionare correttamente o addirittura mandare in crash il sito se si cambia il prefisso dei nomi delle tabelle durante il ripristino / trasferimento del sito."
DATABASE_LBL_FOREIGNKEY="Disabilita verifica chiavi esterne"
DATABASE_LBL_FOREIGNKEY_HELP="Disabilita la verifica delle chiavi esterne di MySQL durante il ripristino. Ciò è obbligatorio quando si ripristina un database che utilizza relazioni a livello di tabella (chiavi esterne). In caso di dubbio, lasci questa opzione selezionata; non causerà alcun danno."
DATABASE_LBL_NOAUTOVALUE="Nessun valore automatico sullo zero"
DATABASE_LBL_NOAUTOVALUE_HELP="Consente di ripristinare tabelle con campi a auto-incremento il cui valore è zero. Magento e Drupal lo richiedono per un corretto ripristino. NOTA: Secondo la documentazione di MySQL: "Memorizzare 0 non è una pratica consigliata.""
DATABASE_LBL_REPLACE="Usa REPLACE invece di INSERT"
DATABASE_LBL_REPLACE_HELP="Lo script di ripristino normalmente utilizza i comandi INSERT per ripristinare i dati del database. Questo non funziona bene con i dati di alcune estensioni, causando problemi di ripristino. Se si verificano errori durante il ripristino del database, spunti questa casella e clicchi di nuovo su Avanti."
DATABASE_LBL_FORCEUTF8DB="Forza collation UTF-8 sul database"
DATABASE_LBL_FORCEUTF8DB_HELP="Se selezionato, lo script di ripristino proverà a convertire la collation predefinita della tabella in Unicode (UTF-8), come suggerito da Joomla!. Questo non funziona su tutti i server. Selezionarlo se si visualizzano punti interrogativi o testo illeggibile invece di caratteri internazionali."
DATABASE_LBL_FORCEUTF8TABLES="Forza collation UTF-8 sulle tabelle"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Se selezionato, lo script di ripristino proverà a convertire tutti i campi di testo delle tabelle ripristinate in Unicode (UTF-8). Questa è una soluzione alternativa quando non è possibile utilizzare l'opzione precedente. Si noti che se la collation del database è diversa da UTF-8 si <em>avranno</em> problemi in futuro, dopo che un aggiornamento di un'estensione aggiunge un nuovo campo di testo."
DATABASE_LBL_UTF8MB4DETECT="Consenti rilevamento automatico UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Se abilitato e il server del database supporta UTF8MB4 (UTF-8 Multibyte), verrà utilizzato al posto del normale UTF-8. ATTENZIONE: Usare solo se il sito utilizzava UTF8MB4 al momento del backup. Deselezionare questa opzione se dopo il ripristino del sito si visualizza testo illeggibile!"
DATABASE_LBL_CHARSET_CONVERSION="Normalizza charset"
DATABASE_LBL_CHARSET_CONVERSION_YES="Abilitato"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Rilevamento automatico (consigliato)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Disabilitato"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Controlla la normalizzazione della collation durante il ripristino tra diverse piattaforme o famiglie di versioni di database (ad es. da MariaDB a MySQL). <strong>Rilevamento automatico</strong>: la conversione del charset viene applicata automaticamente quando lo script di ripristino determina che il backup è stato creato su una piattaforma di database diversa o su una famiglia di versioni diversa rispetto al server di destinazione. <strong>Abilitato</strong>: normalizza sempre le collation indipendentemente dalla piattaforma. <strong>Disabilitato</strong>: non normalizza mai le collation; usare solo quando si è certi di ripristinare sullo stesso tipo di server di database (MySQL vs MariaDB) e sulla stessa famiglia di versioni."

DATABASE_HEADER_FINETUNING="Ottimizzazione"
DATABASE_MSG_FINETUNING="Modificare queste impostazioni solo se richiesto dal nostro supporto, o se il ripristino del database sembra bloccarsi. Impostare i valori 5 e 2000 nei campi seguenti comporterà un ripristino molto più lento, ma meno soggetto a errori su hosting economici e poco affidabili."
DATABASE_LBL_MAXEXECTIME="Tempo massimo di esecuzione"
DATABASE_LBL_MAXEXECTIME_HELP="Lo script di ripristino suddivide il processo di ripristino del database in piccoli blocchi di elaborazione per evitare timeout del server. Questo valore determina la durata di ciascuno di questi blocchi. Potrebbe essere necessario modificare questo valore se il ripristino del database non si completa. Il valore predefinito è 10 secondi."
DATABASE_LBL_THROTTLEMSEC="Tempo di rallentamento"
DATABASE_LBL_THROTTLEMSEC_HELP="Lo script di ripristino può facoltativamente rallentare la velocità del processo di ripristino del database per server con comportamento anomalo grave. È possibile inserire il tempo di rallentamento tra i blocchi di elaborazione in millisecondi (1/1000 di secondo). Ad esempio, per aggiungere un rallentamento di 5 secondi tra i passi, inserire 5000 in questa casella. Il valore predefinito di 250 dovrebbe funzionare sulla maggior parte dei server."

DATABASE_LBL_ON_CREATE_ERROR="Arresta in caso di errore CREATE"
DATABASE_LBL_ON_CREATE_ERROR_HELP="Il ripristino deve essere interrotto immediatamente in caso di errore nella creazione di una tabella, vista, funzione, trigger o stored procedure? Se non selezionato, tali errori verranno ignorati e il ripristino procederà con possibile corruzione dei dati e/o problemi sul sito ripristinato."
DATABASE_LBL_ON_OTHER_ERROR="Arresta in caso di altro errore"
DATABASE_LBL_ON_OTHER_ERROR_HELP="Il ripristino deve essere interrotto immediatamente in caso di errore nell'esecuzione di qualsiasi altro comando del database, come il ripristino o l'eliminazione di dati? Se non selezionato, tali errori verranno ignorati e il ripristino procederà con possibile corruzione dei dati e/o problemi sul sito ripristinato."

DATABASE_HEADER_DBRESTORE="Ripristino del database"
DATABASE_LBL_RESTORATION_PROGRESS="Avanzamento ripristino"
DATABASE_LBL_RESTORED="Ripristinato"
DATABASE_LBL_TOTAL="Dimensione totale"
DATABASE_LBL_ETA="Tempo rimanente stimato"

DATABASE_HEADER_SUCCESS="Il ripristino del database è stato completato con successo"
DATABASE_HEADER_WARNINGS="Il ripristino del database è stato completato ma alcune query non sono state eseguite"
DATABASE_MSG_WARNINGS="Il sito ripristinato potrebbe non funzionare correttamente a meno che non vengano corretti manualmente questi problemi. Si prega di esaminare le query non riuscite e il motivo del loro fallimento nel file di log:"
DATABASE_MSG_SUCCESS="Clicchi sul pulsante sottostante per procedere al passo successivo"
DATABASE_BTN_SUCCESS="Passo successivo"

DATABASE_HEADER_INPROGRESS_WARNINGS="Alcune query non sono riuscite"
DATABASE_MSG_INPROGRESS_WARNINGS="Alcune query SQL non sono riuscite ma ha scelto di ignorarle. È possibile esaminarle insieme al motivo del loro fallimento al termine del ripristino consultando il seguente file di log:"

DATABASE_HEADER_ERROR="Si è verificato un errore durante il ripristino del database. Il messaggio di errore è riportato di seguito. Clicchi sul pulsante &times; in alto a destra di questa finestra di dialogo per chiuderla e tornare alla pagina di ripristino del database."
DATABASE_ERR_INVALIDKEY="Chiave database non valida"

DATABASE_ERR_COMPLEXPASSWORD="!!! AVVISO !!!\n\nLa password del database contiene caratteri speciali. Molti server web rifiutano o modificano queste password, causando il fallimento del ripristino del database con un errore di connessione al database.\n\nRaccomandiam VIVAMENTE di cambiare la password del database con una stringa casuale lunga (32 caratteri o più) composta SOLO da lettere maiuscole A-Z, lettere minuscole a-z e numeri 0-9.\n\nVuole ignorare l'avviso e procedere con il ripristino del database a proprio rischio?"
DATABASE_ERR_UPPERCASEPREFIX="!!! AVVISO !!!\n\nIl prefisso dei nomi delle tabelle del database contiene uno o più caratteri maiuscoli. Ciò potrebbe causare gravi problemi sul sito ripristinato e/o rendere impossibile ripristinare il sito su un server diverso. Ciò accade a causa del modo in cui MySQL gestisce le lettere maiuscole e non può essere efficacemente evitato, come indicato nella documentazione di MySQL.\n\nRaccomandiam VIVAMENTE di utilizzare un prefisso dei nomi delle tabelle del database composto interamente da lettere minuscole.\n\nVuole ignorare l'avviso e procedere con il ripristino del database a proprio rischio?"
DATABASE_ERR_EMPTY_INFO="!!! AVVISO !!!\n\nNon ha compilato tutti i campi obbligatori (nome host del database, nome del database, nome utente del database, password del database e prefisso dei nomi delle tabelle). Ciò causerà molto probabilmente un errore nel tentativo di connettersi al database e/o al sito ripristinato.\n\nÈ ASSOLUTAMENTE SICURO che sia questa la sua intenzione?"

DATABASE_HEADER_RESTORERETRY="Ripristino interrotto e riprenderà automaticamente"
DATABASE_LBL_RESTOREFAILEDRETRY="Il ripristino del database è stato interrotto perché è stato rilevato un errore. Tuttavia, lo script di ripristino tenterà di riprendere il processo. Se non vuole riprendere il ripristino, clicchi sul pulsante Annulla di seguito."
DATABASE_LBL_WILLRETRY="Il ripristino riprenderà tra"
DATABASE_LBL_WILLRETRYSECONDS="secondi"
DATABASE_LBL_CANCEL="Annulla"
DATABASE_LBL_BTNRESUME="Riprendi"
DATABASE_LBL_LASTERRORMESSAGEWAS="Per informazione, l'ultimo messaggio di errore era:"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="L'errore ricevuto è stato:"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="Come risolvere questo errore"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Informazioni di debug"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Mostra / Nascondi"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Si prega di includere queste informazioni nella richiesta di supporto se ha bisogno di ulteriore assistenza. Ci dica anche quali passaggi di risoluzione dei problemi ha già provato."

DATABASE_RESTORE_DBNAME_HEAD="Nome del database errato o accesso al database non consentito"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="Il server del database segnala che il nome host del server del database, il nome utente e la password sono corretti ma non riesce a connettersi al database specificato nell'opzione "Nome del database". Ciò significa che il database non esiste <em>oppure</em> l'utente del database non ha accesso a questo database."
DATABASE_RESTORE_DBUSER_HEAD="Informazioni di connessione al database errate"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="Non è stato possibile connettersi al server del database utilizzando il nome host, il nome utente e la password forniti."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Verifichi il nome host del server del database. Ricordi che <code>localhost</code> e <code>127.0.0.1</code> hanno significati diversi quando ci si connette a un database."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Verifichi il nome del database e il nome utente del database. La maggior parte dei provider aggiunge il nome dell'account hosting come prefisso al nome del database. In caso di dubbio, chieda al suo provider."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Verifichi la password. Le maiuscole contano: ABC, abc e Abc sono tre password <em>diverse</em>."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Se sta copiando o spostando il sito, assicurarsi di inserire le informazioni di connessione al database per il nuovo sito."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Se non ha ancora un database, dovrà crearne uno. La maggior parte dei provider non consente a questo script di ripristino di creare un nuovo database per motivi di sicurezza."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Se ha creato un nuovo database, assicurarsi di aver anche creato un utente del database <strong>e</strong> assegnato l'utente al database, concedendogli tutti i privilegi sul database."

; ==============================================================================
; Site setup
; ==============================================================================
SETUP_HEADER_SITEPARAMS="Parametri del sito"
SETUP_HEADER_SITEPARAMS_HELP="Questi sono i parametri di base del suo sito. È possibile modificarli sempre dopo il completamento del ripristino dal backend del sito, in Configurazione globale."
SETUP_LBL_SITENAME="Nome del sito"
SETUP_LBL_SITENAME_HELP="Il nome del suo sito, utilizzato nelle pagine HTML del sito e in altri contesti."
SETUP_LBL_SITEEMAIL="Indirizzo e-mail del sito"
SETUP_LBL_SITEEMAIL_HELP="L'indirizzo e-mail da cui risulteranno provenire le e-mail del sito."
SETUP_LBL_EMAILSENDER="Nome del mittente e-mail del sito"
SETUP_LBL_EMAILSENDER_HELP="Il nome del mittente utilizzato per tutte le e-mail inviate dal sito."
SETUP_LBL_LIVESITE="URL del sito"
SETUP_LBL_LIVESITE_HELP="Alcuni server hanno difficoltà a determinare l'URL del sito, il che può causare problemi con gli URL SEF e le voci di menu. Su questi server è necessario inserire l'URL del sito senza la barra finale, ad es. <code>http://www.example.com</code>. Nella maggior parte dei casi ciò non è necessario e si può lasciare questo campo vuoto."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="ATTENZIONE! Il suo server web è in esecuzione su Windows. Inserire l'URL del sito quando si esegue un sito su Windows renderà impossibile accedere all'area amministrativa del sito a causa di un bug in Joomla!. Si prega di lasciare questa casella vuota."
SETUP_LBL_USESITEDIRS="Sostituisci percorsi tmp e log"
SETUP_LBL_USESITEDIRS_HELP="Lo script di ripristino utilizzerà per impostazione predefinita i percorsi tmp e log già impostati nella Configurazione globale del sito di cui si è eseguito il backup. Se si sta ripristinando su un server diverso o si sta clonando il sito, ciò potrebbe causare problemi. In questo caso, o in caso di dubbio, clicchi sul pulsante — lo script di ripristino inserirà nei campi Cartella temporanea e Cartella dei log i valori appropriati per il sito da ripristinare. È possibile modificare questi percorsi nella sezione Ottimizzazione cartelle di seguito."
SETUP_LBL_USESITEDIRS_51="Sostituisci percorsi tmp, log e cache"
SETUP_LBL_USESITEDIRS_HELP_51="Lo script di ripristino utilizzerà per impostazione predefinita i percorsi tmp, log e cache già impostati nella Configurazione globale del sito di cui si è eseguito il backup. Se si sta ripristinando su un server diverso o si sta clonando il sito, ciò potrebbe causare problemi. In questo caso, o in caso di dubbio, clicchi sul pulsante — lo script di ripristino inserirà nei campi Cartella temporanea e Cartella dei log i valori appropriati per il sito da ripristinare, e ripristinerà la Cartella della cache a una stringa vuota (che indica a Joomla! di usare la cartella <code>administrator/cache</code>). È possibile modificare questi percorsi nella sezione Ottimizzazione cartelle di seguito."
SETUP_LBL_COOKIEDOMAIN="Dominio del cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="Il dominio del cookie è il nome di dominio del sito, senza il protocollo e, di solito, senza la parte www. Ad esempio, se si sta ripristinando su http://www.example.com, il dominio del cookie è example.com (sottolineiamo ancora: non c'è http:// in esso!!)."
SETUP_LBL_COOKIEPATH="Percorso del cookie"
SETUP_LBL_COOKIEPATH_HELP="Il percorso del cookie è la sottocartella del sito, relativa alla radice del dominio. Se si sta ripristinando nella radice di un dominio, ad es. http://www.example.com, è / (una singola barra). Se si sta ripristinando in una sottocartella è una barra seguita dal nome della cartella. Ad esempio, se si sta ripristinando su http://www.example.com/joomla, il percorso del cookie è /joomla (CON una barra iniziale, ma SENZA una barra finale)."

SETUP_HEADER_FTPPARAMS="Opzioni del layer FTP"
SETUP_HEADER_FTPPARAMS_HELP="Queste sono impostazioni facoltative che consentono a Joomla! di utilizzare FTP per scrivere in file e cartelle altrimenti non scrivibili. Di solito è necessario solo su hosting condivisi. Per ulteriori informazioni consultare il testo di aiuto delle opzioni."
SETUP_LABEL_FTPENABLE="Abilita il layer FTP"
SETUP_LABEL_FTPENABLE_HELP="Alcuni hosting condivisi rendono impossibile per PHP scrivere in file e cartelle caricati tramite FTP. Se si è su un tale hosting e si è utilizzato FTP o l'opzione di estrazione Upload by FTP di Kickstart, si vuole configurare e abilitare il layer FTP."
SETUP_LABEL_FTPHOST="Nome host"
SETUP_LABEL_FTPHOST_HELP="Il nome host o l'indirizzo IP del server FTP <b>senza</b> lo specificatore di protocollo ftp://. Di solito è localhost o 127.0.0.1. In caso di dubbio, chieda al suo provider."
SETUP_LABEL_FTPPORT="Porta"
SETUP_LABEL_FTPPORT_HELP="La porta TCP su cui il server FTP è in ascolto. Di solito è 21. In caso di dubbio, imposti 21 o chieda al suo provider."
SETUP_LABEL_FTPUSER="Nome utente"
SETUP_LABEL_FTPUSER_HELP="Il nome utente utilizzato per connettersi a FTP. In caso di dubbio, chieda al suo provider."
SETUP_LABEL_FTPPASS="Password"
SETUP_LABEL_FTPPASS_HELP="La password utilizzata per connettersi a FTP. In caso di dubbio, chieda al suo provider."
SETUP_LABEL_FTPDIR="Cartella"
SETUP_LABEL_FTPDIR_HELP="La cartella FTP in cui si trovano i file del sito (come index.php). In caso di dubbio, chieda al suo provider."

SETUP_HEADER_SUPERUSERPARAMS="Impostazioni Super Utente"
SETUP_HEADER_SUPERUSERPARAMS_HELP="Lo script di ripristino ripristina il sito con il Super Utente che era stato incluso nel backup del sito originale. È possibile selezionare facoltativamente uno (e uno solo) Super Utente in questa pagina e modificare il suo indirizzo e-mail e la sua password. Ciò è estremamente utile quando si clona un sito."
SETUP_LABEL_SUPERUSER="Super Utente"
SETUP_LABEL_SUPERUSER_HELP="È possibile selezionare facoltativamente un account Super Utente il cui indirizzo e-mail e/o password verrà modificato sul sito ripristinato. <b>Solo il Super Utente selezionato verrà modificato.</b> Se non si desidera farlo, lasciare la selezione predefinita "—" che non modifica alcun account utente."
SETUP_LABEL_SUPERADMIN="Amministratore"
SETUP_LABEL_SUPERUSEREMAIL="E-mail"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Inserire l'indirizzo e-mail del Super Utente. Assicurarsi che non sia già utilizzato da un altro utente sul sito, altrimenti il sito ripristinato non funzionerà correttamente!"
SETUP_LABEL_SUPERUSERPASSWORD="Password"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Inserire la nuova password da assegnare al Super Utente. Se non si desidera cambiare la password del Super Utente, lasciare vuoti questo e i seguenti campi."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Inserire la nuova password da assegnare al Super Utente."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Password (ripeti)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Ripetere la password. Questo ci permette di verificare che non siano stati commessi errori di battitura."

SETUP_HEADER_FINETUNING="Ottimizzazione cartelle"
SETUP_HEADER_FINETUNING_HELP="Joomla! ha bisogno di due cartelle scrivibili per i file temporanei e i log. È possibile definirle qui. Suggerimento: se non sono scrivibili ma si è già abilitato il layer FTP sopra, lo script di ripristino tenterà di renderle scrivibili e proteggerle automaticamente."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Genera un nuovo segreto"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Abilitare questa opzione quando si sposta il sito tra server e/o domini. Genera nuovi segreti nel file di configurazione del sito per prevenire il riutilizzo delle sessioni del vecchio sito. Si noti che il software di terze parti che utilizza i segreti del sito per cifrare le informazioni potrebbe non essere in grado di accedere ai propri dati dopo questa operazione."
SETUP_LABEL_SITEROOT="Radice del sito"
SETUP_LABEL_SITEROOT_HELP="Questo è il percorso della radice del sito. È mostrato per comodità. Fare triplo clic (o tocco prolungato) su di esso per selezionarlo; poi è possibile copiarlo e utilizzarlo nei campi sottostanti."
SETUP_LABEL_TMPPATH="Cartella temporanea"
SETUP_LABEL_TMPPATH_HELP="La cartella in cui Joomla! memorizzerà i dati temporanei. Si consiglia di posizionarla al di fuori della radice del sito. Predefinita: la cartella <code>tmp</code> sotto la radice del sito."
SETUP_LABEL_LOGSPATH="Cartella dei log"
SETUP_LABEL_LOGSPATH_HELP="La cartella in cui Joomla! memorizzerà i file di log. Si consiglia di posizionarla al di fuori della radice del sito. Predefinita: la cartella <code>log</code> sotto la radice del sito."
SETUP_LBL_CACHE_PATH="Cartella della cache"
