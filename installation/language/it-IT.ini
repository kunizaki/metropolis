DATABASE_LBL_SPECIFICTABLES_HELP="Per impostazione predefinita lo script di ripristino ripristinerà tutte le tabelle nel database. Se si desidera ripristinare solo tabelle specifiche, si prega di selezionarle di seguito."
SETUP_LBL_SERVERCONFIG_DISABLEFORCESSL_WARN="Sta ripristinando su un sito non cifrato (HTTP) ma la Configurazione globale indica che il sito dovrebbe essere accessibile tramite una connessione cifrata (HTTPS). Se il sito attuale non supporta HTTPS, si prega di impostare l'opzione seguente su "Nessuno"."

SETUP_LBL_HTACCESSCHANGE_LBL="Gestione .htaccess"
SETUP_LBL_HTACCESSCHANGE_DESC="Scegliere cosa fare con il file <code>.htaccess</code> del sito.<br/><strong>Nessuna modifica</strong>. Il file viene mantenuto com'è.<br/><strong>Usa impostazione predefinita</strong>. Sostituisce il contenuto del file .htaccess nella radice del sito con il contenuto del file htaccess.txt standard fornito con Joomla. Il vecchio file viene rinominato in htaccess.bak<br/><strong>Rimuovi righe gestore PHP</strong> Rimuove le righe AddHandler/SetHandler dal file .htaccess. Si tratta di direttive specifiche del server normalmente usate per applicare una versione specifica di PHP al sito. Da usare quando si ripristina su un server diverso.<br/><strong>Sostituisci righe gestore PHP</strong> Usa le righe AddHandler/SetHandler presenti nel file .htaccess attuale. Da usare se è stato necessario impostare una versione PHP diversa per il sito prima di eseguire Kickstart o la Procedura guidata di trasferimento sito.<br/>"
