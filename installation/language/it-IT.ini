OFFSITEDIRS_LBL_EXPLANATION="<p>Al momento del backup del sito erano presenti alcuni file al di fuori della radice del sito (la cartella principale oggetto del backup). I file in questione si trovavano nella cartella <code>%s</code>.</p><p>Questi file sono attualmente estratti in <code>%s</code>, che <em>non</em> è il percorso corretto per il funzionamento del sito. Si tratta di una posizione temporanea resa necessaria dal fatto che l'estrazione di un archivio non può creare file <em>al di sopra</em> della cartella in cui si sta estraendo. È quindi necessario spostare questi file affinché il sito funzioni.</p><p>È possibile fornire il percorso assoluto della posizione del filesystem dove devono essere copiati. Per informazione, il sito è attualmente estratto nel percorso assoluto del filesystem <code>%s</code>.</p>"
