SETUP_HEADER_SERVERCONFIG="File di configurazione specifici del server"
SETUP_SERVERCONFIG_DESCR="I file che modificano il comportamento del server nel gestire le richieste per il sito potrebbero causare problemi di caricamento durante il ripristino su un nuovo hosting. Utilizzare le opzioni di seguito per reimpostarli ai valori predefiniti di Joomla!."
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI="Rimuovi i file .user.ini e / o php.ini dalle cartelle principali del sito"
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI_HELP="Rinomina i file di configurazione PHP <strong>.user.ini</strong> e <strong>php.ini</strong> nella cartella radice del sito e nella cartella dell'amministratore. I file rinominati avranno l'estensione .bak."
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG="Sostituisci il file web.config principale con quello predefinito"
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG_HELP="Sostituisce il contenuto del file web.config nella radice del sito con il contenuto del web.config.txt standard fornito con Joomla. Il vecchio file viene rinominato in web.config.bak"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Elimina i file .htaccess e .htpasswd nella cartella dell'amministratore"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Elimina i file .htaccess e .htpasswd nella cartella dell'amministratore. Abilitare questa opzione se era stata applicata la protezione con password alla cartella dell'amministratore — tramite il pannello di controllo del provider o un'estensione di sicurezza di terze parti come Admin Tools — e si sta ripristinando su un nuovo server che non supporta lo stesso metodo di codifica della password del vecchio server. <strong>IMPORTANTE</strong>: Ricordare di riabilitare la protezione con password per la cartella dell'amministratore al termine del ripristino!"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="I file a cui fa riferimento questa opzione non esistono sul server. Ottimo! Non è necessario occuparsene e questa opzione non è necessaria."

DATABASE_WARN_LARGE_COLUMNS="La riga del database più grande del suo database è %1$0.2f Mb. Tuttavia, è probabile che il server del database sia configurato per accettare solo fino a %3$0.2f Mb (non è possibile verificarlo senza connettersi al server del database). Se si procede con il ripristino del database, è molto probabile che si riceva un codice di errore del database 1153; o un messaggio di errore 'ER_NET_PACKET_TOO_LARGE'; o un messaggio di errore 'Got a packet bigger than 'max_allowed_packet' bytes'. Se ciò accade, si prega di chiedere al provider di impostare il valore della variabile di configurazione <strong>max_allowed_packet</strong> del server del database ad almeno %2$d Mb."


