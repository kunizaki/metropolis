DATABASE_NOCONNECTORS_LBL_STEP_SPECIFIC="Le istruzioni sono specifiche per ogni ambiente di hosting. Di solito è più veloce e più preciso chiedere alle persone che hanno costruito e gestiscono l'ambiente di hosting di fornire istruzioni specifiche."
DATABASE_NOCONNECTORS_LBL_INERROR_HEAD="Posso ricevere questo messaggio per errore?"
DATABASE_NOCONNECTORS_LBL_INERROR_NO="No, non è possibile ricevere questo messaggio per errore."
DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Questo messaggio appare quando PHP segnala che nessuna delle funzioni di connessione al database per i server di database compatibili con MySQL è disponibile."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Si noti che il server potrebbe segnalare che le estensioni sono installate per una versione PHP diversa o un'installazione PHP diversa, come l'installazione PHP separata utilizzata dal pannello di controllo dell'hosting. Questa non è la stessa installazione PHP e/o versione che sta utilizzando per ripristinare il sito."
DATABASE_NOCONNECTORS_LBL_USEOTHER_HEAD="Posso usare una tecnologia di database diversa, ad es. PostgreSQL?"
DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="No, non è possibile."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Le diverse tecnologie di database utilizzano strutture di database, formati di dati, driver di database incompatibili e richiedono codice SQL e PHP scritto in modo diverso. Non è possibile utilizzare un database non MySQL con dati provenienti da e software scritto per un database compatibile con MySQL."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="Funzionerà se reinstallo il sito?"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="No, non funzionerà."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="Il suo CMS deve connettersi al database. L'unico modo per farlo è usare le stesse estensioni PHP. Si troverà quindi con lo stesso problema."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="<em>Potrebbe</em> essere possibile che il suo CMS le consenta di utilizzare una tecnologia di database diversa durante l'installazione di un nuovo sito, ad es. PostgreSQL. Tuttavia, non tutto il software che utilizzava in precedenza sul suo sito sarà in grado di funzionare con esso. Ciò renderà impossibile reimpementare il sito."

