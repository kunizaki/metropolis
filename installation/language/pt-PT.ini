SETUP_SERVERCONFIG_DESCR="Ficheiros que modificam a forma como o seu servidor se comporta ao servir o seu site podem causar problemas de carregamento do site ao restaurar para um novo alojamento. Utilize as opções abaixo para repô-los para os valores predefinidos do Joomla!."
