SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Eliminar os ficheiros .htaccess e .htpasswd no diretório do administrador"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Elimina os ficheiros .htaccess e .htpasswd no diretório do administrador. Ative esta opção se tinha aplicado proteção por palavra-passe ao diretório do administrador — seja através do painel de controlo do seu alojamento ou de uma extensão de segurança de terceiros como o Admin Tools — e está a restaurar para um novo servidor que não suporta o mesmo método de codificação de palavra-passe do seu servidor antigo. <strong>IMPORTANTE</strong>: Lembre-se de reativar a proteção por palavra-passe para o diretório do administrador após a conclusão do restauro!"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="Os ficheiros referenciados por esta opção não existem no seu servidor. Ótimo! Não precisa de os tratar e não precisa desta opção."

DATABASE_WARN_LARGE_COLUMNS="A maior linha da base de dados tem %1$0.2f Mb. No entanto, o seu servidor de base de dados provavelmente está configurado para aceitar apenas até %3$0.2f Mb (não podemos verificar isso sem ligar ao servidor de base de dados). Se prosseguir com o restauro da base de dados, muito provavelmente receberá um código de erro de base de dados 1153; ou uma mensagem de erro 'ER_NET_PACKET_TOO_LARGE'; ou uma mensagem de erro 'Got a packet bigger than 'max_allowed_packet' bytes'. Se isso acontecer, peça ao seu alojamento que defina o valor da variável de configuração <strong>max_allowed_packet</strong> do seu servidor de base de dados para pelo menos %2$d Mb."


