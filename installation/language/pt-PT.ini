DATABASE_HEADER_CONNECTION="Informações de ligação"
DATABASE_LBL_TYPE="Tipo de base de dados"
DATABASE_LBL_TYPE_HELP="Normalmente é MySQLi (<em>com</em> o "i" no final)"
DATABASE_LBL_HOSTNAME="Nome do servidor da base de dados"
DATABASE_LBL_HOSTNAME_HELP="O nome do servidor ou endereço IP do servidor de base de dados (normalmente: localhost). <strong>IMPORTANTE!</strong> <code>localhost</code> e <code>127.0.0.1</code> significam duas coisas diferentes, consulte abaixo. Exemplos de ligação:<ul><li><code>localhost</code></li> Ligar ao localhost através da tomada UNIX predefinida (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Ligar ao localhost via TCP/IP utilizando a porta predefinida (3306).<li><code>127.0.0.1:1234</code></li> Ligar ao localhost via TCP/IP utilizando a porta 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Ligar ao servidor IPv6 no endereço 2607:f0d0:1002:51::4 via TCP/IP utilizando a porta 1234. Nota: todos os endereços IPv6 DEVEM ser colocados entre parênteses retos!</li><li><code>mysql.example.com:1234</code></li> Ligar ao mysql.example.com via TCP/IP utilizando a porta 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Ligar utilizando a tomada UNIX em /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Ligar utilizando o Pipe Nomeado Windows "MySQL" (obviamente só funciona em servidores Windows).</ul>"
DATABASE_LBL_USERNAME="Nome de utilizador"
DATABASE_LBL_USERNAME_HELP="O nome de utilizador que utiliza para ligar à sua base de dados. A maioria dos alojamentos que utilizam cPanel, Plesk e outros painéis de alojamento principais fornecem nomes de utilizador como abcdef_username, onde abcdef é o nome de utilizador do painel de controlo de alojamento. Se tiver dúvidas, consulte o seu alojamento."
DATABASE_LBL_PASSWORD="Palavra-passe"
DATABASE_LBL_PASSWORD_HELP="A palavra-passe que utiliza para ligar à sua base de dados."
DATABASE_LBL_DBNAME="Nome da base de dados"
DATABASE_LBL_DBNAME_HELP="O nome da sua base de dados. A maioria dos alojamentos que utilizam cPanel, Plesk e outros painéis de alojamento principais fornecem nomes de base de dados como <code>abcdef_username</code>, onde <code>abcdef</code> é o nome de utilizador do painel de controlo de alojamento. Se tiver dúvidas, consulte o seu alojamento."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Opções pouco comuns"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="As opções seguintes são utilizadas em configurações MySQL menos comuns e exóticas."
DATABASE_LBL_PORT="Porta da base de dados"
DATABASE_LBL_PORT_HELP="<strong>Opcional</strong>. A porta TCP/IP da base de dados, se diferente da predefinida (3306). Não se aplica se estiver a utilizar o nome do servidor <code>localhost</code> ou uma tomada. Se não sabe o que isto significa, deixe este campo vazio."
DATABASE_LBL_SOCKET="Tomada UNIX / Pipe nomeado Windows"
DATABASE_LBL_SOCKET_HELP="<strong>Opcional</strong>. Se estiver a ligar ao seu servidor de base de dados utilizando uma tomada UNIX (por exemplo, <code>unix:/tmp/mysql.sock</code>) ou um Pipe Nomeado Windows (por exemplo, <code>\\.\MySQL</code>), introduza-o aqui. Se não sabe o que isto significa, deixe este campo vazio."
DATABASE_LBL_DBENCRYPTION="Usar SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Opcional.</strong> Pretende ligar ao MySQL utilizando SSL/TLS? Isto pode ser utilizado para encriptar a ligação à base de dados e opcionalmente para iniciar sessão sem utilizar uma palavra-passe. Precisará de fornecer o caminho do ficheiro de chave e certificado do cliente MySQL. Esta é uma opção muito pouco comum. Se não sabe o que é, ignore esta e as próximas opções."
DATABASE_LBL_DBSSLCIPHER="Cifras SSL"
DATABASE_LBL_DBSSLCIPHER_HELP="Utilizado apenas quando Usar SSL/TLS está ativado. Uma lista separada por dois pontos das cifras de encriptação a utilizar para a ligação SSL/TLS, por exemplo, <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. Se tiver dúvidas, deixe em branco."
DATABASE_LBL_DBSSLCERT="Ficheiro de certificado SSL"
DATABASE_LBL_DBSSLCERT_HELP="Utilizado apenas quando Usar SSL/TLS está ativado. O caminho absoluto do sistema de ficheiros para o ficheiro de certificado do cliente em formato PEM."
DATABASE_LBL_DBSSLKEY="Ficheiro de chave SSL"
DATABASE_LBL_DBSSLKEY_HELP="Utilizado apenas quando Usar SSL/TLS está ativado. O caminho absoluto do sistema de ficheiros para o ficheiro de chave do cliente em formato PEM."
DATABASE_LBL_DBSSLCA="Ficheiro CA SSL"
DATABASE_LBL_DBSSLCA_HELP="Utilizado apenas quando Usar SSL/TLS está ativado. O caminho absoluto do sistema de ficheiros para o ficheiro da Autoridade de Certificação (AC) para ligar ao servidor, em formato PEM. Isto só é tido em conta quando Verificar Certificado do Servidor está ativado."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Verificar certificado do servidor"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Utilizado apenas quando Usar SSL/TLS está ativado. Verifica a resposta do servidor em relação ao ficheiro da Autoridade de Certificação (AC). Deve fornecer o ficheiro AC para que esta opção funcione corretamente. Se o restauro da base de dados falhar consistentemente, tente desativar esta opção."

DATABASE_HEADER_ADVANCED="Opções avançadas"
DATABASE_LBL_EXISTING="Com tabelas existentes"
DATABASE_LBL_EXISTING_HELP="Selecione o que fazer com as tabelas existentes. "Eliminar" apagará as tabelas existentes com os mesmos nomes que as tabelas a restaurar. "Criar cópia de segurança" renomeará as tabelas existentes com os mesmos nomes que as tabelas a restaurar, alterando o seu prefixo para bak_. "Eliminar com mesmo prefixo" eliminará todas as tabelas com o mesmo prefixo, mesmo que não estejam incluídas na cópia de segurança a restaurar. "Eliminar todos" eliminará todas as tabelas, mesmo com um prefixo diferente. As duas últimas opções são PERIGOSAS e devem ser utilizadas com EXTREMA PRECAUÇÃO."
DATABASE_LBL_EXISTING_DROP="Eliminar"
DATABASE_LBL_EXISTING_BACKUP="Criar cópia de segurança"
DATABASE_LBL_EXISTING_DROPPREFIX="Eliminar com mesmo prefixo"
DATABASE_LBL_EXISTING_DROPALL="Eliminar todos"
DATABASE_LBL_PREFIX="Prefixo do nome das tabelas da base de dados"
DATABASE_LBL_PREFIX_HELP="O prefixo de todas as tabelas da base de dados restauradas que tinham um prefixo no momento da cópia de segurança. O prefixo utilizado para a base de dados principal do site também será escrito no ficheiro configuration.php do Joomla!. Tenha em atenção que algumas extensões podem ter comportamentos incorretos ou até bloquear completamente o seu site se alterar o prefixo do nome das tabelas da base de dados ao restaurar / transferir o seu site."
DATABASE_LBL_FOREIGNKEY="Desativar verificação de chaves estrangeiras"
DATABASE_LBL_FOREIGNKEY_HELP="Desativa a verificação de chaves estrangeiras do MySQL durante o restauro. Isto é obrigatório quando está a restaurar uma base de dados que utiliza relações a nível de tabela (chaves estrangeiras). Se tiver dúvidas, deixe esta opção marcada; não causará qualquer problema."
DATABASE_LBL_NOAUTOVALUE="Sem valor automático em zero"
DATABASE_LBL_NOAUTOVALUE_HELP="Permite restaurar tabelas com campos de incremento automático cujo valor é zero. O Magento e o Drupal requerem isso para um restauro correto. NOTA: De acordo com a documentação do MySQL: "Armazenar 0 não é uma prática recomendada.""
DATABASE_LBL_REPLACE="Usar REPLACE em vez de INSERT"
DATABASE_LBL_REPLACE_HELP="O script de restauro normalmente usa comandos INSERT para restaurar os dados da base de dados. Isto não funciona bem com os dados de determinadas extensões, causando problemas no restauro. Se obtiver erros no restauro da base de dados, marque esta caixa e clique novamente no botão Seguinte."
DATABASE_LBL_FORCEUTF8DB="Forçar ordenação UTF-8 na base de dados"
DATABASE_LBL_FORCEUTF8DB_HELP="Quando marcado, o script de restauro tentará converter a ordenação predefinida da sua tabela para Unicode (UTF-8), conforme sugerido pelo Joomla!. Isto não funciona em todos os servidores. Marque se obtiver pontos de interrogação ou texto incorreto em vez de caracteres internacionais."
DATABASE_LBL_FORCEUTF8TABLES="Forçar ordenação UTF-8 nas tabelas"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Quando marcado, o script de restauro tentará converter todos os campos de texto das tabelas restauradas para Unicode (UTF-8). Isto é uma solução alternativa quando não consegue utilizar a opção acima. Tenha em atenção que se a ordenação da sua base de dados for diferente de UTF-8, <em>terá</em> problemas no futuro, quando uma atualização de extensão adicionar um novo campo de texto."
DATABASE_LBL_UTF8MB4DETECT="Permitir deteção automática de UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Se ativado e o seu servidor de base de dados suportar UTF8MB4 (UTF-8 Multibyte), este será utilizado em vez do UTF-8 simples. AVISO: Utilize apenas se o seu site estava a utilizar UTF8MB4 quando fez a cópia de segurança. Desmarque esta opção se obtiver texto incorreto após restaurar o seu site!"
DATABASE_LBL_CHARSET_CONVERSION="Normalizar conjunto de caracteres"
DATABASE_LBL_CHARSET_CONVERSION_YES="Ativado"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Deteção automática (recomendado)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Desativado"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Controla a normalização da ordenação ao restaurar entre diferentes plataformas ou famílias de versões de base de dados (por exemplo, MariaDB para MySQL). <strong>Deteção automática</strong>: a conversão do conjunto de caracteres é aplicada automaticamente quando o script de restauro determina que a cópia de segurança foi criada numa plataforma ou família de versões de base de dados diferente da do servidor de destino. <strong>Ativado</strong>: normaliza sempre as ordenações independentemente da plataforma. <strong>Desativado</strong>: nunca normaliza as ordenações; utilize isto apenas quando tem a certeza de que está a restaurar para exatamente o mesmo fabricante de servidor de base de dados (MySQL vs MariaDB) e família de versões."

DATABASE_HEADER_FINETUNING="Ajuste fino"
DATABASE_MSG_FINETUNING="Altere estas definições apenas se for solicitado pelo nosso suporte, ou se o restauro da base de dados parecer ficar bloqueado. Definir os valores 5 e 2000 nos campos abaixo resultará num restauro muito mais lento, mas com menor probabilidade de falhar em alojamentos baratos e pouco fiáveis."
DATABASE_LBL_MAXEXECTIME="Tempo máximo de execução"
DATABASE_LBL_MAXEXECTIME_HELP="O script de restauro divide o processo de restauro da base de dados em pequenos fragmentos de processamento para evitar tempos limite do servidor. Este valor determina quanto tempo cada um desses fragmentos demorará. Pode ter de modificar este valor se o restauro da base de dados não terminar. O valor predefinido é 10 segundos."
DATABASE_LBL_THROTTLEMSEC="Tempo de limitação"
DATABASE_LBL_THROTTLEMSEC_HELP="O script de restauro pode opcionalmente limitar a taxa do processo de restauro da base de dados em servidores com comportamento muito instável. Pode introduzir o tempo de limitação entre fragmentos de processamento em milissegundos (1/1000 de segundo). Por exemplo, para adicionar um tempo de limitação de 5 segundos entre passos, introduza 5000 nesta caixa. O valor predefinido de 250 deve funcionar na maioria dos servidores."

DATABASE_LBL_ON_CREATE_ERROR="Parar em erro de criação"
DATABASE_LBL_ON_CREATE_ERROR_HELP="O restauro deve ser imediatamente interrompido se houver um erro ao criar uma tabela, vista, função, gatilho ou procedimento armazenado? Se não estiver marcado, tais erros serão ignorados e o restauro prosseguirá com possível corrupção de dados e/ou problemas no site restaurado."
DATABASE_LBL_ON_OTHER_ERROR="Parar noutro erro"
DATABASE_LBL_ON_OTHER_ERROR_HELP="O restauro deve ser imediatamente interrompido se houver um erro ao executar qualquer outro comando de base de dados, como restaurar ou eliminar dados? Se não estiver marcado, tais erros serão ignorados e o restauro prosseguirá com possível corrupção de dados e/ou problemas no site restaurado."

DATABASE_HEADER_DBRESTORE="Restauro da base de dados"
DATABASE_LBL_RESTORATION_PROGRESS="Progresso do restauro"
DATABASE_LBL_RESTORED="Restaurado"
DATABASE_LBL_TOTAL="Tamanho total"
DATABASE_LBL_ETA="Tempo restante estimado"

DATABASE_HEADER_SUCCESS="O restauro da base de dados foi bem-sucedido"
DATABASE_HEADER_WARNINGS="O restauro da base de dados foi concluído mas algumas consultas falharam"
DATABASE_MSG_WARNINGS="O seu site restaurado pode não funcionar corretamente a menos que corrija estes problemas manualmente. Por favor reveja as consultas falhadas e a razão pela qual falharam consultando o ficheiro de registo:"
DATABASE_MSG_SUCCESS="Clique no botão abaixo para prosseguir para o próximo passo"
DATABASE_BTN_SUCCESS="Próximo passo"

DATABASE_HEADER_INPROGRESS_WARNINGS="Algumas consultas falharam"
DATABASE_MSG_INPROGRESS_WARNINGS="Algumas consultas SQL falharam ao executar, mas optou por ignorá-las. Pode revê-las e a razão do seu falhanço após o fim do restauro consultando o seguinte ficheiro de registo:"

DATABASE_HEADER_ERROR="Ocorreu um erro ao restaurar a base de dados. A mensagem de erro pode ser encontrada abaixo. Clique no botão &times; no canto superior direito deste diálogo para o fechar e regressar à página de restauro da base de dados."
DATABASE_ERR_INVALIDKEY="Chave de base de dados inválida"

DATABASE_ERR_COMPLEXPASSWORD="!!! AVISO !!!\n\nA sua palavra-passe da base de dados contém caracteres especiais. Muitos servidores web rejeitam ou modificam estas palavras-passe, causando o falhanço do restauro da base de dados com um erro de ligação.\n\nRecomendamos MUITO VIVAMENTE que altere a sua palavra-passe da base de dados para uma cadeia de caracteres aleatória longa (32 caracteres ou mais) composta APENAS por letras maiúsculas A-Z, letras minúsculas a-z e números 0-9.\n\nDeseja ignorar o aviso e prosseguir com o restauro da base de dados por sua conta e risco?"
DATABASE_ERR_UPPERCASEPREFIX="!!! AVISO !!!\n\nO prefixo do nome das tabelas da base de dados contém um ou mais caracteres maiúsculos. Isto pode causar problemas graves no site restaurado e/ou tornar impossível restaurar o seu site noutro servidor. Isto acontece devido à forma como o MySQL trata as letras maiúsculas e não pode ser efetivamente contornado, de acordo com a documentação do MySQL.\n\nRecomendamos MUITO VIVAMENTE que utilize um prefixo do nome das tabelas da base de dados totalmente em minúsculas.\n\nDeseja ignorar o aviso e prosseguir com o restauro da base de dados por sua conta e risco?"
DATABASE_ERR_EMPTY_INFO="!!! AVISO !!!\n\nNão preencheu todos os campos obrigatórios (nome do servidor da base de dados, nome da base de dados, nome de utilizador da base de dados, palavra-passe da base de dados e prefixo do nome das tabelas). Isto muito provavelmente causará um erro ao tentar ligar à base de dados e/ou no site restaurado.\n\nTem A CERTEZA ABSOLUTA de que é mesmo isto que pretende fazer?"

DATABASE_HEADER_RESTORERETRY="Restauro Interrompido e Será Retomado Automaticamente"
DATABASE_LBL_RESTOREFAILEDRETRY="O restauro da base de dados foi interrompido porque foi detetado um erro. No entanto, o script de restauro tentará retomar o processo. Se não quiser retomar o restauro, clique no botão Cancelar abaixo."
DATABASE_LBL_WILLRETRY="O restauro será retomado em"
DATABASE_LBL_WILLRETRYSECONDS="segundos"
DATABASE_LBL_CANCEL="Cancelar"
DATABASE_LBL_BTNRESUME="Retomar"
DATABASE_LBL_LASTERRORMESSAGEWAS="A título informativo, a última mensagem de erro foi:"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="O erro recebido foi:"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="Como resolver este erro"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Informação de depuração"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Mostrar / Ocultar"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Por favor inclua esta informação no seu pedido de suporte se precisar de mais assistência. Diga-nos quais os passos de resolução de problemas que já tentou."

DATABASE_RESTORE_DBNAME_HEAD="Nome da base de dados incorreto ou sem acesso à base de dados"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="O servidor de base de dados reporta que o nome do servidor, nome de utilizador e palavra-passe da base de dados estão corretos, mas não consegue ligar à base de dados especificada na opção "Nome da base de dados". Isto significa que a base de dados não existe <em>ou</em> que não concedeu ao utilizador da base de dados acesso a esta base de dados."
DATABASE_RESTORE_DBUSER_HEAD="Informações de ligação à base de dados incorretas"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="Não foi possível ligar ao seu servidor de base de dados utilizando o nome do servidor, nome de utilizador e palavra-passe fornecidos."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Verifique o nome do servidor da base de dados. Lembre-se que <code>localhost</code> e <code>127.0.0.1</code> têm significados diferentes ao ligar a uma base de dados."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Verifique o nome da base de dados e o nome de utilizador da base de dados. A maioria dos alojamentos coloca como prefixo do nome da base de dados o nome de utilizador da conta de alojamento. Se tiver dúvidas, consulte o seu alojamento."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Verifique a sua palavra-passe. As maiúsculas e minúsculas importam: ABC, abc e Abc são três palavras-passe <em>diferentes</em>."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Se estiver a copiar ou mover o seu site, certifique-se de que introduz as informações de ligação à base de dados do novo site."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Se ainda não tem uma base de dados, terá de criar uma. A maioria dos alojamentos não permite que este script de restauro crie uma nova base de dados por razões de segurança."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Se criou uma nova base de dados, certifique-se de que também criou um utilizador da base de dados <strong>e</strong> atribuiu o utilizador à base de dados, concedendo-lhe todos os privilégios na base de dados."

; ==============================================================================
; Site setup
; ==============================================================================
SETUP_HEADER_SITEPARAMS="Parâmetros do Site"
SETUP_HEADER_SITEPARAMS_HELP="Estes são os parâmetros básicos do seu site. Pode sempre modificá-los após a conclusão do restauro a partir do back-end do seu site, em Configuração Global."
SETUP_LBL_SITENAME="Nome do site"
SETUP_LBL_SITENAME_HELP="O nome do seu site, utilizado nas páginas HTML do site, entre outras coisas."
SETUP_LBL_SITEEMAIL="Endereço de e-mail do site"
SETUP_LBL_SITEEMAIL_HELP="O endereço de e-mail do qual aparentarão ser provenientes os e-mails do seu site."
SETUP_LBL_EMAILSENDER="Nome do remetente do e-mail do site"
SETUP_LBL_EMAILSENDER_HELP="O nome do remetente utilizado em todos os e-mails enviados pelo seu site."
SETUP_LBL_LIVESITE="URL do site"
SETUP_LBL_LIVESITE_HELP="Alguns servidores têm dificuldade em determinar o URL do seu site, o que pode fazer com que os URLs SEF e itens de menu não funcionem. Nesses servidores tem de introduzir o URL do seu site sem a barra final, por exemplo, <code>http://www.example.com</code>. Na maioria dos casos não é necessário e pode deixar este campo vazio."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="AVISO! O seu servidor web está a funcionar no Windows. Preencher o URL do site ao executar um site no Windows tornará impossível iniciar sessão na área de administração do seu site devido a um erro no Joomla!. Por favor deixe esta caixa em branco."
SETUP_LBL_USESITEDIRS="Substituir caminhos de tmp e log"
SETUP_LBL_USESITEDIRS_HELP="O script de restauro utilizará por predefinição os caminhos tmp e log já configurados na Configuração Global do site com cópia de segurança. Se estiver a restaurar para um servidor diferente ou a clonar o seu site, isso pode causar problemas. Neste caso, ou se tiver dúvidas, clique no botão — o script de restauro preencherá os caminhos do Diretório Temporário e de Registos com valores adequados para o site para o qual está a restaurar. Pode alterar estes caminhos na secção Ajuste Fino dos Diretórios abaixo."
SETUP_LBL_USESITEDIRS_51="Substituir caminhos de tmp, log e cache"
SETUP_LBL_USESITEDIRS_HELP_51="O script de restauro utilizará por predefinição os caminhos tmp, log e cache já configurados na Configuração Global do site com cópia de segurança. Se estiver a restaurar para um servidor diferente ou a clonar o seu site, isso pode causar problemas. Neste caso, ou se tiver dúvidas, clique no botão — o script de restauro preencherá os caminhos do Diretório Temporário e de Registos com valores adequados para o site para o qual está a restaurar, e reverterá o Diretório de Cache para uma cadeia vazia (o que diz ao Joomla! para utilizar a pasta <code>administrator/cache</code>). Pode alterar estes caminhos na secção Ajuste Fino dos Diretórios abaixo."
SETUP_LBL_COOKIEDOMAIN="Domínio do cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="O domínio do cookie é o nome de domínio do seu site, sem o protocolo e, normalmente, sem a parte www. Por exemplo, se estiver a restaurar para http://www.example.com, o domínio do cookie é example.com (reforçamos: NÃO há http:// aí!!)."
SETUP_LBL_COOKIEPATH="Caminho do cookie"
SETUP_LBL_COOKIEPATH_HELP="O caminho do cookie é o subdiretório do seu site, relativo à raiz do domínio. Se estiver a restaurar para a raiz de um domínio, por exemplo, http://www.example.com, então é / (uma única barra para a frente). Se estiver a restaurar para um subdiretório é uma barra seguida do nome do diretório. Por exemplo, se estiver a restaurar para http://www.example.com/joomla, então o caminho do cookie é /joomla (COM uma barra inicial, mas SEM uma barra final)."

SETUP_HEADER_FTPPARAMS="Opções da Camada FTP"
SETUP_HEADER_FTPPARAMS_HELP="Estas são definições opcionais que permitem ao Joomla! utilizar FTP para escrever em ficheiros e diretórios de outra forma não graváveis. Normalmente só é necessário em alojamentos partilhados. Consulte o texto de ajuda das opções para mais informações."
SETUP_LABEL_FTPENABLE="Ativar a camada FTP"
SETUP_LABEL_FTPENABLE_HELP="Alguns alojamentos partilhados tornam impossível ao PHP escrever em ficheiros e diretórios carregados por FTP. Se estiver num desses alojamentos e tiver utilizado a opção de extração por FTP ou a opção de Carregamento por FTP do Kickstart, deverá configurar e ativar a camada FTP."
SETUP_LABEL_FTPHOST="Nome do servidor"
SETUP_LABEL_FTPHOST_HELP="O nome do servidor ou endereço IP do seu servidor FTP <b>sem</b> o especificador de protocolo ftp://. Normalmente é localhost ou 127.0.0.1. Se tiver dúvidas, consulte o seu alojamento."
SETUP_LABEL_FTPPORT="Porta"
SETUP_LABEL_FTPPORT_HELP="A porta TCP onde o servidor FTP escuta. Normalmente é 21. Se tiver dúvidas, defina como 21 ou consulte o seu alojamento."
SETUP_LABEL_FTPUSER="Nome de utilizador"
SETUP_LABEL_FTPUSER_HELP="O nome de utilizador que utiliza para ligar ao FTP. Se tiver dúvidas, consulte o seu alojamento."
SETUP_LABEL_FTPPASS="Palavra-passe"
SETUP_LABEL_FTPPASS_HELP="A palavra-passe que utiliza para ligar ao FTP. Se tiver dúvidas, consulte o seu alojamento."
SETUP_LABEL_FTPDIR="Diretório"
SETUP_LABEL_FTPDIR_HELP="O diretório FTP onde os ficheiros do seu site (como index.php) podem ser encontrados. Se tiver dúvidas, consulte o seu alojamento."

SETUP_HEADER_SUPERUSERPARAMS="Definições do Super Utilizador"
SETUP_HEADER_SUPERUSERPARAMS_HELP="O script de restauro restaura o seu site com o Super Utilizador que foi incluído na cópia de segurança do site original. Pode opcionalmente selecionar um (e apenas um) Super Utilizador nesta página e alterar o seu endereço de e-mail e palavra-passe. Isto é extremamente útil quando está a clonar um site."
SETUP_LABEL_SUPERUSER="Super Utilizador"
SETUP_LABEL_SUPERUSER_HELP="Pode opcionalmente selecionar uma conta de Super Utilizador cujo e-mail e/ou palavra-passe será alterado no site restaurado. <b>Apenas o Super Utilizador selecionado será modificado.</b> Se não quiser fazer isso, deixe na seleção predefinida de "—" que não modifica nenhuma conta de utilizador."
SETUP_LABEL_SUPERADMIN="Administrador"
SETUP_LABEL_SUPERUSEREMAIL="E-mail"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Introduza o endereço de e-mail do Super Utilizador. Certifique-se de que não está a ser utilizado por outro utilizador no site, caso contrário o seu site restaurado ficará com problemas!"
SETUP_LABEL_SUPERUSERPASSWORD="Palavra-passe"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Introduza a nova palavra-passe a atribuir ao Super Utilizador. Se não quiser alterar a palavra-passe do Super Utilizador, deixe este e os campos seguintes em branco."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Introduza a nova palavra-passe a atribuir ao Super Utilizador."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Palavra-passe (repetir)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Repita a palavra-passe. Isto permite-nos verificar que não cometeu um erro de digitação acima."

SETUP_HEADER_FINETUNING="Ajuste fino dos diretórios"
SETUP_HEADER_FINETUNING_HELP="O Joomla! precisa de dois diretórios com permissão de escrita para os seus ficheiros temporários e registos. Pode defini-los aqui. Dica: se não tiverem permissão de escrita mas já ativou a camada FTP acima, o script de restauro tentará torná-los graváveis e protegê-los automaticamente."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Gerar um novo segredo"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Ative quando mover o seu site entre servidores e/ou domínios. Gera novos segredos no ficheiro de configuração do seu site para evitar a reutilização de sessão do site antigo. Note que software de terceiros que utilize os segredos do site para encriptar informação pode não conseguir aceder aos seus dados quando fizer isso."
SETUP_LABEL_SITEROOT="Raiz do site"
SETUP_LABEL_SITEROOT_HELP="Este é o caminho para a raiz do seu site. É apresentado para sua conveniência. Clique três vezes (ou toque prolongado) para o selecionar; pode então copiá-lo e utilizá-lo nos campos abaixo."
SETUP_LABEL_TMPPATH="Diretório temporário"
SETUP_LABEL_TMPPATH_HELP="O diretório onde o Joomla! armazenará dados temporários. Recomendamos colocá-lo fora da raiz do seu site. Predefinição: o diretório <code>tmp</code> na raiz do seu site."
SETUP_LABEL_LOGSPATH="Diretório de registos"
SETUP_LABEL_LOGSPATH_HELP="O diretório onde o Joomla! armazenará os seus ficheiros de registo. Recomendamos colocá-lo fora da raiz do seu site. Predefinição: o diretório <code>log</code> na raiz do seu site."
SETUP_LBL_CACHE_PATH="Diretório de cache"
SETUP_LBL_CACHE_PATH_HELP="O diretório onde o Joomla! armazenará os seus ficheiros de cache temporários. Recomendamos colocá-lo fora da raiz do seu site. Se deixar este campo vazio, será utilizado o diretório <code>administrator/cache</code> na raiz do seu site (valor predefinido e recomendado). NOTA: O Joomla! utilizará sempre <code>administrator/cache</code> para o seu ficheiro <code>autoload_psr4.php</code> a menos que a constante <code>JPATH_CACHE</code> seja substituída."

