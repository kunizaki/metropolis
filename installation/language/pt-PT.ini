DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="Não, não pode."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Tecnologias de base de dados diferentes utilizam estruturas de base de dados, formatos de dados, controladores de base de dados incompatíveis e requerem código SQL e PHP escrito de forma diferente. Não pode utilizar uma base de dados não-MySQL com dados provenientes de e software escrito para uma base de dados compatível com MySQL."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="Funcionará se reinstalar o meu site?"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="Não, não funcionará."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="O seu CMS também precisa de ligar à base de dados. A única forma de o fazer é utilizando as mesmas extensões PHP. Acabará, portanto, com o mesmo problema."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="<em>Pode</em> ser possível que o seu CMS permita utilizar uma tecnologia de base de dados diferente ao instalar um novo site, por exemplo, PostgreSQL. No entanto, nem todo o software que utilizava anteriormente no seu site poderá funcionar com ela. Isso tornará impossível reimplementar o seu site."

