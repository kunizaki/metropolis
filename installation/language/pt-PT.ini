SETUP_LBL_HTACCESSCHANGE_LBL="Gestão do .htaccess"
SETUP_LBL_HTACCESSCHANGE_DESC="Escolha o que fazer com o ficheiro <code>.htaccess</code> do seu site.<br/><strong>Sem alteração</strong>. O ficheiro é mantido como está.<br/><strong>Usar predefinição</strong>. Substitui o conteúdo do ficheiro .htaccess na raiz do seu site pelo conteúdo do htaccess.txt padrão fornecido com o Joomla. O ficheiro antigo é renomeado para htaccess.bak<br/><strong>Remover linhas de manipulador PHP</strong> Remove quaisquer linhas AddHandler/SetHandler do seu ficheiro .htaccess. Estas são diretivas específicas do servidor tipicamente utilizadas para aplicar uma versão específica de PHP ao seu site. Use ao restaurar para um servidor diferente.<br/><strong>Substituir linhas de manipulador PHP</strong> Usa as linhas AddHandler/SetHandler no seu ficheiro .htaccess atual. Use isto se teve de definir uma versão de PHP diferente para o seu site antes de executar o Kickstart ou o Assistente de Transferência de Site.<br/>"
