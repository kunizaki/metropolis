DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Esta mensagem aparece quando o PHP reporta que nenhuma das funções de ligação a bases de dados para servidores de base de dados compatíveis com MySQL está disponível."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Note que o seu servidor pode estar a reportar que as extensões estão instaladas para uma versão de PHP diferente ou instalação de PHP diferente, como a instalação de PHP separada utilizada pelo painel de controlo de alojamento. Esta não é a mesma instalação e/ou versão de PHP que está a utilizar para restaurar o seu site."
