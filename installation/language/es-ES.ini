DATABASE_HEADER_CONNECTION="Información de conexión"
DATABASE_LBL_TYPE="Tipo de base de datos"
DATABASE_LBL_TYPE_HELP="Normalmente es MySQLi (<em>con</em> la «i» al final)"
DATABASE_LBL_HOSTNAME="Nombre del servidor de la base de datos"
DATABASE_LBL_HOSTNAME_HELP="El nombre del servidor o la dirección IP del servidor de base de datos (normalmente: localhost). <strong>¡IMPORTANTE!</strong> <code>localhost</code> y <code>127.0.0.1</code> significan dos cosas diferentes; véase a continuación. Ejemplos de conexión:<ul><li><code>localhost</code></li> Conectarse a localhost a través del socket UNIX predeterminado (/tmp/mysql.sock).<li><code>127.0.0.1</code></li> Conectarse a localhost a través de TCP/IP usando el puerto predeterminado (3306).<li><code>127.0.0.1:1234</code></li> Conectarse a localhost a través de TCP/IP usando el puerto 1234.<li><code>[2607:f0d0:1002:51::4]:1234</code> Conectarse a un servidor IPv6 en la dirección 2607:f0d0:1002:51::4 a través de TCP/IP usando el puerto 1234. Nota: todas las direcciones IPv6 DEBEN encerrarse entre corchetes.</li><li><code>mysql.example.com:1234</code></li> Conectarse a mysql.example.com a través de TCP/IP usando el puerto 1234.<li><code>unix:/var/mysql/mysql.sock</code></li> Conectarse usando el socket UNIX en /var/mysql/mysql.sock.<li><code>\\.\MySQL</code></li> Conectarse usando el conducto con nombre de Windows «MySQL» (solo funciona en servidores Windows).</ul>"
DATABASE_LBL_USERNAME="Nombre de usuario"
DATABASE_LBL_USERNAME_HELP="El nombre de usuario que utiliza para conectarse a su base de datos. La mayoría de los proveedores de alojamiento que usan cPanel, Plesk y otros paneles de control principales asignan nombres de usuario como abcdef_username, donde abcdef es su nombre de usuario en el panel de control del alojamiento. Si no está seguro, consulte a su proveedor de alojamiento."
DATABASE_LBL_PASSWORD="Contraseña"
DATABASE_LBL_PASSWORD_HELP="La contraseña que utiliza para conectarse a su base de datos."
DATABASE_LBL_DBNAME="Nombre de la base de datos"
DATABASE_LBL_DBNAME_HELP="El nombre de su base de datos. La mayoría de los proveedores de alojamiento que usan cPanel, Plesk y otros paneles de control principales asignan nombres de base de datos como <code>abcdef_username</code>, donde <code>abcdef</code> es su nombre de usuario en el panel de control del alojamiento. Si no está seguro, consulte a su proveedor de alojamiento."

DATABASE_LBL_UNCOMMON_OPTIONS_HEADER="Opciones poco comunes"
DATABASE_LBL_UNCOMMON_OPTIONS_INFO="Las siguientes opciones se usan en configuraciones de MySQL menos comunes y exóticas."
DATABASE_LBL_PORT="Puerto de la base de datos"
DATABASE_LBL_PORT_HELP="<strong>Opcional</strong>. El puerto TCP/IP de la base de datos, si es diferente del predeterminado (3306). Esto no se aplica si usa el nombre del servidor <code>localhost</code> o un socket. Si no sabe qué significa esto, deje este campo vacío."
DATABASE_LBL_SOCKET="Socket UNIX / Conducto con nombre de Windows"
DATABASE_LBL_SOCKET_HELP="<strong>Opcional</strong>. Si se está conectando a su servidor de base de datos mediante un socket UNIX (por ejemplo, <code>unix:/tmp/mysql.sock</code>) o un conducto con nombre de Windows (por ejemplo, <code>\\.\MySQL</code>), introdúzcalo aquí. Si no sabe qué significa esto, deje este campo vacío."
DATABASE_LBL_DBENCRYPTION="Usar SSL/TLS"
DATABASE_LBL_DBENCRYPTION_HELP="<strong>Opcional.</strong> ¿Desea conectarse a MySQL usando SSL/TLS? Esto puede usarse para cifrar la conexión a la base de datos y, opcionalmente, para iniciar sesión en ella sin usar una contraseña. Deberá proporcionar la ruta de la clave de cliente MySQL y el archivo de certificado. Esta es una opción muy poco común. Si no sabe qué es esto, ignore esta opción y las siguientes."
DATABASE_LBL_DBSSLCIPHER="Cifrados SSL"
DATABASE_LBL_DBSSLCIPHER_HELP="Solo se usa cuando está habilitada la opción Usar SSL/TLS. Una lista separada por dos puntos de los cifrados de encriptación a usar para la conexión SSL/TLS, por ejemplo: <code>AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-CBC-SHA256:AES256-CBC-SHA384:DES-CBC3-SHA</code>. Si no está seguro, déjelo en blanco."
DATABASE_LBL_DBSSLCERT="Archivo de certificado SSL"
DATABASE_LBL_DBSSLCERT_HELP="Solo se usa cuando está habilitada la opción Usar SSL/TLS. La ruta absoluta del sistema de archivos al archivo de certificado del cliente en formato PEM."
DATABASE_LBL_DBSSLKEY="Archivo de clave SSL"
DATABASE_LBL_DBSSLKEY_HELP="Solo se usa cuando está habilitada la opción Usar SSL/TLS. La ruta absoluta del sistema de archivos al archivo de clave del cliente en formato PEM."
DATABASE_LBL_DBSSLCA="Archivo CA de SSL"
DATABASE_LBL_DBSSLCA_HELP="Solo se usa cuando está habilitada la opción Usar SSL/TLS. La ruta absoluta del sistema de archivos al archivo de la Autoridad de Certificación (CA) para conectarse al servidor, en formato PEM. Esto solo se tiene en cuenta cuando está habilitada la opción Verificar certificado del servidor."
DATABASE_LBL_DBSSLVERIFYSERVERCERT="Verificar certificado del servidor"
DATABASE_LBL_DBSSLVERIFYSERVERCERT_HELP="Solo se usa cuando está habilitada la opción Usar SSL/TLS. Verifica la respuesta del servidor con el archivo de la Autoridad de Certificación (CA). Debe proporcionar el archivo CA para que esta opción funcione correctamente. Si la restauración de su base de datos falla repetidamente, intente desactivar esta opción."

DATABASE_HEADER_ADVANCED="Opciones avanzadas"
DATABASE_LBL_EXISTING="Con tablas existentes"
DATABASE_LBL_EXISTING_HELP="Seleccione qué hacer con las tablas existentes. «Eliminar» borrará las tablas existentes con los mismos nombres que las tablas que se van a restaurar. «Hacer copia de seguridad» renombrará las tablas existentes con los mismos nombres que las tablas que se van a restaurar, cambiando su prefijo a bak_. «Eliminar con mismo prefijo» eliminará todas las tablas con el mismo prefijo, incluso si no están incluidas en la copia de seguridad que se está restaurando. «Eliminar todo» eliminará todas las tablas, incluso con un prefijo diferente. Las dos últimas opciones son PELIGROSAS y deben usarse con EXTREMA PRECAUCIÓN."
DATABASE_LBL_EXISTING_DROP="Eliminar"
DATABASE_LBL_EXISTING_BACKUP="Hacer copia de seguridad"
DATABASE_LBL_EXISTING_DROPPREFIX="Eliminar con mismo prefijo"
DATABASE_LBL_EXISTING_DROPALL="Eliminar todo"
DATABASE_LBL_PREFIX="Prefijo del nombre de tablas de la base de datos"
DATABASE_LBL_PREFIX_HELP="El prefijo de todas las tablas de base de datos restauradas que tenían un prefijo en el momento de la copia de seguridad. El prefijo utilizado para la base de datos principal del sitio también se escribirá en su archivo configuration.php de Joomla!. Tenga en cuenta que algunas extensiones pueden funcionar incorrectamente o incluso provocar el fallo completo de su sitio si cambia el prefijo del nombre de las tablas de la base de datos al restaurar o transferir su sitio."
DATABASE_LBL_FOREIGNKEY="Suprimir comprobación de claves foráneas"
DATABASE_LBL_FOREIGNKEY_HELP="Deshabilita la comprobación de claves foráneas de MySQL mientras la restauración está en curso. Esto es obligatorio cuando está restaurando una base de datos que usa relaciones a nivel de tabla (claves foráneas). Si no está seguro, deje esta opción marcada; no causará ningún problema."
DATABASE_LBL_NOAUTOVALUE="Sin valor automático en cero"
DATABASE_LBL_NOAUTOVALUE_HELP="Le permite restaurar tablas con campos de auto-incremento cuyo valor es cero. Magento y Drupal lo requieren para una restauración correcta. NOTA: Según la documentación de MySQL: «Almacenar 0 no es una práctica recomendada»."
DATABASE_LBL_REPLACE="Usar REPLACE en lugar de INSERT"
DATABASE_LBL_REPLACE_HELP="El script de restauración normalmente usa comandos INSERT para restaurar los datos de la base de datos. Esto no funciona bien con los datos de ciertas extensiones, provocando problemas en la restauración. Si recibe errores en la restauración de la base de datos, marque esta casilla y haga clic de nuevo en el botón Siguiente."
DATABASE_LBL_FORCEUTF8DB="Forzar ordenación UTF-8 en la base de datos"
DATABASE_LBL_FORCEUTF8DB_HELP="Cuando está marcada, el script de restauración intentará convertir la ordenación predeterminada de su tabla a Unicode (UTF-8), tal como sugiere Joomla!. Esto no funciona en todos los servidores. Márquela si aparecen signos de interrogación o texto incorrecto en lugar de caracteres internacionales."
DATABASE_LBL_FORCEUTF8TABLES="Forzar ordenación UTF-8 en las tablas"
DATABASE_LBL_FORCEUTF8TABLES_HELP="Cuando está marcada, el script de restauración intentará convertir todos los campos de texto de las tablas restauradas a Unicode (UTF-8). Esto es una solución alternativa cuando no puede usar la opción anterior. Tenga en cuenta que si la ordenación de su base de datos es distinta de UTF-8, <em>tendrá</em> problemas en el futuro cuando una actualización de extensión añada un nuevo campo de texto."
DATABASE_LBL_UTF8MB4DETECT="Permitir detección automática de UTF8MB4"
DATABASE_LBL_UTF8MB4DETECT_HELP="Si está habilitada y su servidor de base de datos admite UTF8MB4 (UTF-8 multibyte), se usará en lugar del UTF-8 estándar. ADVERTENCIA: Solo úsela si su sitio usaba UTF8MB4 cuando realizó la copia de seguridad. ¡Desmarque esta opción si aparece texto incorrecto después de restaurar su sitio!"
DATABASE_LBL_CHARSET_CONVERSION="Normalizar juego de caracteres"
DATABASE_LBL_CHARSET_CONVERSION_YES="Habilitado"
DATABASE_LBL_CHARSET_CONVERSION_AUTO="Detección automática (recomendado)"
DATABASE_LBL_CHARSET_CONVERSION_NO="Deshabilitado"
DATABASE_LBL_CHARSET_CONVERSION_HELP="Controla la normalización de ordenación al restaurar entre diferentes plataformas de base de datos o familias de versiones (por ejemplo, de MariaDB a MySQL). <strong>Detección automática</strong>: la conversión del juego de caracteres se aplica automáticamente cuando el script de restauración determina que la copia de seguridad fue creada en una plataforma de base de datos o familia de versiones diferente al servidor de destino. <strong>Habilitado</strong>: normaliza siempre las ordenaciones independientemente de la plataforma. <strong>Deshabilitado</strong>: nunca normaliza las ordenaciones; use esto solo cuando tenga la certeza de que está restaurando en exactamente el mismo tipo de servidor de base de datos (MySQL frente a MariaDB) y la misma familia de versiones."

DATABASE_HEADER_FINETUNING="Ajuste fino"
DATABASE_MSG_FINETUNING="Solo cambie estos ajustes si nuestro soporte se lo solicita, o si la restauración de la base de datos parece quedarse bloqueada. Establecer los valores 5 y 2000 en los campos de abajo dará como resultado una restauración mucho más lenta, pero con menos probabilidades de fallar en alojamientos económicos y poco fiables."
DATABASE_LBL_MAXEXECTIME="Tiempo máximo de ejecución"
DATABASE_LBL_MAXEXECTIME_HELP="El script de restauración divide el proceso de restauración de la base de datos en pequeños fragmentos de procesamiento para evitar los tiempos de espera del servidor. Este valor determina cuánto tiempo tardará cada uno de estos fragmentos. Es posible que deba modificar este valor si la restauración de su base de datos no se completa. El valor predeterminado es 10 segundos."
DATABASE_LBL_THROTTLEMSEC="Tiempo de limitación"
DATABASE_LBL_THROTTLEMSEC_HELP="El script de restauración puede, opcionalmente, reducir la velocidad del proceso de restauración de la base de datos en servidores con problemas graves. Puede introducir el tiempo de limitación entre fragmentos de procesamiento en milisegundos (1/1000 de segundo). Por ejemplo, para añadir un tiempo de limitación de 5 segundos entre pasos, introduzca 5000 en este campo. El valor predeterminado de 250 debería funcionar en la mayoría de los servidores."

DATABASE_LBL_ON_CREATE_ERROR="Detener en error de CREATE"
DATABASE_LBL_ON_CREATE_ERROR_HELP="¿Debe detenerse inmediatamente la restauración si hay un error al crear una tabla, vista, función, disparador o procedimiento almacenado? Si no está marcada, dichos errores se ignorarán y la restauración continuará con posible corrupción de datos y/o problemas en el sitio restaurado."
DATABASE_LBL_ON_OTHER_ERROR="Detener en otro error"
DATABASE_LBL_ON_OTHER_ERROR_HELP="¿Debe detenerse inmediatamente la restauración si hay un error al ejecutar cualquier otro comando de base de datos, como restaurar o eliminar datos? Si no está marcada, dichos errores se ignorarán y la restauración continuará con posible corrupción de datos y/o problemas en el sitio restaurado."

DATABASE_HEADER_DBRESTORE="Restauración de la base de datos"
DATABASE_LBL_RESTORATION_PROGRESS="Progreso de la restauración"
DATABASE_LBL_RESTORED="Restaurado"
DATABASE_LBL_TOTAL="Tamaño total"
DATABASE_LBL_ETA="Tiempo estimado restante"

DATABASE_HEADER_SUCCESS="La restauración de la base de datos fue correcta"
DATABASE_HEADER_WARNINGS="La restauración de la base de datos se completó pero algunas consultas no se pudieron ejecutar"
DATABASE_MSG_WARNINGS="Es posible que su sitio restaurado no funcione correctamente a menos que corrija estos problemas manualmente. Por favor, revise las consultas fallidas y el motivo de su fallo consultando el archivo de registro:"
DATABASE_MSG_SUCCESS="Haga clic en el botón de abajo para continuar con el paso siguiente"
DATABASE_BTN_SUCCESS="Paso siguiente"

DATABASE_HEADER_INPROGRESS_WARNINGS="Algunas consultas han fallado"
DATABASE_MSG_INPROGRESS_WARNINGS="Algunas consultas SQL no se han podido ejecutar, pero usted eligió ignorarlas. Puede revisarlas junto con el motivo de su fallo al terminar la restauración consultando el siguiente archivo de registro:"

DATABASE_HEADER_ERROR="Se produjo un error al restaurar la base de datos. El mensaje de error se encuentra a continuación. Haga clic en el botón &times; en la parte superior derecha de este cuadro de diálogo para cerrarlo y volver a la página de restauración de la base de datos."
DATABASE_ERR_INVALIDKEY="Clave de base de datos no válida"

DATABASE_ERR_COMPLEXPASSWORD="!!! ADVERTENCIA !!!\n\nSu contraseña de base de datos contiene caracteres especiales. Muchos servidores web rechazan o modifican estas contraseñas, lo que provoca que la restauración de la base de datos falle con un error de conexión a la base de datos.\n\nLe recomendamos MUY ENCARECIDAMENTE que cambie su contraseña de base de datos por una cadena aleatoria larga (32 caracteres o más) que consista ÚNICAMENTE en letras mayúsculas A-Z, letras minúsculas a-z y números 0-9.\n\n¿Desea ignorar la advertencia y continuar con la restauración de la base de datos bajo su propia responsabilidad?"
DATABASE_ERR_UPPERCASEPREFIX="!!! ADVERTENCIA !!!\n\nEl prefijo del nombre de tablas de su base de datos contiene uno o más caracteres en mayúsculas. Esto puede causar graves problemas en el sitio restaurado y/o hacer imposible restaurar su sitio en un servidor diferente. Esto ocurre por la forma en que MySQL gestiona las letras mayúsculas y no se puede solucionar eficazmente, según la documentación de MySQL.\n\nLe recomendamos MUY ENCARECIDAMENTE que utilice un prefijo del nombre de tablas de la base de datos completamente en minúsculas.\n\n¿Desea ignorar la advertencia y continuar con la restauración de la base de datos bajo su propia responsabilidad?"
DATABASE_ERR_EMPTY_INFO="!!! ADVERTENCIA !!!\n\nNo ha rellenado todos los campos obligatorios (nombre del servidor de la base de datos, nombre de la base de datos, nombre de usuario de la base de datos, contraseña de la base de datos y prefijo del nombre de tablas). Lo más probable es que esto cause un error al intentar conectarse a la base de datos y/o en el sitio restaurado.\n\n¿Está ABSOLUTAMENTE SEGURO de que esto es lo que realmente quiere hacer?"

DATABASE_HEADER_RESTORERETRY="Restauración detenida y se reanudará automáticamente"
DATABASE_LBL_RESTOREFAILEDRETRY="La restauración de la base de datos ha sido detenida porque se detectó un error. Sin embargo, el script de restauración intentará reanudar el proceso. Si no desea reanudar la restauración, haga clic en el botón Cancelar a continuación."
DATABASE_LBL_WILLRETRY="La restauración se reanudará en"
DATABASE_LBL_WILLRETRYSECONDS="segundos"
DATABASE_LBL_CANCEL="Cancelar"
DATABASE_LBL_BTNRESUME="Reanudar"
DATABASE_LBL_LASTERRORMESSAGEWAS="Para su información, el último mensaje de error fue:"

DATABASE_RESTORE_COMMON_LBL_ERROR_RECEIVED="El error recibido fue:"
DATABASE_RESTORE_COMMON_LBL_HOWTOFIX="Cómo corregir este error"
DATABASE_RESTORE_COMMON_LBL_DEBUG="Información de depuración"
DATABASE_RESTORE_COMMON_LBL_SHOWHIDE="Mostrar / Ocultar"
DATABASE_RESTORE_COMMON_LBL_PLSINCLUDE="Incluya esta información en su solicitud de soporte si necesita más asistencia. Indíquenos qué pasos de resolución de problemas ya ha intentado."

DATABASE_RESTORE_DBNAME_HEAD="Nombre de base de datos incorrecto o sin acceso a la base de datos"
DATABASE_RESTORE_DBNAME_LBL_EXPLAIN="El servidor de base de datos informa de que el nombre del servidor, el nombre de usuario y la contraseña son correctos, pero no puede conectarse a la base de datos que especificó en la opción «Nombre de la base de datos». Esto significa que la base de datos no existe <em>o bien</em> que no ha concedido acceso a su usuario de base de datos a esta base de datos."
DATABASE_RESTORE_DBUSER_HEAD="Información de conexión a la base de datos incorrecta"
DATABASE_RESTORE_DBUSER_LBL_EXPLAIN="No hemos podido conectarnos a su servidor de base de datos usando el nombre del servidor, el nombre de usuario y la contraseña que proporcionó."
DATABASE_RESTORE_DBUSER_SUGGESTION_1="Compruebe el nombre del servidor de su base de datos. Recuerde que <code>localhost</code> y <code>127.0.0.1</code> tienen significados diferentes al conectarse a una base de datos."
DATABASE_RESTORE_DBUSER_SUGGESTION_2="Compruebe el nombre de la base de datos y el nombre de usuario de la base de datos. La mayoría de los proveedores de alojamiento añaden como prefijo al nombre de la base de datos el nombre de usuario de su cuenta de alojamiento. Si no está seguro, consulte a su proveedor de alojamiento."
DATABASE_RESTORE_DBUSER_SUGGESTION_3="Compruebe su contraseña. Las mayúsculas y minúsculas importan: ABC, abc y Abc son tres contraseñas <em>diferentes</em>."
DATABASE_RESTORE_DBUSER_SUGGESTION_4="Si está copiando o moviendo su sitio, asegúrese de introducir la información de conexión a la base de datos del nuevo sitio."
DATABASE_RESTORE_DBUSER_SUGGESTION_5="Si aún no tiene una base de datos, deberá crear una. La mayoría de los proveedores de alojamiento no permiten a este script de restauración crear una nueva base de datos por razones de seguridad."
DATABASE_RESTORE_DBUSER_SUGGESTION_6="Si ha creado una nueva base de datos, asegúrese de haber creado también un usuario de base de datos <strong>y</strong> de haber asignado el usuario a la base de datos, concediéndole todos los privilegios sobre ella."

; ==============================================================================
; Site setup
; ==============================================================================
SETUP_HEADER_SITEPARAMS="Parámetros del sitio"
SETUP_HEADER_SITEPARAMS_HELP="Estos son los parámetros básicos de su sitio. Siempre puede modificarlos una vez completada la restauración desde el área de administración de su sitio, en la Configuración global."
SETUP_LBL_SITENAME="Nombre del sitio"
SETUP_LBL_SITENAME_HELP="El nombre de su sitio, que se usa en las páginas HTML del sitio, entre otras cosas."
SETUP_LBL_SITEEMAIL="Dirección de correo electrónico del sitio"
SETUP_LBL_SITEEMAIL_HELP="La dirección de correo electrónico desde la que aparecerán enviados los mensajes de correo de su sitio."
SETUP_LBL_EMAILSENDER="Nombre del remitente del sitio"
SETUP_LBL_EMAILSENDER_HELP="El nombre del remitente que se usa en todos los mensajes de correo enviados por su sitio."
SETUP_LBL_LIVESITE="URL en producción del sitio"
SETUP_LBL_LIVESITE_HELP="Algunos servidores tienen dificultades para determinar la URL de su sitio, lo que puede provocar que las URL SEF y los elementos de menú no funcionen. En estos servidores debe introducir la URL de su sitio sin la barra diagonal final, por ejemplo: <code>http://www.example.com</code>. En la mayoría de los casos esto no es necesario y puede dejar este campo vacío."
SETUP_LBL_LIVESITE_WINDOWS_WARNING="¡ADVERTENCIA! Su servidor web se ejecuta en Windows. Rellenar la URL en producción del sitio al ejecutar un sitio en Windows hará imposible iniciar sesión en el área de administrador de su sitio debido a un error en Joomla!. Por favor, deje esta casilla en blanco."
SETUP_LBL_USESITEDIRS="Sobreescribir las rutas de tmp y log"
SETUP_LBL_USESITEDIRS_HELP="El script de restauración usará por defecto las rutas de tmp y log ya configuradas en la Configuración global del sitio del que se realizó la copia de seguridad. Si está restaurando en un servidor diferente o clonando su sitio, esto puede causar problemas. En ese caso, o si no está seguro, haga clic en el botón: el script de restauración rellenará las rutas del directorio temporal y de registros con valores adecuados para el sitio al que está restaurando. Puede cambiar estas rutas en la sección Ajuste fino de directorios a continuación."
SETUP_LBL_USESITEDIRS_51="Sobreescribir las rutas de tmp, log y caché"
SETUP_LBL_USESITEDIRS_HELP_51="El script de restauración usará por defecto las rutas de tmp, log y caché ya configuradas en la Configuración global del sitio del que se realizó la copia de seguridad. Si está restaurando en un servidor diferente o clonando su sitio, esto puede causar problemas. En ese caso, o si no está seguro, haga clic en el botón: el script de restauración rellenará las rutas del directorio temporal y de registros con valores adecuados para el sitio al que está restaurando, y revertirá el directorio de caché a una cadena vacía (que indica a Joomla! que use la carpeta <code>administrator/cache</code>). Puede cambiar estas rutas en la sección Ajuste fino de directorios a continuación."
SETUP_LBL_COOKIEDOMAIN="Dominio de la cookie"
SETUP_LBL_COOKIEDOMAIN_HELP="El dominio de la cookie es el nombre de dominio de su sitio, sin el protocolo y, generalmente, sin la parte www. Por ejemplo, si está restaurando en http://www.example.com, el dominio de la cookie es example.com (permítanos insistir: ¡NO hay http:// en él!)."
SETUP_LBL_COOKIEPATH="Ruta de la cookie"
SETUP_LBL_COOKIEPATH_HELP="La ruta de la cookie es el subdirectorio de su sitio, relativo a la raíz del dominio. Si está restaurando en la raíz de un dominio, por ejemplo http://www.example.com, entonces es / (una única barra diagonal). Si está restaurando en un subdirectorio, es una barra diagonal seguida del nombre del directorio. Por ejemplo, si está restaurando en http://www.example.com/joomla, entonces la ruta de la cookie es /joomla (CON una barra diagonal inicial, pero SIN una barra diagonal final)."

SETUP_HEADER_FTPPARAMS="Opciones de la capa FTP"
SETUP_HEADER_FTPPARAMS_HELP="Estos son ajustes opcionales que permiten a Joomla! usar FTP para escribir en archivos y directorios de otro modo no editables. Esto generalmente solo es necesario en alojamientos compartidos. Consulte el texto de ayuda de las opciones para obtener más información."
SETUP_LABEL_FTPENABLE="Activar la capa FTP"
SETUP_LABEL_FTPENABLE_HELP="Algunos alojamientos compartidos hacen imposible que PHP escriba en archivos y directorios subidos por FTP. Si está en uno de estos alojamientos y ha usado FTP o la opción de extracción mediante carga por FTP de Kickstart, deberá configurar y activar la capa FTP."
SETUP_LABEL_FTPHOST="Nombre del servidor"
SETUP_LABEL_FTPHOST_HELP="El nombre del servidor o la dirección IP de su servidor FTP <b>sin</b> el especificador de protocolo ftp://. Generalmente es localhost o 127.0.0.1. Si no está seguro, consulte a su proveedor de alojamiento."
SETUP_LABEL_FTPPORT="Puerto"
SETUP_LABEL_FTPPORT_HELP="El puerto TCP donde escucha el servidor FTP. Generalmente es 21. Si no está seguro, establézcalo en 21 o consulte a su proveedor de alojamiento."
SETUP_LABEL_FTPUSER="Nombre de usuario"
SETUP_LABEL_FTPUSER_HELP="El nombre de usuario que utiliza para conectarse a FTP. Si no está seguro, consulte a su proveedor de alojamiento."
SETUP_LABEL_FTPPASS="Contraseña"
SETUP_LABEL_FTPPASS_HELP="La contraseña que utiliza para conectarse a FTP. Si no está seguro, consulte a su proveedor de alojamiento."
SETUP_LABEL_FTPDIR="Directorio"
SETUP_LABEL_FTPDIR_HELP="El directorio FTP donde se encuentran los archivos de su sitio (como index.php). Si no está seguro, consulte a su proveedor de alojamiento."

SETUP_HEADER_SUPERUSERPARAMS="Configuración del Súper Usuario"
SETUP_HEADER_SUPERUSERPARAMS_HELP="El script de restauración restaura su sitio con el Súper Usuario que fue incluido en la copia de seguridad del sitio original. Opcionalmente, puede seleccionar uno (y solo uno) Súper Usuario en esta página y cambiar su dirección de correo electrónico y contraseña. Esto es muy útil cuando está clonando un sitio."
SETUP_LABEL_SUPERUSER="Súper Usuario"
SETUP_LABEL_SUPERUSER_HELP="Opcionalmente, puede seleccionar una cuenta de Súper Usuario cuyo correo electrónico y/o contraseña se cambiarán en el sitio restaurado. <b>Solo se modificará el Súper Usuario seleccionado.</b> Si no desea hacer esto, déjelo en la selección predeterminada «—», que no modifica ninguna cuenta de usuario."
SETUP_LABEL_SUPERADMIN="Administrador"
SETUP_LABEL_SUPERUSEREMAIL="Correo electrónico"
SETUP_LABEL_SUPERUSEREMAIL_HELP="Introduzca la dirección de correo electrónico del Súper Usuario. ¡Asegúrese de que no esté siendo usada por otro usuario del sitio, ya que de lo contrario el sitio restaurado quedará roto!"
SETUP_LABEL_SUPERUSERPASSWORD="Contraseña"
SETUP_LABEL_SUPERUSERPASSWORD_HELP="Introduzca la nueva contraseña para asignar al Súper Usuario. Si no desea cambiar la contraseña del Súper Usuario, deje este campo y los siguientes en blanco."
SETUP_LABEL_SUPERUSERPASSWORD_HELP2="Introduzca la nueva contraseña para asignar al Súper Usuario."
SETUP_LABEL_SUPERUSERPASSWORDREPEAT="Contraseña (repetir)"
SETUP_LABEL_SUPERUSERPASSWORDREPEAT_HELP="Repita la contraseña. Esto nos permite asegurarnos de que no cometió ningún error tipográfico arriba."

SETUP_HEADER_FINETUNING="Ajuste fino de directorios"
SETUP_HEADER_FINETUNING_HELP="Joomla! necesita dos directorios con permisos de escritura para sus archivos temporales y registros. Puede definirlos aquí. Consejo: si no tienen permisos de escritura pero ya ha activado la capa FTP más arriba, el script de restauración intentará darles permisos de escritura y protegerlos automáticamente."
SETUP_LBL_SERVERCONFIG_NEWSECRET="Generar un nuevo secreto"
SETUP_LBL_SERVERCONFIG_NEWSECRET_HELP="Habilite esto cuando mueva su sitio entre servidores y/o dominios. Genera nuevos secretos en el archivo de configuración de su sitio para evitar la reutilización de sesiones del sitio anterior. Tenga en cuenta que el software de terceros que use los secretos del sitio para cifrar información puede no poder acceder a sus datos cuando haga esto."
SETUP_LABEL_SITEROOT="Raíz del sitio"
SETUP_LABEL_SITEROOT_HELP="Esta es la ruta a la raíz de su sitio. Se muestra para su comodidad. Haga triple clic (o mantenga pulsado) sobre ella para seleccionarla; luego puede copiarla y usarla en los campos de abajo."
SETUP_LABEL_TMPPATH="Directorio temporal"
SETUP_LABEL_TMPPATH_HELP="El directorio donde Joomla! almacenará los datos temporales. Recomendamos colocarlo fuera de la raíz de su sitio. Predeterminado: el directorio <code>tmp</code> bajo la raíz de su sitio."
SETUP_LABEL_LOGSPATH="Directorio de registros"
SETUP_LABEL_LOGSPATH_HELP="El directorio donde Joomla! almacenará sus archivos de registro. Recomendamos colocarlo fuera de la raíz de su sitio. Predeterminado: el directorio <code>log</code> bajo la raíz de su sitio."
SETUP_LBL_CACHE_PATH="Directorio de caché"
SETUP_LBL_CACHE_PATH_HELP="El directorio donde Joomla! almacenará sus archivos de caché temporales. Recomendamos colocarlo fuera de la raíz de su sitio. Si lo deja vacío, se usará el directorio <code>administrator/cache</code> bajo la raíz de su sitio (valor predeterminado y recomendado). NOTA: Joomla! siempre usará <code>administrator/cache</code> para su archivo <code>autoload_psr4.php</code> a menos que se sobreescriba la constante <code>JPATH_CACHE</code>."

SETUP_ERR_PASSWORDSDONTMATCH="Las contraseñas del Súper Usuario no coinciden"
SETUP_ERR_EMAILEMPTY="La dirección de correo electrónico del Súper Usuario está vacía"

