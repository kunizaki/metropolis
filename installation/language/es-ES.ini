FINALISE_LBL_MAKESURECONFIG="Asegúrese de haber creado el archivo <code>%s</code> tal como se indica arriba, y compruebe su contenido con lo que se muestra en esta página. No hacerlo <em>provocará</em> un sitio roto."
FINALISE_LBL_KICKSTART="Cierre esta ventana para volver a Kickstart. Haga clic en el botón <strong>Limpiar</strong> para empezar a usar su sitio restaurado."
