FINALISE_LBL_CONFIGOUTRO="Recuerde subir este archivo como <code>%s</code> en la raíz de su sitio. La raíz de su sitio normalmente se llama public_html, www, httpdocs, htdocs o algo similar. Si no está seguro de cuál es el directorio raíz de su sitio, consulte a su proveedor de alojamiento."
