DATABASE_NOCONNECTORS_LBL_STEP_NO="En términos generales, no podemos."
DATABASE_NOCONNECTORS_LBL_STEP_SPECIFIC="Las instrucciones son específicas para cada entorno de alojamiento. Generalmente es más rápido y preciso consultar directamente a las personas que crearon y mantienen el entorno de alojamiento para obtener instrucciones específicas."
DATABASE_NOCONNECTORS_LBL_INERROR_HEAD="¿Puedo recibir este mensaje por error?"
DATABASE_NOCONNECTORS_LBL_INERROR_NO="No, no es posible que reciba este mensaje por error."
DATABASE_NOCONNECTORS_LBL_INERROR_WHAT="Este mensaje aparece cuando PHP informa que ninguna de las funciones de conexión a bases de datos para servidores de base de datos compatibles con MySQL está disponible."
DATABASE_NOCONNECTORS_LBL_INERROR_CONFUSION="Tenga en cuenta que su servidor puede estar indicando que las extensiones están instaladas para una versión de PHP o una instalación de PHP diferente, como la instalación de PHP separada utilizada por el panel de control de alojamiento. Esta no es la misma instalación y/o versión de PHP que utiliza para restaurar su sitio."
DATABASE_NOCONNECTORS_LBL_USEOTHER_HEAD="¿Puedo usar una tecnología de base de datos diferente, por ejemplo, PostgreSQL?"
DATABASE_NOCONNECTORS_LBL_USEOTHER_NO="No, no puede."
DATABASE_NOCONNECTORS_LBL_USEOTHER_WHY="Las diferentes tecnologías de base de datos utilizan estructuras de base de datos incompatibles, formatos de datos, controladores de base de datos y requieren código SQL y PHP escrito de forma diferente. No puede usar una base de datos que no sea MySQL con datos procedentes de software escrito para una base de datos compatible con MySQL."
DATABASE_NOCONNECTORS_LBL_REINSTALL_HEAD="¿Funcionará si reinstalo mi sitio?"
DATABASE_NOCONNECTORS_LBL_REINSTALL_NO="No, no funcionará."
DATABASE_NOCONNECTORS_LBL_REINSTALL_WHY="Su CMS también necesita conectarse a la base de datos. La única forma de hacerlo es usando las mismas extensiones de PHP. Por tanto, acabará con el mismo problema."
DATABASE_NOCONNECTORS_LBL_REINSTALL_INCOMPATIBILITY="<em>Puede</em> ser posible que su CMS le permita usar una tecnología de base de datos diferente al instalar un sitio nuevo, por ejemplo, PostgreSQL. Sin embargo, no todo el software que utilizaba anteriormente en su sitio podrá funcionar con él. Esto hará imposible reimplementar su sitio."

