SETUP_LABEL_FORCESSL="Forzar SSL"
SETUP_LABEL_FORCESSL_TIP="Forzar que el acceso al sitio se produzca siempre bajo SSL (https) para las áreas del sitio seleccionadas. Si tiene SSL habilitado en su sitio, le recomendamos usar siempre Todo el sitio por razones de seguridad."
SETUP_LABEL_FORCESSL_NONE="Ninguno"
SETUP_LABEL_FORCESSL_ADMINONLY="Solo administrador"
SETUP_LABEL_FORCESSL_ENTIRESITE="Todo el sitio"
SETUP_HEADER_SERVERCONFIG="Archivos de configuración específicos del servidor"
SETUP_SERVERCONFIG_DESCR="Los archivos que modifican la forma en que su servidor se comporta al servir su sitio pueden causar problemas de carga del sitio al restaurar en un nuevo servidor. Use las opciones a continuación para restablecerlos a los valores predeterminados de Joomla!."
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI="Eliminar archivos .user.ini y/o php.ini de los directorios principales del sitio"
SETUP_LBL_SERVERCONFIG_REMOVEPHPINI_HELP="Renombra los archivos de configuración de PHP <strong>.user.ini</strong> y <strong>php.ini</strong> en el directorio raíz del sitio y en el directorio administrator. Los archivos renombrados tienen la extensión .bak."
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG="Reemplazar el archivo web.config principal con el predeterminado"
SETUP_LBL_SERVERCONFIG_REPLACEWEBCONFIG_HELP="Reemplaza el contenido del archivo web.config en la raíz de su sitio con el contenido del archivo web.config.txt estándar que se incluye con Joomla. El archivo antiguo se renombra a web.config.bak"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD="Eliminar los archivos .htaccess y .htpasswd del directorio administrator"
SETUP_LBL_SERVERCONFIG_REMOVEHTPASSWD_HELP="Elimina los archivos .htaccess y .htpasswd del directorio administrator. Habilite esto si había aplicado protección con contraseña al directorio administrator —ya sea a través del panel de control de su alojamiento o mediante una extensión de seguridad de terceros como Admin Tools— y está restaurando en un nuevo servidor que no admite el mismo método de codificación de contraseñas que su servidor anterior. <strong>IMPORTANTE</strong>: ¡Recuerde volver a habilitar la protección con contraseña para el directorio administrator después de que la restauración esté completa!"
SETUP_LBL_SERVERCONFIG_NONEED_HELP="Los archivos a los que hace referencia esta opción no existen en su servidor. ¡Genial! No tiene que ocuparse de ellos y no necesita esta opción."

DATABASE_WARN_LARGE_COLUMNS="La fila de base de datos más grande de su base de datos es de %1$0.2f Mb. Sin embargo, es probable que su servidor de base de datos esté configurado para aceptar solo hasta %3$0.2f Mb (no podemos comprobarlo sin conectarnos al servidor de base de datos). Si continúa con la restauración de la base de datos, lo más probable es que reciba un código de error de base de datos 1153; o un mensaje de error «ER_NET_PACKET_TOO_LARGE»; o un mensaje de error «Got a packet bigger than 'max_allowed_packet' bytes». Si esto ocurre, solicite a su proveedor de alojamiento que establezca el valor de la variable de configuración <strong>max_allowed_packet</strong> de su servidor de base de datos en al menos %2$d Mb."


DATABASE_LBL_SPECIFICTABLES_LBL="Seleccionar qué elementos de la base de datos restaurar"
DATABASE_LBL_SPECIFICTABLES_ADD_ALL="Añadir todo"
DATABASE_LBL_SPECIFICTABLES_CLEAR_ALL="Borrar todo"
DATABASE_LBL_SPECIFICTABLES_HELP="Por defecto, el script de restauración restaurará todas las tablas de la base de datos. Si desea restaurar solo tablas específicas, selecciónelas a continuación."
SETUP_LBL_SERVERCONFIG_DISABLEFORCESSL_WARN="Está restaurando en un sitio no cifrado (HTTP), pero su Configuración global indica que se debe acceder al sitio a través de una conexión cifrada (HTTPS). Si su sitio actual no admite HTTPS, establezca la opción de abajo en «Ninguno»."

SETUP_LBL_HTACCESSCHANGE_LBL="Gestión del fichero .htaccess"
SETUP_LBL_HTACCESSCHANGE_DESC="Elija qué hacer con el archivo <code>.htaccess</code> de su sitio.<br/><strong>Sin cambios</strong>. El archivo se mantiene tal como está.<br/><strong>Usar predeterminado</strong>. Reemplaza el contenido del archivo .htaccess en la raíz de su sitio con el contenido del archivo htaccess.txt estándar que se incluye con Joomla. El archivo antiguo se renombra a htaccess.bak<br/><strong>Eliminar líneas de manejador PHP</strong> Elimina cualquier línea AddHandler/SetHandler de su archivo .htaccess. Estas son directivas específicas del servidor que normalmente se usan para aplicar una versión específica de PHP a su sitio. Úselo al restaurar en un servidor diferente.<br/><strong>Reemplazar líneas de manejador PHP</strong> Use las líneas AddHandler/SetHandler en su archivo .htaccess actual. Úselo si tuvo que establecer una versión de PHP diferente para su sitio antes de ejecutar Kickstart o el Asistente de transferencia de sitio.<br/>"
SETUP_LBL_HTACCESSCHANGE_NONE="Sin cambios"
SETUP_LBL_HTACCESSCHANGE_DEFAULT="Usar predeterminado"
SETUP_LBL_HTACCESSCHANGE_REMOVEHANDLER="Eliminar líneas de manejador PHP"
SETUP_LBL_HTACCESSCHANGE_REPLACEHANDLER="Reemplazar líneas de manejador PHP"
