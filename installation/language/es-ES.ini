FINALISE_LBL_STANDALONE="Haga clic en el siguiente botón para eliminar el script de restauración y empezar a usar su sitio."

FINALISE_HEADER_ERROR="Se produjo un error"
FINALISE_LBL_ERROR="No hemos podido eliminar su directorio <code>installation</code> automáticamente. Por favor, cierre este cuadro de mensaje haciendo clic en el botón &times; en su esquina superior derecha. A continuación, proceda a eliminar el directorio <code>installation</code> manualmente, por ejemplo, usando el explorador de archivos del panel de control de su alojamiento, o FTP/SFTP."

FINALISE_HEADER_SUCCESS="¡Listo para empezar a usar su sitio!"
FINALISE_LBL_SUCCESS="El directorio <code>installation</code> ha sido eliminado y su sitio está listo para usar. Tenga en cuenta que, como mencionamos anteriormente, debido a las diferencias en la configuración del servidor puede tener algunos problemas con su sitio. Si esto ocurre, consulte la siguiente URL:<br/><span class='label label-info'><code>%s</code></span><br/>Consejo: Guarde esa URL en sus favoritos para consultarla en el futuro.<br/>Ahora haga clic en el botón de abajo para visitar la interfaz pública de su sitio."
FINALISE_BTN_VISITFRONTEND="Visitar la interfaz pública del sitio"

OFFSITEDIRS_HEADER_MASTER="Restauración de <code>%s</code>"
OFFSITEDIRS_LBL_EXPLANATION="<p>Cuando realizó la copia de seguridad de su sitio había algunos archivos fuera de la raíz de su sitio (la carpeta principal de la que se realizó la copia de seguridad). Los archivos en cuestión se encontraban en la carpeta <code>%s</code>.</p><p>Estos archivos se encuentran actualmente extraídos en <code>%s</code>, que <em>no</em> es donde deben estar para que su sitio funcione. Esta es solo una ubicación temporal necesaria por el hecho de que extraer un archivo comprimido no puede crear archivos <em>por encima</em> de la carpeta en la que lo está extrayendo. Por tanto, es necesario mover estos archivos para que su sitio funcione.</p><p>Puede proporcionar a continuación la ruta absoluta de la ubicación del sistema de archivos a la que deben copiarse. Para su información, su sitio está actualmente extraído en la ubicación absoluta del sistema de archivos <code>%s</code>.</p>"
