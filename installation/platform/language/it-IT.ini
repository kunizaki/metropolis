SETUP_LBL_ROBOTS_OPT_NO_CHANGE="Nessuna modifica"
SETUP_LBL_ROBOTS_OPT_INDEX_FOLLOW="Indicizza e segui i link"
SETUP_LBL_ROBOTS_OPT_INDEX_NO_FOLLOW="Indicizza ma non seguire i link"
