;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Cartella pubblica"

PUBLICFOLDER_LBL_INFO_HEAD="Joomla!&trade; è stato installato con una cartella pubblica personalizzata"
PUBLICFOLDER_LBL_INFO_BODY="Joomla!&trade; è stato configurato per utilizzare una cartella pubblica (da cui viene servito il sito: <code>%s</code>) diversa dalla cartella radice (dove sono stati installati i file di Joomla!: <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Usa cartella pubblica personalizzata"
PUBLICFOLDER_LBL_BUT_WINDOWS="Tuttavia, sta ripristinando questo sito su un host Windows. Joomla! non supporta la funzionalità della cartella pubblica su Windows. Pertanto, questa funzionalità verrà disabilitata quando farà clic su Avanti."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Tuttavia, sta ripristinando questo sito avendo estratto l'archivio di backup direttamente nella radice web. Pertanto, questa funzionalità verrà disabilitata quando farà clic su Avanti."
PUBLICFOLDER_LBL_BUT_CUSTOM="Sembra che abbia la stessa configurazione sul server su cui sta ripristinando questo sito. Inserisca la cartella pubblica nel modulo sottostante e faccia clic su Avanti per assicurarsi che tutti i file e le cartelle necessari vengano spostati nella posizione corretta."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Opzioni cartella pubblica"
PUBLICFOLDER_LBL_NEWPUBLIC="Cartella pubblica"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Inserisca il percorso assoluto della cartella in cui è ospitato il suo sito. Ad esempio, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Non è possibile utilizzare la cartella in cui si stanno ripristinando i file di Joomla! come cartella pubblica. Se si desidera annullare la configurazione della cartella pubblica, si estragga l'archivio di backup nella cartella da cui verrà servito, <em>poi</em> si esegua il ripristino."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="L'impostazione Usa cartella pubblica non è compatibile con l'ambiente corrente."
PUBLICFOLDER_ERR_PUBLIC_MISSING="La cartella pubblica scelta non esiste."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="La cartella pubblica scelta non è scrivibile."

SETUP_LBL_NOSA_HEAD="Nessun Super Utente trovato"
SETUP_LBL_NOSA_DESC="Si tratta di una situazione anomala e altamente problematica. L'assenza di Super Utenti nel sito ripristinato renderà impossibile eseguire qualsiasi azione amministrativa su di esso. In altre parole, il sito ripristinato sarà completamente inutilizzabile."
SETUP_LBL_NOSA_ACTION_REQUIRED="Azione richiesta"
SETUP_LBL_NOSA_ACTION_SUMMARY="Si assicuri che le tabelle <code>#__users</code> e <code>#__user_usergroup_map</code> siano state sottoposte a backup, <strong>e ripristinate</strong> integralmente."
SETUP_LBL_NOSA_ACTION_INFO="Torni all'inizio del ripristino utilizzando i pulsanti Indietro. Quando si trova nel passo di Ripristino del database del database <code>site</code>, si assicuri di non utilizzare la funzionalità per selezionare le tabelle da ripristinare. Se <em>deve</em> utilizzare questa funzionalità, ad esempio per aggirare un problema di ripristino del database, si assicuri di selezionare le tabelle <code>#__users</code> e <code>#__user_usergroup_map</code>."

