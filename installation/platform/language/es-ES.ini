BRS_PLATFORM_TITLE_JOOMLA="Joomla!"

;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Carpeta pública"

PUBLICFOLDER_LBL_INFO_HEAD="Joomla!&trade; fue instalado con una carpeta pública personalizada"
PUBLICFOLDER_LBL_INFO_BODY="Joomla!&trade; fue configurado para usar una carpeta pública (desde donde se sirve su sitio: <code>%s</code>) diferente de su carpeta raíz (donde se instalaron los archivos de Joomla: <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Usar carpeta pública personalizada"
PUBLICFOLDER_LBL_BUT_WINDOWS="Sin embargo, está restaurando este sitio en un servidor Windows. Joomla no es compatible con la función de carpeta pública en Windows. Por lo tanto, esta función quedará deshabilitada cuando haga clic en Siguiente."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Sin embargo, está restaurando este sitio habiendo extraído su archivo de copia de seguridad directamente dentro de la raíz web. Por lo tanto, esta función quedará deshabilitada cuando haga clic en Siguiente."
PUBLICFOLDER_LBL_BUT_CUSTOM="Parece que tiene la misma configuración en el servidor donde está restaurando este sitio. Introduzca la carpeta pública en el formulario de abajo y haga clic en Siguiente para asegurarse de que todos los archivos y carpetas necesarios se mueven a su ubicación correcta."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Opciones de la carpeta pública"
PUBLICFOLDER_LBL_NEWPUBLIC="Carpeta pública"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Introduzca la ruta absoluta a la carpeta desde donde se aloja su sitio. Por ejemplo, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="No puede usar la carpeta donde está restaurando sus archivos de Joomla como carpeta pública. Si está intentando deshacer la configuración de la carpeta pública, extraiga el archivo de copia de seguridad en la carpeta desde donde va a ser servido, <em>y después</em> ejecute la restauración."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="Su configuración de Usar carpeta pública es incompatible con su entorno actual."
PUBLICFOLDER_ERR_PUBLIC_MISSING="La carpeta pública que eligió no existe."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="La carpeta pública que eligió no tiene permisos de escritura."

SETUP_LBL_NOSA_HEAD="No se encontró ningún Súper Usuario"
SETUP_LBL_NOSA_DESC="Esta es una situación anormal y muy problemática. No tener Súper Usuarios en el sitio restaurado hará imposible realizar cualquier acción administrativa en él. En pocas palabras, su sitio restaurado será completamente inutilizable."
SETUP_LBL_NOSA_ACTION_REQUIRED="Acción requerida"
SETUP_LBL_NOSA_ACTION_SUMMARY="Asegúrese de que las tablas <code>#__users</code> y <code>#__user_usergroup_map</code> han sido incluidas en la copia de seguridad y <strong>restauradas</strong> por completo."
SETUP_LBL_NOSA_ACTION_INFO="Regrese al inicio de la restauración usando los botones Anterior. Cuando se encuentre en el paso de Restauración de la base de datos de la base de datos <code>site</code>, asegúrese de no usar la función para seleccionar qué tablas restaurar. Si <em>tiene que</em> usar esta función, por ejemplo para resolver un problema en la restauración de la base de datos, asegúrese de seleccionar las tablas <code>#__users</code> y <code>#__user_usergroup_map</code>."

SETUP_LBL_ROBOTS_LBL="Robots (Motor de búsqueda)"
SETUP_LBL_ROBOTS_OPT_NO_CHANGE="Sin cambios"
SETUP_LBL_ROBOTS_OPT_INDEX_FOLLOW="Indexar y seguir enlaces"
SETUP_LBL_ROBOTS_OPT_INDEX_NO_FOLLOW="Indexar pero no seguir enlaces"
SETUP_LBL_ROBOTS_OPT_NO_INDEX_NO_FOLLOW="No indexar ni seguir enlaces"
