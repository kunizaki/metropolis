BRS_PLATFORM_TITLE_JOOMLA="Joomla!"

;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Dossier public"

PUBLICFOLDER_LBL_INFO_HEAD="Joomla!&trade; a été installé avec un dossier public personnalisé"
PUBLICFOLDER_LBL_INFO_BODY="Joomla!&trade; a été configuré pour utiliser un dossier public (depuis lequel votre site est servi : <code>%s</code>) différent de son dossier racine (où les fichiers Joomla ont été installés : <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Utiliser un dossier public personnalisé"
PUBLICFOLDER_LBL_BUT_WINDOWS="Vous restaurez toutefois ce site sur un serveur Windows. Joomla ne prend pas en charge la fonctionnalité de dossier public sous Windows. Par conséquent, cette fonctionnalité sera désactivée lorsque vous cliquerez sur Suivant."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Vous restaurez toutefois ce site en ayant extrait votre archive de sauvegarde directement dans la racine web. Par conséquent, cette fonctionnalité sera désactivée lorsque vous cliquerez sur Suivant."
PUBLICFOLDER_LBL_BUT_CUSTOM="Il semble que vous ayez la même configuration sur le serveur sur lequel vous restaurez ce site. Saisissez le dossier public dans le formulaire ci-dessous et cliquez sur Suivant pour vous assurer que tous les fichiers et dossiers nécessaires sont déplacés à leur emplacement correct."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Options du dossier public"
PUBLICFOLDER_LBL_NEWPUBLIC="Dossier public"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Saisissez le chemin absolu vers le dossier depuis lequel votre site est hébergé. Par exemple, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Vous ne pouvez pas utiliser le dossier dans lequel vous restaurez vos fichiers Joomla comme dossier public. Si vous essayez d'annuler la configuration du dossier public, extrayez l'archive de sauvegarde dans le dossier depuis lequel elle sera servie, <em>puis</em> lancez la restauration."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="Votre paramètre Utiliser le dossier public est incompatible avec votre environnement actuel."
PUBLICFOLDER_ERR_PUBLIC_MISSING="Le dossier public que vous avez choisi n'existe pas."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="Le dossier public que vous avez choisi n'est pas accessible en écriture."

SETUP_LBL_NOSA_HEAD="Aucun Super Utilisateur trouvé"
SETUP_LBL_NOSA_DESC="Il s'agit d'une situation anormale et hautement problématique. L'absence de Super Utilisateurs sur le site restauré rendra toute action administrative impossible. En d'autres termes, votre site restauré sera totalement inutilisable."
SETUP_LBL_NOSA_ACTION_REQUIRED="Action requise"
SETUP_LBL_NOSA_ACTION_SUMMARY="Assurez-vous que les tables <code>#__users</code> et <code>#__user_usergroup_map</code> ont été sauvegardées et <strong>restaurées</strong> intégralement."
SETUP_LBL_NOSA_ACTION_INFO="Revenez au début de la restauration en utilisant les boutons Précédent. Lorsque vous êtes à l'étape de restauration de la base de données <code>site</code>, veillez à ne pas utiliser la fonctionnalité de sélection des tables à restaurer. Si vous <em>devez</em> utiliser cette fonctionnalité, par exemple pour contourner un problème de restauration de base de données, assurez-vous de sélectionner les tables <code>#__users</code> et <code>#__user_usergroup_map</code>."

SETUP_LBL_ROBOTS_LBL="Robots (moteur de recherche)"
SETUP_LBL_ROBOTS_OPT_NO_CHANGE="Aucune modification"
SETUP_LBL_ROBOTS_OPT_INDEX_FOLLOW="Indexer et suivre les liens"
SETUP_LBL_ROBOTS_OPT_INDEX_NO_FOLLOW="Indexer mais ne pas suivre les liens"
SETUP_LBL_ROBOTS_OPT_NO_INDEX_NO_FOLLOW="Ne pas indexer, ne pas suivre les liens"
