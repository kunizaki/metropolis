;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Pasta Pública"

PUBLICFOLDER_LBL_INFO_HEAD="O Joomla!&trade; foi instalado com uma pasta pública personalizada"
PUBLICFOLDER_LBL_INFO_BODY="O Joomla!&trade; foi configurado para utilizar uma pasta pública (de onde o site era servido: <code>%s</code>) diferente da sua pasta raiz (onde os ficheiros do Joomla foram instalados: <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Usar pasta pública personalizada"
PUBLICFOLDER_LBL_BUT_WINDOWS="Está, no entanto, a restaurar este site num servidor Windows. O Joomla não suporta a funcionalidade de pasta pública no Windows. Por isso, esta funcionalidade será desativada quando clicar em Seguinte."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Está, no entanto, a restaurar este site tendo extraído o arquivo de cópia de segurança diretamente dentro da raiz web. Por isso, esta funcionalidade será desativada quando clicar em Seguinte."
PUBLICFOLDER_LBL_BUT_CUSTOM="Parece ter a mesma configuração no servidor onde está a restaurar este site. Introduza a Pasta Pública no formulário abaixo e clique em Seguinte para garantir que todos os ficheiros e pastas necessários são movidos para o local correto."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Opções da Pasta Pública"
PUBLICFOLDER_LBL_NEWPUBLIC="Pasta pública"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Introduza o caminho absoluto para a pasta onde o seu site está alojado. Por exemplo, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Não pode utilizar a pasta para onde está a restaurar os ficheiros do Joomla como pasta pública. Se está a tentar anular a configuração da pasta pública, extraia o arquivo de cópia de segurança para a pasta a partir da qual vai ser servido, <em>e depois</em> execute o restauro."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="A definição Usar Pasta Pública é incompatível com o seu ambiente atual."
PUBLICFOLDER_ERR_PUBLIC_MISSING="A Pasta Pública escolhida não existe."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="A Pasta Pública escolhida não tem permissão de escrita."

SETUP_LBL_NOSA_HEAD="Nenhum Super Utilizador encontrado"
SETUP_LBL_NOSA_DESC="Esta é uma situação anormal e altamente problemática. Não ter Super Utilizadores no site restaurado tornará impossível realizar qualquer ação administrativa. Em poucas palavras, o seu site restaurado será completamente inutilizável."
SETUP_LBL_NOSA_ACTION_REQUIRED="Ação Necessária"
SETUP_LBL_NOSA_ACTION_SUMMARY="Certifique-se de que as tabelas <code>#__users</code> e <code>#__user_usergroup_map</code> foram incluídas na cópia de segurança <strong>e restauradas</strong> na íntegra."
SETUP_LBL_NOSA_ACTION_INFO="Volte ao início do restauro utilizando os botões Anterior. Quando estiver no passo de Restauro da Base de Dados da base de dados <code>site</code>, certifique-se de que não utiliza a funcionalidade de seleção das tabelas a restaurar. Se <em>tiver</em> de utilizar esta funcionalidade, por exemplo para contornar um problema de restauro da base de dados, certifique-se de que seleciona as tabelas <code>#__users</code> e <code>#__user_usergroup_map</code>."

