SETUP_LBL_ROBOTS_OPT_NO_CHANGE="Χωρίς αλλαγή"
SETUP_LBL_ROBOTS_OPT_INDEX_FOLLOW="Ευρετηρίαση και παρακολούθηση συνδέσμων"
SETUP_LBL_ROBOTS_OPT_INDEX_NO_FOLLOW="Ευρετηρίαση χωρίς παρακολούθηση συνδέσμων"
SETUP_LBL_ROBOTS_OPT_NO_INDEX_NO_FOLLOW="Μη ευρετηρίαση, μη παρακολούθηση συνδέσμων"
