;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Δημόσιος φάκελος"

PUBLICFOLDER_LBL_INFO_HEAD="Το Joomla!&trade; εγκαταστάθηκε με προσαρμοσμένο δημόσιο φάκελο"
PUBLICFOLDER_LBL_INFO_BODY="Το Joomla!&trade; ρυθμίστηκε να χρησιμοποιεί δημόσιο φάκελο (από τον οποίο εξυπηρετείται ο ιστότοπός σας: <code>%s</code>) διαφορετικό από τον βασικό κατάλογό του (όπου εγκαταστάθηκαν τα αρχεία Joomla: <code>%s</code>)."
PUBLICFOLDER_LBL_USE_SPLIT="Χρήση προσαρμοσμένου δημόσιου φακέλου"
PUBLICFOLDER_LBL_BUT_WINDOWS="Ωστόσο, επαναφέρετε αυτόν τον ιστότοπο σε κεντρικό υπολογιστή Windows. Το Joomla δεν υποστηρίζει τη δυνατότητα δημόσιου φακέλου στα Windows. Επομένως, αυτή η δυνατότητα θα απενεργοποιηθεί όταν κάνετε κλικ στο Επόμενο."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Ωστόσο, επαναφέρετε αυτόν τον ιστότοπο έχοντας εξαγάγει το αρχείο αντιγράφου ασφαλείας σας απευθείας μέσα στον βασικό κατάλογο ιστού. Επομένως, αυτή η δυνατότητα θα απενεργοποιηθεί όταν κάνετε κλικ στο Επόμενο."
PUBLICFOLDER_LBL_BUT_CUSTOM="Φαίνεται να έχετε την ίδια ρύθμιση στον διακομιστή στον οποίο επαναφέρετε αυτόν τον ιστότοπο. Εισαγάγετε τον Δημόσιο φάκελο στη φόρμα παρακάτω και κάντε κλικ στο Επόμενο για να βεβαιωθείτε ότι όλα τα απαραίτητα αρχεία και φάκελοι μεταφερθούν στη σωστή τους θέση."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Επιλογές δημόσιου φακέλου"
PUBLICFOLDER_LBL_NEWPUBLIC="Δημόσιος φάκελος"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Εισαγάγετε την απόλυτη διαδρομή προς τον φάκελο από τον οποίο φιλοξενείται ο ιστότοπός σας. Για παράδειγμα, <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Δεν μπορείτε να χρησιμοποιήσετε τον φάκελο στον οποίο επαναφέρετε τα αρχεία Joomla ως δημόσιο φάκελο. Εάν προσπαθείτε να αναιρέσετε τη ρύθμιση δημόσιου φακέλου, εξαγάγετε το αρχείο αντιγράφου ασφαλείας στον φάκελο από τον οποίο πρόκειται να εξυπηρετείται, <em>και μετά</em> εκτελέστε την επαναφορά."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="Η ρύθμιση Χρήση δημόσιου φακέλου δεν είναι συμβατή με το τρέχον περιβάλλον σας."
PUBLICFOLDER_ERR_PUBLIC_MISSING="Ο δημόσιος φάκελος που επιλέξατε δεν υπάρχει."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="Ο δημόσιος φάκελος που επιλέξατε δεν είναι εγγράψιμος."

SETUP_LBL_NOSA_HEAD="Δεν βρέθηκε Υπερ-χρήστης"
SETUP_LBL_NOSA_DESC="Πρόκειται για μια μη κανονική, εξαιρετικά προβληματική κατάσταση. Η έλλειψη Υπερ-χρηστών στον επαναφερόμενο ιστότοπο καθιστά αδύνατη οποιαδήποτε διαχειριστική ενέργεια σε αυτόν. Με άλλα λόγια, ο επαναφερόμενος ιστότοπός σας θα είναι εντελώς αχρησιμοποίητος."
SETUP_LBL_NOSA_ACTION_REQUIRED="Απαιτείται ενέργεια"
SETUP_LBL_NOSA_ACTION_SUMMARY="Βεβαιωθείτε ότι οι πίνακες <code>#__users</code> και <code>#__user_usergroup_map</code> έχουν συμπεριληφθεί στο αντίγραφο ασφαλείας <strong>και έχουν επαναφερθεί</strong> πλήρως."
SETUP_LBL_NOSA_ACTION_INFO="Επιστρέψτε στην αρχή της επαναφοράς χρησιμοποιώντας τα κουμπιά Προηγούμενο. Όταν βρίσκεστε στο βήμα Επαναφοράς βάσης δεδομένων της βάσης δεδομένων <code>site</code>, βεβαιωθείτε ότι δεν χρησιμοποιείτε τη λειτουργία επιλογής πινάκων για επαναφορά. Εάν <em>πρέπει</em> να χρησιμοποιήσετε αυτή τη λειτουργία, για παράδειγμα για να παρακάμψετε ένα πρόβλημα επαναφοράς βάσης δεδομένων, βεβαιωθείτε ότι έχετε επιλέξει τους πίνακες <code>#__users</code> και <code>#__user_usergroup_map</code>."

