BRS_PLATFORM_TITLE_JOOMLA="Joomla!"

;; Public Folder (Joomla 5+)
PUBLICFOLDER_LBL_TITLE="Öffentlicher Ordner"

PUBLICFOLDER_LBL_INFO_HEAD="Joomla!&trade; wurde mit einem benutzerdefinierten öffentlichen Ordner installiert"
PUBLICFOLDER_LBL_INFO_BODY="Joomla!&trade; wurde so konfiguriert, dass ein öffentlicher Ordner (von dem aus Ihre Website bereitgestellt wurde: <code>%s</code>) verwendet wird, der sich vom Stammverzeichnis (in dem die Joomla-Dateien installiert wurden: <code>%s</code>) unterscheidet."
PUBLICFOLDER_LBL_USE_SPLIT="Benutzerdefinierten öffentlichen Ordner verwenden"
PUBLICFOLDER_LBL_BUT_WINDOWS="Sie stellen diese Website jedoch auf einem Windows-Host wieder her. Joomla unterstützt die Funktion des öffentlichen Ordners unter Windows nicht. Daher wird diese Funktion deaktiviert, wenn Sie auf Weiter klicken."
PUBLICFOLDER_LBL_BUT_DIRECTLY="Sie stellen diese Website jedoch wieder her, indem Sie Ihr Backup-Archiv direkt im Web-Stammverzeichnis entpackt haben. Daher wird diese Funktion deaktiviert, wenn Sie auf Weiter klicken."
PUBLICFOLDER_LBL_BUT_CUSTOM="Sie scheinen auf dem Server, auf dem Sie diese Website wiederherstellen, die gleiche Konfiguration zu haben. Geben Sie den öffentlichen Ordner im nachfolgenden Formular ein und klicken Sie auf Weiter, um sicherzustellen, dass alle erforderlichen Dateien und Ordner an den richtigen Speicherort verschoben werden."
PUBLICFOLDER_LBL_OPTIONS_HEADER="Optionen für den öffentlichen Ordner"
PUBLICFOLDER_LBL_NEWPUBLIC="Öffentlicher Ordner"
PUBLICFOLDER_LBL_NEWPUBLIC_HELP="Geben Sie den absoluten Pfad zu dem Ordner ein, in dem Ihre Website gehostet wird. Zum Beispiel: <code>%s</code>."
PUBLICFOLDER_ERR_PUBLIC_IS_ROOT="Sie können den Ordner, in den Sie Ihre Joomla-Dateien wiederherstellen, nicht als öffentlichen Ordner verwenden. Wenn Sie die Einrichtung des öffentlichen Ordners rückgängig machen möchten, entpacken Sie das Backup-Archiv in den Ordner, von dem aus es bereitgestellt werden soll, und führen Sie <em>dann</em> die Wiederherstellung durch."

PUBLICFOLDER_ERR_WRONG_USE_PUBLIC="Ihre Einstellung für den öffentlichen Ordner ist mit Ihrer aktuellen Umgebung nicht kompatibel."
PUBLICFOLDER_ERR_PUBLIC_MISSING="Der von Ihnen gewählte öffentliche Ordner existiert nicht."
PUBLICFOLDER_ERR_PUBLIC_UNWRITEABLE="Der von Ihnen gewählte öffentliche Ordner ist nicht beschreibbar."

SETUP_LBL_NOSA_HEAD="Kein Super User gefunden"
SETUP_LBL_NOSA_DESC="Dies ist eine außergewöhnliche und äußerst problematische Situation. Ohne Super User auf der wiederhergestellten Website ist es unmöglich, administrative Maßnahmen durchzuführen. Mit anderen Worten: Ihre wiederhergestellte Website ist vollständig unbrauchbar."
SETUP_LBL_NOSA_ACTION_REQUIRED="Handlung erforderlich"
SETUP_LBL_NOSA_ACTION_SUMMARY="Stellen Sie sicher, dass die Tabellen <code>#__users</code> und <code>#__user_usergroup_map</code> vollständig gesichert <strong>und wiederhergestellt</strong> wurden."
SETUP_LBL_NOSA_ACTION_INFO="Gehen Sie mit den Zurück-Schaltflächen zum Anfang der Wiederherstellung zurück. Wenn Sie sich im Schritt Datenbankwiederherstellung der <code>site</code>-Datenbank befinden, achten Sie darauf, die Funktion zur Auswahl der wiederherzustellenden Tabellen nicht zu verwenden. Falls Sie <em>diese</em> Funktion verwenden müssen, etwa um ein Problem bei der Datenbankwiederherstellung zu umgehen, stellen Sie sicher, dass Sie die Tabellen <code>#__users</code> und <code>#__user_usergroup_map</code> auswählen."

SETUP_LBL_ROBOTS_LBL="Robots (Suchmaschine)"
SETUP_LBL_ROBOTS_OPT_NO_CHANGE="Keine Änderung"
SETUP_LBL_ROBOTS_OPT_INDEX_FOLLOW="Indexieren und Links folgen"
SETUP_LBL_ROBOTS_OPT_INDEX_NO_FOLLOW="Indexieren, aber Links nicht folgen"
SETUP_LBL_ROBOTS_OPT_NO_INDEX_NO_FOLLOW="Nicht indexieren, Links nicht folgen"
